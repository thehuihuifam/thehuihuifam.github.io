<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타이니 워리어 러시</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0d0d12;
    color: #e8e8ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 100vh;
    position: relative;
  }
  h1 {
    font-size: 14px;
    color: #ffcc00;
    text-align: center;
    letter-spacing: 2px;
    font-weight: 800;
    text-shadow: 0 0 12px rgba(255,204,0,0.6);
  }
  .castle-panel {
    background: linear-gradient(180deg, #1a1a24 0%, #0f0f18 100%);
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .castle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #888;
    letter-spacing: 0.5px;
  }
  .castle-row .wave-tag { color: #ffcc00; font-weight: 800; font-size: 13px; }
  .castle-row .gold-tag { color: #ffcc00; font-weight: 700; }
  .hp-bar {
    width: 100%;
    height: 16px;
    background: #1e1e2a;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    border: 1px solid #2a2a3a;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ff66 0%, #88ff66 100%);
    transition: width 0.4s ease, background 0.3s ease;
    border-radius: 7px;
  }
  .hp-fill.warn { background: linear-gradient(90deg, #ffcc00 0%, #ff9900 100%); }
  .hp-fill.danger { background: linear-gradient(90deg, #ff3366 0%, #ff0044 100%); animation: pulseRed 0.6s infinite alternate; }
  .hp-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    color: #0d0d12;
    text-shadow: 0 0 4px rgba(255,255,255,0.4);
  }
  @keyframes pulseRed {
    from { box-shadow: inset 0 0 0 0 rgba(255,51,102,0); }
    to   { box-shadow: inset 0 0 12px 2px rgba(255,51,102,0.6); }
  }
  .battlefield {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: #0a0a12;
    border: 1px solid #1f1f2e;
    border-radius: 10px;
    padding: 10px 8px;
    min-height: 108px;
  }
  .slot {
    background: #14141f;
    border: 2px dashed #2a2a3a;
    border-radius: 8px;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .slot.empty::after {
    content: '빈 슬롯';
    color: #3a3a4a;
    font-size: 10px;
    letter-spacing: 1px;
  }
  .slot.filled {
    border-style: solid;
    border-color: #4a90e2;
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: 0 0 12px rgba(74,144,226,0.4);
    animation: slotPop 0.35s ease;
  }
  .slot .slot-pos {
    position: absolute;
    top: 3px;
    left: 5px;
    font-size: 8px;
    color: #4a6a8a;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  @keyframes slotPop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .warrior-emoji { font-size: 26px; filter: drop-shadow(0 0 6px rgba(74,144,226,0.8)); }
  .warrior-name { font-size: 10px; font-weight: 700; color: #a8cfff; letter-spacing: 0.5px; }
  .warrior-stats { font-size: 9px; color: #88a8cc; font-family: 'Courier New', monospace; }
  .enemy-preview {
    background: #1a0f14;
    border: 1px solid #3a1a24;
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .enemy-preview .label { color: #ff6688; letter-spacing: 0.5px; font-weight: 700; }
  .enemy-preview .count { color: #ff3366; font-weight: 800; font-family: 'Courier New', monospace; }
  .enemy-preview .detail { color: #885566; font-size: 10px; font-family: 'Courier New', monospace; }
  .cards-area {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    min-height: 118px;
  }
  .card {
    background: linear-gradient(180deg, #1f1f2e 0%, #14141f 100%);
    border: 2px solid #2a2a3a;
    border-radius: 10px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 118px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .card.placeholder {
    cursor: default;
    background: #0f0f18;
    border-style: dashed;
    color: #3a3a4a;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .card:not(.placeholder):active { transform: scale(0.95); }
  .card.appear { animation: cardIn 0.35s ease backwards; }
  .card.appear:nth-child(2) { animation-delay: 0.08s; }
  .card.appear:nth-child(3) { animation-delay: 0.16s; }
  @keyframes cardIn {
    from { transform: translateY(-20px) scale(0.8); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .card.selected {
    border-color: #ffcc00;
    box-shadow: 0 0 18px rgba(255,204,0,0.7);
    transform: scale(1.03);
  }
  .card.disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }
  .card-emoji { font-size: 26px; }
  .card-name { font-size: 10px; font-weight: 700; color: #e8e8ee; letter-spacing: 0.5px; }
  .card-desc { font-size: 9px; color: #888; font-family: 'Courier New', monospace; }
  .card.rarity-COMMON { border-color: #4a4a5a; }
  .card.rarity-RARE   { border-color: #4a90e2; box-shadow: 0 0 8px rgba(74,144,226,0.4); }
  .card.rarity-LEGEND { border-color: #ffcc00; box-shadow: 0 0 18px rgba(255,204,0,0.8); animation: legendGlow 1s infinite alternate; }
  @keyframes legendGlow {
    from { box-shadow: 0 0 12px rgba(255,204,0,0.5); }
    to   { box-shadow: 0 0 26px rgba(255,204,0,1); }
  }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .deploy-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .deploy-btn {
    min-height: 48px;
    background: #14141f;
    border: 2px solid #2a2a3a;
    border-radius: 8px;
    color: #888;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .deploy-btn:not(:disabled):active { transform: scale(0.95); }
  .deploy-btn:not(:disabled) {
    border-color: #4a90e2;
    color: #a8cfff;
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: 0 0 10px rgba(74,144,226,0.4);
  }
  .deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .deploy-btn .plus { font-size: 16px; display: block; line-height: 1; margin-bottom: 2px; }
  #btn-draw-card {
    min-height: 56px;
    background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
    border: none;
    border-radius: 10px;
    color: #0d0d12;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 0 #a66800, 0 0 20px rgba(255,204,0,0.5);
    transition: all 0.1s;
  }
  #btn-draw-card:not(:disabled):active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #a66800, 0 0 20px rgba(255,204,0,0.5);
  }
  #btn-draw-card:disabled {
    background: #2a2a3a;
    color: #555;
    box-shadow: none;
    cursor: not-allowed;
  }
  #game-output {
    background: #0a0a12;
    border-radius: 8px;
    padding: 8px 10px;
    height: 130px;
    overflow-y: auto;
    font-family: 'Courier New', Courier, monospace;
    font-size: 10.5px;
    line-height: 1.5;
    color: #888;
    border: 1px solid #1f1f2e;
  }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line:last-child { color: #ffcc00; }
  .log-line.highlight { color: #00ff66; font-weight: 700; }
  .log-line.danger { color: #ff3366; font-weight: 700; }
  #flash {
    position: fixed;
    inset: 0;
    background: #ffcc00;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.15s;
  }
  #flash.active { opacity: 0.5; }
  #flash.victory { background: #00ff66; }
  #flash.danger { background: #ff3366; }
  .dmg-popup {
    position: fixed;
    font-size: 22px;
    font-weight: 900;
    color: #ff3366;
    text-shadow: 0 0 8px rgba(255,51,102,0.9), 2px 2px 0 #000;
    pointer-events: none;
    z-index: 1000;
    animation: dmgFloat 0.9s ease-out forwards;
    font-family: 'Courier New', monospace;
  }
  .dmg-popup.gold { color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.9), 2px 2px 0 #000; }
  .dmg-popup.green { color: #00ff66; text-shadow: 0 0 8px rgba(0,255,102,0.9), 2px 2px 0 #000; }
  @keyframes dmgFloat {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { transform: translateY(-10px) scale(1.3); opacity: 1; }
    100% { transform: translateY(-70px) scale(1); opacity: 0; }
  }
  #result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    padding: 20px;
  }
  #result-overlay.show { display: flex; }
  .result-box {
    background: #14141f;
    border: 3px solid #ffcc00;
    border-radius: 16px;
    padding: 26px 20px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 0 40px rgba(255,204,0,0.6);
  }
  .result-box.defeat { border-color: #ff3366; box-shadow: 0 0 40px rgba(255,51,102,0.6); }
  .result-box h2 { font-size: 22px; letter-spacing: 3px; margin-bottom: 12px; color: #ffcc00; }
  .result-box.defeat h2 { color: #ff3366; }
  .result-box p { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .result-box .score { font-size: 28px; color: #00ff66; font-weight: 900; margin: 12px 0; font-family: 'Courier New', monospace; }
  #btn-restart {
    margin-top: 14px;
    min-height: 48px;
    padding: 0 24px;
    background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
    border: none;
    border-radius: 10px;
    color: #0d0d12;
    font-family: inherit;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 0 #a66800;
  }
  #btn-restart:active { transform: translateY(3px); box-shadow: 0 1px 0 #a66800; }
</style>
</head>
<body>
<div id="app">
  <h1>⚔️ TINY WARRIORS RUSH ⚔️</h1>

  <div class="castle-panel">
    <div class="castle-row">
      <span class="wave-tag">WAVE <span id="stat-wave">1</span> / <span id="stat-max-wave">3</span></span>
      <span class="gold-tag">💰 <span id="stat-gold">0</span></span>
    </div>
    <div class="hp-bar">
      <div id="castle-hp-fill" class="hp-fill" style="width: 100%;"></div>
      <div class="hp-text">
        <span id="stat-castle-hp">50</span> / <span id="stat-castle-max-hp">50</span>
      </div>
    </div>
  </div>

  <div class="battlefield" id="battlefield">
    <div class="slot empty" id="slot-0" data-slot="0"><span class="slot-pos">전열</span></div>
    <div class="slot empty" id="slot-1" data-slot="1"><span class="slot-pos">중열</span></div>
    <div class="slot empty" id="slot-2" data-slot="2"><span class="slot-pos">후열</span></div>
  </div>

  <div class="enemy-preview">
    <span class="label">적 출현</span>
    <span class="count" id="enemy-count">0 마리</span>
    <span class="detail" id="enemy-detail">HP - / ATK -</span>
  </div>

  <div class="cards-area" id="cards-area">
    <div class="card placeholder">카드</div>
    <div class="card placeholder">카드를</div>
    <div class="card placeholder">뽑으세요</div>
  </div>

  <div class="actions">
    <div class="deploy-row">
      <button id="btn-deploy-0" class="deploy-btn" disabled><span class="plus">+</span>전열</button>
      <button id="btn-deploy-1" class="deploy-btn" disabled><span class="plus">+</span>중열</button>
      <button id="btn-deploy-2" class="deploy-btn" disabled><span class="plus">+</span>후열</button>
    </div>
    <button id="btn-draw-card">카드 뽑기</button>
  </div>

  <div id="game-output"></div>
</div>

<div id="flash"></div>

<div id="result-overlay">
  <div class="result-box" id="result-box">
    <h2 id="result-title">🏆 VICTORY 🏆</h2>
    <p id="result-wave">도달 웨이브: 3 / 3</p>
    <div class="score" id="result-score">0</div>
    <p id="result-detail"></p>
    <button id="btn-restart">다시 도전</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAX_WAVE = 3;
  var CASTLE_MAX_HP = 50;
  var SLOT_COUNT = 3;

  var CARD_TANKER = {
    id: 'TANKER', name: '탱커 소환', emoji: '🛡️', rarity: 'COMMON', type: 'SUMMON',
    desc: 'HP30/ATK3',
    warrior: { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 }
  };
  var CARD_ATK = {
    id: 'ATK_BOOST', name: '공격 강화', emoji: '⚔️', rarity: 'RARE', type: 'INSTANT',
    desc: '전사 ATK +2'
  };
  var CARD_HEAL = {
    id: 'HEAL', name: '성 회복', emoji: '💚', rarity: 'RARE', type: 'INSTANT',
    desc: '성 HP +5'
  };
  var CARD_POOL = [CARD_TANKER, CARD_ATK, CARD_HEAL];

  var WAVES = [
    { enemies: [{ hp: 6, atk: 2 }, { hp: 6, atk: 2 }] },
    { enemies: [{ hp: 8, atk: 3 }, { hp: 8, atk: 3 }, { hp: 8, atk: 3 }] },
    { enemies: [{ hp: 12, atk: 4 }, { hp: 12, atk: 4 }, { hp: 12, atk: 4 }, { hp: 12, atk: 4 }] }
  ];

  window.gameState = {
    wave: 1,
    maxWave: MAX_WAVE,
    castleHp: CASTLE_MAX_HP,
    castleMaxHp: CASTLE_MAX_HP,
    gold: 0,
    warriors: [null, null, null],
    availableCards: [],
    selectedCard: null,
    pendingDeploy: false,
    lastActionStatus: 'IDLE',
    isGameOver: false,
    isVictory: false,
    log: []
  };

  var resolving = false;

  var els = {
    statWave: document.getElementById('stat-wave'),
    statMaxWave: document.getElementById('stat-max-wave'),
    statGold: document.getElementById('stat-gold'),
    statCastleHp: document.getElementById('stat-castle-hp'),
    statCastleMaxHp: document.getElementById('stat-castle-max-hp'),
    castleHpFill: document.getElementById('castle-hp-fill'),
    enemyCount: document.getElementById('enemy-count'),
    enemyDetail: document.getElementById('enemy-detail'),
    cardsArea: document.getElementById('cards-area'),
    battlefield: document.getElementById('battlefield'),
    output: document.getElementById('game-output'),
    btnDraw: document.getElementById('btn-draw-card'),
    btnRestart: document.getElementById('btn-restart'),
    flash: document.getElementById('flash'),
    resultOverlay: document.getElementById('result-overlay'),
    resultBox: document.getElementById('result-box'),
    resultTitle: document.getElementById('result-title'),
    resultWave: document.getElementById('result-wave'),
    resultScore: document.getElementById('result-score'),
    resultDetail: document.getElementById('result-detail')
  };

  var btnDeploy = [
    document.getElementById('btn-deploy-0'),
    document.getElementById('btn-deploy-1'),
    document.getElementById('btn-deploy-2')
  ];

  function log(text, cls) {
    var div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    els.output.appendChild(div);
    while (els.output.children.length > 200) {
      els.output.removeChild(els.output.firstChild);
    }
    els.output.scrollTop = els.output.scrollHeight;
    window.gameState.log.push(text);
    if (window.gameState.log.length > 500) window.gameState.log.shift();
  }

  function flash(color) {
    els.flash.className = '';
    void els.flash.offsetWidth;
    els.flash.classList.add('active');
    if (color === 'victory') els.flash.classList.add('victory');
    else if (color === 'danger') els.flash.classList.add('danger');
    setTimeout(function () { els.flash.classList.remove('active'); }, 150);
  }

  function popDamage(text, color, anchorEl) {
    var pop = document.createElement('div');
    pop.className = 'dmg-popup' + (color ? ' ' + color : '');
    pop.textContent = text;
    var rect;
    if (anchorEl) {
      rect = anchorEl.getBoundingClientRect();
      pop.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      pop.style.top = (rect.top + rect.height / 2 - 10) + 'px';
    } else {
      pop.style.left = (window.innerWidth / 2 - 20) + 'px';
      pop.style.top = (window.innerHeight / 2 - 10) + 'px';
    }
    document.body.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 950);
  }

  function renderCastle() {
    var pct = Math.max(0, window.gameState.castleHp) / window.gameState.castleMaxHp * 100;
    els.castleHpFill.style.width = pct + '%';
    els.castleHpFill.classList.remove('warn', 'danger');
    if (pct <= 20) els.castleHpFill.classList.add('danger');
    else if (pct <= 50) els.castleHpFill.classList.add('warn');
    els.statCastleHp.textContent = String(Math.max(0, window.gameState.castleHp));
    els.statCastleMaxHp.textContent = String(window.gameState.castleMaxHp);
  }

  function renderStats() {
    els.statWave.textContent = String(Math.min(window.gameState.wave, window.gameState.maxWave));
    els.statMaxWave.textContent = String(window.gameState.maxWave);
    els.statGold.textContent = String(window.gameState.gold);
    renderCastle();
  }

  function renderEnemyPreview() {
    if (window.gameState.isGameOver || window.gameState.isVictory || window.gameState.wave > window.gameState.maxWave) {
      els.enemyCount.textContent = '—';
      els.enemyDetail.textContent = '게임 종료';
      return;
    }
    var def = WAVES[window.gameState.wave - 1];
    if (!def) {
      els.enemyCount.textContent = '0 마리';
      els.enemyDetail.textContent = 'HP - / ATK -';
      return;
    }
    els.enemyCount.textContent = def.enemies.length + ' 마리';
    els.enemyDetail.textContent = 'HP ' + def.enemies[0].hp + ' / ATK ' + def.enemies[0].atk;
  }

  function renderBattlefield() {
    var positions = ['전열', '중열', '후열'];
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEl = document.getElementById('slot-' + i);
      var w = window.gameState.warriors[i];
      if (w) {
        slotEl.className = 'slot filled';
        slotEl.innerHTML =
          '<span class="slot-pos">' + positions[i] + '</span>' +
          '<div class="warrior-emoji">' + w.emoji + '</div>' +
          '<div class="warrior-name">' + w.name + '</div>' +
          '<div class="warrior-stats">HP' + w.hp + ' ATK' + w.atk + '</div>';
      } else {
        slotEl.className = 'slot empty';
        slotEl.innerHTML = '<span class="slot-pos">' + positions[i] + '</span>';
      }
    }
  }

  function renderCards() {
    var cards = window.gameState.availableCards;
    if (!cards || cards.length === 0) {
      els.cardsArea.innerHTML =
        '<div class="card placeholder">카드</div>' +
        '<div class="card placeholder">카드를</div>' +
        '<div class="card placeholder">뽑으세요</div>';
      return;
    }
    els.cardsArea.innerHTML = '';
    for (var i = 0; i < cards.length; i++) {
      (function (idx) {
        var c = cards[idx];
        var cardEl = document.createElement('div');
        cardEl.className = 'card appear rarity-' + c.rarity;
        if (window.gameState.selectedCard === c) cardEl.classList.add('selected');
        cardEl.setAttribute('data-card-index', String(idx));
        cardEl.id = 'card-choice-' + idx;
        cardEl.innerHTML =
          '<div class="card-emoji">' + c.emoji + '</div>' +
          '<div class="card-name">' + c.name + '</div>' +
          '<div class="card-desc">' + c.desc + '</div>';
        cardEl.addEventListener('click', function () { onCardClick(idx); });
        els.cardsArea.appendChild(cardEl);
      })(i);
    }
  }

  function renderButtons() {
    var s = window.gameState;
    var gameOver = s.isGameOver || s.isVictory;
    var canDraw = !gameOver && !resolving && !s.pendingDeploy && (!s.availableCards || s.availableCards.length === 0);
    els.btnDraw.disabled = !canDraw;

    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEmpty = s.warriors[i] === null;
      var canDeploy = s.pendingDeploy && slotEmpty && !gameOver && !resolving;
      btnDeploy[i].disabled = !canDeploy;
    }
  }

  function render() {
    renderStats();
    renderEnemyPreview();
    renderBattlefield();
    renderCards();
    renderButtons();
  }

  function drawRandomCard() {
    var r = Math.random() * 100;
    if (r < 70) return CARD_TANKER;
    if (r < 95) return CARD_ATK;
    return CARD_HEAL;
  }

  function drawThreeCards() {
    var cards = [drawRandomCard(), drawRandomCard(), drawRandomCard()];
    var hasCommon = false;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].rarity === 'COMMON') { hasCommon = true; break; }
    }
    if (!hasCommon) cards[0] = CARD_TANKER;
    return cards;
  }

  function onDrawClick() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) return;
    if (resolving) return;
    if (s.availableCards && s.availableCards.length > 0) return;
    if (s.pendingDeploy) return;

    s.availableCards = drawThreeCards();
    s.selectedCard = null;
    s.pendingDeploy = false;
    s.lastActionStatus = 'DRAW_SUCCESS';

    var names = [];
    for (var i = 0; i < s.availableCards.length; i++) names.push(s.availableCards[i].name);
    log('[DRAW] Drew 3 cards: ' + names.join(', ') + '.');
    render();
  }

  function onCardClick(idx) {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) return;
    if (resolving) return;
    if (!s.availableCards || s.availableCards.length === 0) return;
    if (s.selectedCard) return;

    var card = s.availableCards[idx];
    if (!card) return;

    s.selectedCard = card;
    s.lastActionStatus = 'PICK_SUCCESS';
    log('[PICK] Picked ' + card.name + '. Effect: ' + card.desc);

    if (card.type === 'SUMMON') {
      s.pendingDeploy = true;
      flash('default');
      render();
    } else if (card.type === 'INSTANT') {
      applyInstant(card);
      s.pendingDeploy = false;
      s.availableCards = [];
      s.selectedCard = null;
      s.lastActionStatus = 'INSTANT_SUCCESS';
      resolving = true;
      render();
      setTimeout(function () {
        resolving = false;
        resolveWave();
      }, 250);
    }
  }

  function applyInstant(card) {
    var s = window.gameState;
    if (card.id === 'ATK_BOOST') {
      var count = 0;
      for (var i = 0; i < s.warriors.length; i++) {
        if (s.warriors[i]) { s.warriors[i].atk += 2; count++; }
      }
      log('[EFFECT] 전사 ATK +2 (대상 ' + count + '명)');
      if (count > 0) popDamage('+2 ATK', 'gold');
    } else if (card.id === 'HEAL') {
      var before = s.castleHp;
      s.castleHp = Math.min(s.castleMaxHp, s.castleHp + 5);
      var gained = s.castleHp - before;
      log('[EFFECT] 성 HP +' + gained + ' (HP: ' + s.castleHp + '/' + s.castleMaxHp + ')');
      popDamage('+' + gained + ' HP', 'green');
    }
  }

  function onDeployClick(slotIdx) {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) return;
    if (resolving) return;
    if (!s.pendingDeploy) return;
    if (s.warriors[slotIdx] !== null) return;
    if (!s.selectedCard || !s.selectedCard.warrior) return;

    var w = s.selectedCard.warrior;
    s.warriors[slotIdx] = {
      name: w.name, emoji: w.emoji, hp: w.hp, maxHp: w.maxHp, atk: w.atk
    };
    s.lastActionStatus = 'DEPLOY_SUCCESS';
    log('[DEPLOY] Deployed ' + w.name + ' at slot ' + (slotIdx + 1) + '.');

    s.pendingDeploy = false;
    s.availableCards = [];
    s.selectedCard = null;
    resolving = true;
    flash('default');
    render();

    setTimeout(function () {
      resolving = false;
      resolveWave();
    }, 250);
  }

  function resolveWave() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) return;
    if (s.wave > s.maxWave) return;

    var def = WAVES[s.wave - 1];
    if (!def) return;

    var enemies = [];
    for (var k = 0; k < def.enemies.length; k++) {
      enemies.push({ hp: def.enemies[k].hp, atk: def.enemies[k].atk, maxHp: def.enemies[k].hp });
    }

    var aliveWarriors = [];
    for (var i = SLOT_COUNT - 1; i >= 0; i--) {
      if (s.warriors[i]) aliveWarriors.push(s.warriors[i]);
    }

    log('[COMBAT] Wave ' + s.wave + ' combat begins. Warriors: ' + aliveWarriors.length + ', Enemies: ' + enemies.length);

    for (var w = 0; w < aliveWarriors.length; w++) {
      var targetIdx = -1;
      for (var j = 0; j < enemies.length; j++) {
        if (enemies[j].hp > 0) { targetIdx = j; break; }
      }
      if (targetIdx < 0) break;
      var atk = aliveWarriors[w].atk;
      enemies[targetIdx].hp -= atk;
      log('[COMBAT] ' + aliveWarriors[w].name + ' dealt ' + atk + ' damage to Enemy ' + (targetIdx + 1) + '.');
    }

    var remaining = [];
    for (var m = 0; m < enemies.length; m++) {
      if (enemies[m].hp > 0) remaining.push(enemies[m]);
    }

    var perfect = remaining.length === 0;
    var dmgToCastle = 0;
    for (var n = 0; n < remaining.length; n++) dmgToCastle += remaining[n].atk;

    if (dmgToCastle > 0) {
      s.castleHp = Math.max(0, s.castleHp - dmgToCastle);
      log('[DAMAGE] ' + remaining.length + ' enemies reached castle. -' + dmgToCastle + ' HP.', 'danger');
      flash('danger');
      popDamage('-' + dmgToCastle, '', null);
    }

    var clutch = s.castleHp > 0 && s.castleHp <= 5;
    var baseGold = 5;
    if (perfect) baseGold += 5;
    if (clutch) baseGold *= 2;
    s.gold += baseGold;

    if (perfect) {
      log('[WAVE] Wave ' + s.wave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: YES', 'highlight');
      flash('victory');
      popDamage('PERFECT! +' + baseGold + '💰', 'gold');
      s.lastActionStatus = 'WAVE_PERFECT';
    } else if (clutch) {
      log('[WAVE] Wave ' + s.wave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO', 'highlight');
      log('[CLUTCH] 성 HP 5 이하! 골드 2배 (+' + baseGold + ')', 'highlight');
      popDamage('CLUTCH! +' + baseGold + '💰', 'gold');
      s.lastActionStatus = 'WAVE_CLEAR';
    } else {
      log('[WAVE] Wave ' + s.wave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO');
      popDamage('+' + baseGold + '💰', 'gold');
      s.lastActionStatus = 'WAVE_CLEAR';
    }

    s.wave += 1;

    if (s.castleHp <= 0) {
      s.isGameOver = true;
      s.lastActionStatus = 'GAME_OVER';
      log('[GAME OVER] Castle destroyed at wave ' + (s.wave - 1) + '.', 'danger');
      showResult(false);
    } else if (s.wave > s.maxWave) {
      s.isVictory = true;
      s.lastActionStatus = 'VICTORY';
      var score = calculateScore();
      log('[VICTORY] All ' + s.maxWave + ' waves cleared. Score: ' + score, 'highlight');
      showResult(true);
    } else {
      log('[TURN] Wave ' + s.wave + ' begins.');
    }

    render();
  }

  function calculateScore() {
    var s = window.gameState;
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) {
      if (s.warriors[i]) warriorsAlive++;
    }
    return s.gold * 10 + s.castleHp * 2 + warriorsAlive * 20;
  }

  function showResult(isVictory) {
    var s = window.gameState;
    if (isVictory) {
      els.resultBox.className = 'result-box';
      els.resultTitle.textContent = '🏆 VICTORY 🏆';
    } else {
      els.resultBox.className = 'result-box defeat';
      els.resultTitle.textContent = '💀 DEFEAT 💀';
    }
    els.resultWave.textContent = '도달 웨이브: ' + (isVictory ? s.maxWave : s.wave - 1) + ' / ' + s.maxWave;
    els.resultScore.textContent = String(calculateScore());
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) { if (s.warriors[i]) warriorsAlive++; }
    els.resultDetail.textContent = '골드 ' + s.gold + ' · 성 HP ' + s.castleHp + ' · 생존 전사 ' + warriorsAlive;
    els.resultOverlay.classList.add('show');
  }

  function resetGame() {
    var s = window.gameState;
    s.wave = 1;
    s.castleHp = CASTLE_MAX_HP;
    s.castleMaxHp = CASTLE_MAX_HP;
    s.gold = 0;
    s.warriors = [null, null, null];
    s.availableCards = [];
    s.selectedCard = null;
    s.pendingDeploy = false;
    s.lastActionStatus = 'IDLE';
    s.isGameOver = false;
    s.isVictory = false;
    s.log = [];
    resolving = false;
    els.output.innerHTML = '';
    els.resultOverlay.classList.remove('show');
    log('[TURN] Wave 1 begins.');
    render();
  }

  els.btnDraw.addEventListener('click', onDrawClick);
  els.btnRestart.addEventListener('click', resetGame);

  for (var bi = 0; bi < SLOT_COUNT; bi++) {
    (function (idx) {
      btnDeploy[idx].addEventListener('click', function () { onDeployClick(idx); });
    })(bi);
  }

  window.runPhase1SelfTest = async function () {
    var results = [];
    var errors = [];

    function record(name, pass, detail) {
      results.push({ name: name, pass: !!pass, detail: detail || '' });
      if (!pass) errors.push(name + (detail ? ' :: ' + detail : ''));
    }

    resetGame();

    // 1. 초기 상태
    record('초기 wave === 1', window.gameState.wave === 1, 'wave=' + window.gameState.wave);
    record('초기 castleHp === 50', window.gameState.castleHp === 50, 'hp=' + window.gameState.castleHp);
    record('초기 gold === 0', window.gameState.gold === 0, 'gold=' + window.gameState.gold);
    record('초기 warriors 모두 null',
      window.gameState.warriors[0] === null &&
      window.gameState.warriors[1] === null &&
      window.gameState.warriors[2] === null);
    record('초기 availableCards 비어있음', window.gameState.availableCards.length === 0);
    record('초기 draw 버튼 활성', els.btnDraw.disabled === false);
    record('초기 deploy-0 비활성', btnDeploy[0].disabled === true);
    record('초기 deploy-1 비활성', btnDeploy[1].disabled === true);
    record('초기 deploy-2 비활성', btnDeploy[2].disabled === true);

    // 2. 카드 뽑기
    els.btnDraw.click();
    record('뽑기 후 카드 3장', window.gameState.availableCards.length === 3,
      'cards=' + window.gameState.availableCards.length);
    record('뽑기 후 lastActionStatus === DRAW_SUCCESS',
      window.gameState.lastActionStatus === 'DRAW_SUCCESS');
    record('뽑기 후 draw 버튼 비활성', els.btnDraw.disabled === true);
    record('뽑기 로그 포함', window.gameState.log.some(function (l) {
      return l.indexOf('[DRAW] Drew 3 cards:') === 0;
    }));

    // 3. COMMON 카드 탐색 및 선택
    var tankerIdx = -1;
    for (var i = 0; i < window.gameState.availableCards.length; i++) {
      if (window.gameState.availableCards[i].id === 'TANKER') { tankerIdx = i; break; }
    }
    record('COMMON 카드 1장 이상 존재', tankerIdx >= 0, 'tankerIdx=' + tankerIdx);

    if (tankerIdx >= 0) {
      var cardEl = document.getElementById('card-choice-' + tankerIdx);
      record('카드 DOM 존재', !!cardEl);
      if (cardEl) cardEl.click();
    }
    record('선택 후 selectedCard.id === TANKER',
      window.gameState.selectedCard && window.gameState.selectedCard.id === 'TANKER');
    record('선택 후 pendingDeploy === true', window.gameState.pendingDeploy === true);
    record('선택 후 lastActionStatus === PICK_SUCCESS',
      window.gameState.lastActionStatus === 'PICK_SUCCESS');
    record('선택 로그 포함', window.gameState.log.some(function (l) {
      return l.indexOf('[PICK] Picked 탱커 소환.') === 0;
    }));

    // 4. 배치
    record('배치 전 deploy-0 활성', btnDeploy[0].disabled === false);
    btnDeploy[0].click();
    record('배치 후 warriors[0] 존재', window.gameState.warriors[0] !== null);
    record('warriors[0].name === 탱커',
      window.gameState.warriors[0] && window.gameState.warriors[0].name === '탱커');
    record('배치 후 pendingDeploy === false', window.gameState.pendingDeploy === false);
    record('배치 로그 포함', window.gameState.log.some(function (l) {
      return l === '[DEPLOY] Deployed 탱커 at slot 1.';
    }));

    // 5. 웨이브 자동 진행 대기
    await new Promise(function (r) { setTimeout(r, 500); });

    record('웨이브 클리어 후 wave === 2', window.gameState.wave === 2,
      'wave=' + window.gameState.wave);
    record('웨이브 클리어 후 gold >= 5', window.gameState.gold >= 5,
      'gold=' + window.gameState.gold);
    record('lastActionStatus가 WAVE_CLEAR 또는 WAVE_PERFECT',
      window.gameState.lastActionStatus === 'WAVE_CLEAR' ||
      window.gameState.lastActionStatus === 'WAVE_PERFECT',
      'status=' + window.gameState.lastActionStatus);
    record('웨이브 클리어 로그 포함', window.gameState.log.some(function (l) {
      return l.indexOf('[WAVE] Wave 1 cleared.') === 0;
    }));

    // 6. DOM 동기화
    record('#stat-wave 텍스트 일치',
      els.statWave.textContent === String(Math.min(window.gameState.wave, window.gameState.maxWave)),
      'dom=' + els.statWave.textContent + ' state=' + window.gameState.wave);
    record('#stat-castle-hp 텍스트 일치',
      els.statCastleHp.textContent === String(Math.max(0, window.gameState.castleHp)),
      'dom=' + els.statCastleHp.textContent + ' state=' + window.gameState.castleHp);
    record('#stat-gold 텍스트 일치',
      els.statGold.textContent === String(window.gameState.gold),
      'dom=' + els.statGold.textContent + ' state=' + window.gameState.gold);

    var pass = errors.length === 0;
    var report = {
      result: pass ? 'PASS' : 'FAIL',
      totalTests: results.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      failed: results.filter(function (r) { return !r.pass; }).length,
      tests: results,
      errors: errors,
      finalState: {
        wave: window.gameState.wave,
        castleHp: window.gameState.castleHp,
        gold: window.gameState.gold,
        warriors: window.gameState.warriors.map(function (w) {
          return w ? { name: w.name, hp: w.hp, atk: w.atk } : null;
        }),
        lastActionStatus: window.gameState.lastActionStatus,
        isGameOver: window.gameState.isGameOver,
        isVictory: window.gameState.isVictory
      }
    };

    if (pass) console.log('[PHASE 1 TEST PASS]');
    else console.log('[PHASE 1 TEST FAIL]');
    console.log('Self-test report:', report);

    log('[TEST] ================================');
    log('[TEST] Phase 1 Self-Test: ' + report.result, pass ? 'highlight' : 'danger');
    log('[TEST] Passed: ' + report.passed + ' / ' + report.totalTests);
    if (!pass) {
      for (var e = 0; e < errors.length; e++) log('[TEST FAIL] ' + errors[e], 'danger');
    } else {
      log('[TEST] All assertions passed.', 'highlight');
    }
    log('[TEST] ================================');

    return report;
  };

  resetGame();
})();
</script>
</body>
</html>

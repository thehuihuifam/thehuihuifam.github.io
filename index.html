<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>방치형 클리커 풀버전</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #252540;
      --fg: #eee;
      --accent: #f9c74f;
      --btn: #4dabf7;
      --danger: #e63946;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
      transition: background 0.3s;
    }

    #game {
      width: 100%;
      max-width: 520px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
    }

    #coin {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      text-align: center;
    }

    #production {
      text-align: center;
      color: #aaa;
      margin-bottom: 8px;
    }

    #prestigeInfo {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      height: 64px;
      font-size: 1.2rem;
      margin: 6px 0;
      border: 0;
      border-radius: 14px;
      background: var(--btn);
      color: white;
      display: block;
      touch-action: manipulation;
      transition: transform 0.05s, background 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      background: #555 !important;
      color: #ccc;
    }

    #mainClickBtn {
      height: 80px;
      font-size: 1.7rem;
      background: var(--accent);
      color: #1a1a2e;
      font-weight: bold;
    }

    .upgradeBtn {
      background: #3b5e8c;
    }

    #prestigeBtn {
      background: var(--danger);
    }

    .themeBtn {
      background: #444;
    }

    .themeBtn.selected {
      outline: 3px solid var(--accent);
    }

    #goldenCoinBtn {
      background: #f9c74f;
      color: #1a1a2e;
      font-weight: bold;
      height: 70px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 10;
      max-width: 90vw;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
    }

    h3 {
      color: var(--accent);
      font-size: 1.2rem;
      margin: 8px 0 4px;
    }

    .ach {
      padding: 6px 0;
      border-bottom: 1px solid #444;
    }

    .ach.done {
      color: #9acd32;
    }

    #stats {
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .smallBtn {
      height: 44px;
      font-size: 1rem;
      background: #555;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="card" style="text-align:center">
      <div id="coin">0</div>
      <div id="production">생산: 0.0/s</div>
      <div id="prestigeInfo">환생 보너스: +0%</div>
    </div>

    <button id="mainClickBtn" onclick="manualClick()">💰 코인 획득!</button>

    <div id="goldenCoinContainer">
      <button id="goldenCoinBtn" style="display:none" onclick="collectGoldenCoin()">✨ 황금 코인 등장!</button>
    </div>

    <div id="toast"></div>

    <h3>업그레이드</h3>
    <div id="upgrades" class="card"></div>

    <button id="prestigeBtn" onclick="doPrestige()">🔁 환생 (+10% 영구, 필요 10,000코인)</button>

    <h3>테마</h3>
    <div id="themes" class="card"></div>

    <h3>업적</h3>
    <div id="achievements" class="card"></div>

    <h3>통계</h3>
    <div id="stats" class="card"></div>

    <button class="smallBtn" onclick="resetAll()">전체 초기화</button>
  </div>

  <script>
    // ========== 테마 정의 ==========
    const THEMES = {
      dark:   { name: '다크', cost: 0 },
      gold:   { name: '골드', cost: 500 },
      neon:   { name: '네온', cost: 1000 },
      forest: { name: '숲',  cost: 750 }
    };

    const THEME_VARS = {
      dark:   { '--bg':'#1a1a2e', '--card':'#252540', '--fg':'#eee', '--accent':'#f9c74f', '--btn':'#4dabf7', '--danger':'#e63946' },
      gold:   { '--bg':'#2e2600', '--card':'#4d3f00', '--fg':'#ffe9a8', '--accent':'#ffd700', '--btn':'#b8860b', '--danger':'#cc5500' },
      neon:   { '--bg':'#12002b', '--card':'#1e0040', '--fg':'#e0b0ff', '--accent':'#00ffff', '--btn':'#ff00ff', '--danger':'#ff4444' },
      forest: { '--bg':'#0f2e1f', '--card':'#1b4d2e', '--fg':'#d1f7d5', '--accent':'#9acd32', '--btn':'#3cb371', '--danger':'#b22222' }
    };

    // ========== 업그레이드 정의 ==========
    const UPGRADES = {
      click:      { baseCost: 25,  name: '클릭 +1',           desc: '클릭당 코인 +1' },
      auto1:      { baseCost: 10,  name: '자동 +1/s',         desc: '초당 1코인 자동 생산' },
      auto5:      { baseCost: 100, name: '자동 +5/s',         desc: '초당 5코인 자동 생산' },
      auto25:     { baseCost: 1000, name: '자동 +25/s',       desc: '초당 25코인 자동 생산' },
      autoclicker:{ baseCost: 500, name: '자동 클릭 +1/s',    desc: '초당 1회 자동 클릭' },
      crit:       { baseCost: 200, name: '크리 +5%',          desc: '크리티컬 확률 +5% (최대 80%)' },
      critmult:   { baseCost: 300, name: '크리 배율 +1x',     desc: '크리티컬 배율 +1' }
    };

    function getUpgradeCost(key) {
      const base = UPGRADES[key].baseCost;
      const lvl = S.upgrades[key];
      switch(key) {
        case 'click':      return Math.floor(base * Math.pow(1.6, lvl));
        case 'auto1':      return Math.floor(base * Math.pow(1.5, lvl));
        case 'auto5':      return Math.floor(base * Math.pow(1.8, lvl));
        case 'auto25':     return Math.floor(base * Math.pow(2.0, lvl));
        case 'autoclicker':return Math.floor(base * Math.pow(1.9, lvl));
        case 'crit':       return Math.floor(base * Math.pow(1.7, lvl));
        case 'critmult':   return Math.floor(base * Math.pow(2.0, lvl));
        default: return base;
      }
    }

    // ========== 업적 정의 ==========
    const ACHIEVEMENTS = [
      { id:'clicks100', name:'클릭 100회',        check:()=> S.totalClicks >= 100,  reward: 50 },
      { id:'coins1000', name:'총 1,000 코인',     check:()=> S.totalCoinsEarned >= 1000, reward: 100 },
      { id:'auto10',    name:'자동 생산 10/s',    check:()=> S.autoPerSec >= 10,    reward: 150 },
      { id:'clicker',   name:'자동 클릭 구매',     check:()=> S.upgrades.autoclicker >= 1, reward: 200 },
      { id:'crit50',    name:'크리 확률 50%',      check:()=> S.critChance >= 0.5,  reward: 300 },
      { id:'prestige1', name:'첫 환생',            check:()=> S.prestigeCount >= 1, reward: 500 }
    ];

    // ========== 상태 관리 ==========
    function defaultState() {
      return {
        coins: 0,
        totalCoinsEarned: 0,
        totalClicks: 0,
        startTime: Date.now(),
        lastSaved: Date.now(),
        clickPower: 1,
        autoPerSec: 0,
        autoClicker: 0,
        critChance: 0,
        critMultiplier: 2,
        upgrades: {
          click: 0, auto1: 0, auto5: 0, auto25: 0,
          autoclicker: 0, crit: 0, critmult: 0
        },
        prestigeCount: 0,
        prestigeBonus: 1,
        achievements: {},
        ownedThemes: ['dark'],
        selectedTheme: 'dark',
        nextGoldenTime: Date.now() + 30000,
        goldenUntil: 0
      };
    }

    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem('idleFullSave')); } catch(e) {}
      if (!s || typeof s !== 'object') return defaultState();

      const d = defaultState();
      for (let k in d) {
        if (s[k] === undefined) s[k] = d[k];
      }
      if (!s.upgrades) s.upgrades = d.upgrades;
      for (let k in d.upgrades) {
        if (s.upgrades[k] === undefined) s.upgrades[k] = d.upgrades[k];
      }
      if (!s.ownedThemes || s.ownedThemes.length === 0) s.ownedThemes = ['dark'];
      if (!s.selectedTheme) s.selectedTheme = 'dark';
      if (!s.achievements) s.achievements = {};
      return s;
    }

    let S = loadState();

    function save() {
      S.lastSaved = Date.now();
      try { localStorage.setItem('idleFullSave', JSON.stringify(S)); } catch(e) {}
    }

    // ========== 오프라인 진행 ==========
    function processOffline() {
      const now = Date.now();
      const last = S.lastSaved || now;
      const elapsedSec = (now - last) / 1000;
      if (elapsedSec > 5 && S.autoPerSec > 0) {
        const capped = Math.min(elapsedSec, 8 * 3600); // 최대 8시간
        const gain = S.autoPerSec * capped * S.prestigeBonus;
        S.coins += gain;
        S.totalCoinsEarned += gain;
        toast(`⏰ 오프라인 ${Math.floor(capped)}초 동안 +${Math.floor(gain)} 코인`);
      }
      S.lastSaved = now;
    }

    // ========== UI 요소 ==========
    const coinEl = document.getElementById('coin');
    const productionEl = document.getElementById('production');
    const prestigeInfoEl = document.getElementById('prestigeInfo');
    const upgradesEl = document.getElementById('upgrades');
    const achievementsEl = document.getElementById('achievements');
    const statsEl = document.getElementById('stats');
    const themesEl = document.getElementById('themes');
    const prestigeBtn = document.getElementById('prestigeBtn');
    const goldenBtn = document.getElementById('goldenCoinBtn');
    const toastEl = document.getElementById('toast');

    let toastTimer = null;
    function toast(msg, duration = 3000) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    // ========== 업데이트 함수 ==========
    function updateDynamic() {
      coinEl.textContent = Math.floor(S.coins);
      const effectiveProduction = S.autoPerSec + S.autoClicker * S.clickPower * S.prestigeBonus * (1 + S.critChance * (S.critMultiplier - 1));
      productionEl.textContent = `생산: ${effectiveProduction.toFixed(1)}/s`;
      prestigeInfoEl.textContent = `환생 보너스: +${Math.floor((S.prestigeBonus - 1) * 100)}%`;
    }

    function renderUpgrades() {
      upgradesEl.innerHTML = '';
      for (const key in UPGRADES) {
        const def = UPGRADES[key];
        const cost = getUpgradeCost(key);
        const lvl = S.upgrades[key];
        const btn = document.createElement('button');
        btn.className = 'upgradeBtn';
        btn.textContent = `${def.name} (Lv.${lvl}) - 비용 ${cost}`;
        if (S.coins < cost) btn.disabled = true;
        btn.onclick = () => buyUpgrade(key);
        upgradesEl.appendChild(btn);
      }
    }

    function renderAchievements() {
      achievementsEl.innerHTML = ACHIEVEMENTS.map(a => {
        const done = S.achievements[a.id];
        return `<div class="ach ${done ? 'done' : ''}">${done ? '✅' : '🔒'} ${a.name}${done ? '' : ` (+${a.reward} 코인)`}</div>`;
      }).join('');
    }

    function renderStats() {
      const played = Math.floor((Date.now() - S.startTime) / 1000);
      const mins = Math.floor(played / 60);
      const secs = played % 60;
      statsEl.innerHTML = `
        총 클릭: ${S.totalClicks}<br>
        총 코인 획득: ${Math.floor(S.totalCoinsEarned)}<br>
        플레이 시간: ${mins}분 ${secs}초<br>
        환생: ${S.prestigeCount}회<br>
        클릭 파워: ${S.clickPower} (보너스 적용 ${Math.floor(S.clickPower * S.prestigeBonus)})<br>
        자동 생산: ${S.autoPerSec.toFixed(1)}/s<br>
        자동 클릭: ${S.autoClicker.toFixed(1)}/s<br>
        크리: ${Math.round(S.critChance * 100)}% / x${S.critMultiplier}
      `;
    }

    function renderThemes() {
      themesEl.innerHTML = '';
      for (const id in THEMES) {
        const t = THEMES[id];
        const owned = S.ownedThemes.includes(id);
        const selected = S.selectedTheme === id;
        const btn = document.createElement('button');
        btn.className = 'themeBtn' + (selected ? ' selected' : '');
        btn.textContent = `${owned ? '' : '🔒 '}${t.name}${owned ? '' : ` (${t.cost})`}${selected ? ' ✔' : ''}`;
        btn.onclick = () => themeAction(id);
        themesEl.appendChild(btn);
      }
    }

    function fullUpdate() {
      checkAchievements();
      renderUpgrades();
      renderAchievements();
      renderThemes();
      renderStats();
      prestigeBtn.disabled = S.coins < 10000;
      prestigeBtn.textContent = `🔁 환생 (+10% 영구, 필요 10,000코인)`;
    }

    // ========== 게임 액션 ==========
    function manualClick() {
      let gain = S.clickPower * S.prestigeBonus;
      if (Math.random() < S.critChance) {
        gain *= S.critMultiplier;
      }
      S.coins += gain;
      S.totalCoinsEarned += gain;
      S.totalClicks += 1;
      updateDynamic();
      fullUpdate();
      save();
    }

    function buyUpgrade(key) {
      const cost = getUpgradeCost(key);
      if (S.coins < cost) {
        toast('코인 부족!');
        return;
      }
      S.coins -= cost;
      S.upgrades[key] += 1;
      switch(key) {
        case 'click':
          S.clickPower += 1;
          break;
        case 'auto1':
          S.autoPerSec += 1;
          break;
        case 'auto5':
          S.autoPerSec += 5;
          break;
        case 'auto25':
          S.autoPerSec += 25;
          break;
        case 'autoclicker':
          S.autoClicker += 1;
          break;
        case 'crit':
          S.critChance = Math.min(S.critChance + 0.05, 0.8);
          break;
        case 'critmult':
          S.critMultiplier += 1;
          break;
      }
      updateDynamic();
      fullUpdate();
      save();
    }

    function doPrestige() {
      if (S.coins < 10000) return;
      if (!confirm('모든 코인과 업그레이드를 초기화하고 영구 보너스 +10%를 얻습니다. 환생하시겠어요?')) return;
      S.coins = 0;
      S.prestigeCount += 1;
      S.prestigeBonus = 1 + S.prestigeCount * 0.1;

      // 업그레이드 초기화
      S.clickPower = 1;
      S.autoPerSec = 0;
      S.autoClicker = 0;
      S.critChance = 0;
      S.critMultiplier = 2;
      for (let k in S.upgrades) S.upgrades[k] = 0;

      fullUpdate();
      save();
      toast(`🌟 환생 완료! 전체 생산 +${Math.floor((S.prestigeBonus - 1) * 100)}%`);
    }

    function themeAction(id) {
      const t = THEMES[id];
      if (S.ownedThemes.includes(id)) {
        applyTheme(id);
      } else if (S.coins >= t.cost) {
        S.coins -= t.cost;
        S.ownedThemes.push(id);
        applyTheme(id);
        toast(`🎨 테마 구매: ${t.name}`);
        save();
        fullUpdate();
      } else {
        toast('코인 부족!');
      }
    }

    function applyTheme(id) {
      const vars = THEME_VARS[id];
      if (!vars) return;
      const root = document.documentElement;
      for (const key in vars) {
        root.style.setProperty(key, vars[key]);
      }
      S.selectedTheme = id;
      save();
      renderThemes();
    }

    // ========== 황금 코인 ==========
    function collectGoldenCoin() {
      if (S.goldenUntil <= 0) return;
      const gain = Math.max(50, (S.autoPerSec + S.autoClicker * S.clickPower) * 60 * S.prestigeBonus);
      S.coins += gain;
      S.totalCoinsEarned += gain;
      S.goldenUntil = 0;
      goldenBtn.style.display = 'none';
      toast(`✨ 황금 코인! +${Math.floor(gain)} 코인`);
      updateDynamic();
      fullUpdate();
      save();
    }

    // ========== 업적 체크 ==========
    function checkAchievements() {
      ACHIEVEMENTS.forEach(a => {
        if (!S.achievements[a.id] && a.check()) {
          S.achievements[a.id] = true;
          S.coins += a.reward;
          S.totalCoinsEarned += a.reward;
          toast(`🏆 업적 달성: ${a.name} (+${a.reward} 코인)`);
        }
      });
    }

    // ========== 틱 루프 ==========
    function tick() {
      const now = Date.now();

      // 자동 생산 + 자동 클릭 기대값
      const prodGain = S.autoPerSec * 0.1 * S.prestigeBonus;
      const critExpected = 1 + S.critChance * (S.critMultiplier - 1);
      const clickerGain = S.autoClicker * 0.1 * S.clickPower * S.prestigeBonus * critExpected;
      const gain = prodGain + clickerGain;

      if (gain > 0) {
        S.coins += gain;
        S.totalCoinsEarned += gain;
      }

      // 황금 코인 등장/소멸
      if (S.goldenUntil > 0 && now > S.goldenUntil) {
        S.goldenUntil = 0;
        goldenBtn.style.display = 'none';
      }

      if (S.goldenUntil === 0 && now >= S.nextGoldenTime) {
        S.goldenUntil = now + 5000;
        S.nextGoldenTime = now + 20000 + Math.random() * 40000;
        goldenBtn.style.display = 'block';
      }

      updateDynamic();

      // 2초마다 저장
      if (now - S.lastSaved > 2000) {
        save();
      }
    }

    // ========== 리셋 ==========
    function resetAll() {
      if (confirm('모든 진행 상황을 초기화할까요? 이 동작은 되돌릴 수 없습니다.')) {
        localStorage.removeItem('idleFullSave');
        location.reload();
      }
    }

    // ========== 초기 실행 ==========
    processOffline();
    applyTheme(S.selectedTheme);
    updateDynamic();
    fullUpdate();
    save();

    setInterval(tick, 100);       // 0.1초마다 자동 생산/황금 코인
    setInterval(fullUpdate, 1000); // 1초마다 UI 갱신
    window.addEventListener('beforeunload', save);
  </script>
</body>
</html>

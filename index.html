<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아스키 던전 — Phase 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #121212;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    font-size: 15px;
    color: #00ff66;
    text-align: center;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: #1e1e1e;
    padding: 8px 6px;
    border-radius: 8px;
    text-align: center;
  }
  .stat-item { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { color: #888; font-size: 10px; letter-spacing: 0.5px; }
  .stat-value { color: #00ff66; font-weight: 700; font-size: 14px; }
  #ascii-map-display {
    font-family: 'Courier New', Courier, monospace;
    font-size: 30px;
    line-height: 1.25;
    color: #00ff66;
    background: #0a0a0a;
    padding: 16px 8px;
    border-radius: 8px;
    text-align: center;
    letter-spacing: 8px;
    overflow-x: auto;
    white-space: pre;
    min-height: 210px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #1f1f1f;
  }
  #game-output {
    background: #1a1a1a;
    border-radius: 8px;
    padding: 8px 10px;
    height: 150px;
    overflow-y: auto;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    line-height: 1.55;
    color: #b0b0b0;
    border: 1px solid #1f1f1f;
  }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line:last-child { color: #00ff66; }
  .controls {
    display: grid;
    grid-template-columns: 72px 72px 72px;
    grid-template-rows: 72px 72px 72px;
    gap: 8px;
    justify-content: center;
    align-content: center;
  }
  .dpad-btn {
    width: 72px;
    height: 72px;
    min-width: 48px;
    min-height: 48px;
    background: #2a2a2a;
    color: #00ff66;
    border: 2px solid #00ff66;
    border-radius: 12px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.08s, color 0.08s, transform 0.08s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dpad-btn:active:not(:disabled) {
    background: #00ff66;
    color: #121212;
    transform: scale(0.95);
  }
  .dpad-btn:disabled {
    background: #181818;
    color: #3a3a3a;
    border-color: #2a2a2a;
    cursor: not-allowed;
    opacity: 0.6;
  }
  #btn-dir-up { grid-column: 2; grid-row: 1; }
  #btn-dir-left { grid-column: 1; grid-row: 2; }
  #btn-act-wait { grid-column: 2; grid-row: 2; font-size: 14px; letter-spacing: 1px; }
  #btn-dir-right { grid-column: 3; grid-row: 2; }
  #btn-dir-down { grid-column: 2; grid-row: 3; }
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .action-btn {
    min-height: 48px;
    min-width: 48px;
    background: #2a2a2a;
    color: #e0e0e0;
    border: 2px solid #444;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    padding: 6px;
    letter-spacing: 0.5px;
  }
  .action-btn:active:not(:disabled) { background: #444; }
  .action-btn:disabled {
    background: #181818;
    color: #3a3a3a;
    border-color: #2a2a2a;
    cursor: not-allowed;
    opacity: 0.6;
  }
  .console-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  #input-command {
    background: #1a1a1a;
    border: 2px solid #444;
    color: #e0e0e0;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    min-height: 48px;
    width: 100%;
    outline: none;
  }
  #input-command:focus { border-color: #00ff66; }
  #btn-command-submit {
    background: #00ff66;
    color: #121212;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    min-height: 48px;
    min-width: 48px;
    font-family: inherit;
    letter-spacing: 1px;
  }
  #btn-command-submit:active:not(:disabled) { background: #00cc55; }
  #btn-command-submit:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div id="app">
  <h1>아스키 던전 — Phase 1</h1>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">체력</span>
      <span class="stat-value"><span id="stat-hp">30</span></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">최대 체력</span>
      <span class="stat-value"><span id="stat-max-hp">30</span></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">골드</span>
      <span class="stat-value"><span id="stat-gold">0</span></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">턴</span>
      <span class="stat-value"><span id="stat-turn">0</span></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">레벨</span>
      <span class="stat-value"><span id="stat-level">1</span></span>
    </div>
  </div>
  <pre id="ascii-map-display"></pre>
  <div id="game-output"></div>
  <div class="controls">
    <button id="btn-dir-up" class="dpad-btn" aria-label="위로 이동">▲</button>
    <button id="btn-dir-left" class="dpad-btn" aria-label="왼쪽으로 이동">◀</button>
    <button id="btn-act-wait" class="dpad-btn" aria-label="대기">대기</button>
    <button id="btn-dir-right" class="dpad-btn" aria-label="오른쪽으로 이동">▶</button>
    <button id="btn-dir-down" class="dpad-btn" aria-label="아래로 이동">▼</button>
  </div>
  <div class="actions">
    <button id="btn-act-attack" class="action-btn" disabled>공격</button>
    <button id="btn-act-pickup" class="action-btn" disabled>줍기</button>
    <button id="btn-act-use-potion" class="action-btn" disabled>포션</button>
  </div>
  <div class="console-row">
    <input type="text" id="input-command" placeholder="명령어 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="btn-command-submit">전송</button>
  </div>
</div>
<script>
(function () {
  'use strict';

  var MAP_WIDTH = 5;
  var MAP_HEIGHT = 5;

  var BASE_MAP = [
    ['#', '#', '#', '#', '#'],
    ['#', '.', '.', '.', '#'],
    ['#', '.', '#', '.', '#'],
    ['#', '.', '.', '>', '#'],
    ['#', '#', '#', '#', '#']
  ];

  window.gameState = {
    turn: 0,
    isGameOver: false,
    isVictory: false,
    lastActionStatus: "IDLE",
    player: {
      x: 1,
      y: 1,
      hp: 30,
      maxHp: 30,
      atk: 5,
      def: 2,
      gold: 0,
      potion: 1,
      level: 1,
      inventory: ["potion"]
    },
    dungeon: {
      width: MAP_WIDTH,
      height: MAP_HEIGHT,
      visibleGrid: [],
      revealedGrid: []
    },
    monsters: [],
    score: {
      gold: 0,
      kills: 0,
      turnAtEnd: 0,
      final: 0
    }
  };

  var mapContainer = document.getElementById('ascii-map-display');
  var outputEl = document.getElementById('game-output');
  var statHp = document.getElementById('stat-hp');
  var statMaxHp = document.getElementById('stat-max-hp');
  var statGold = document.getElementById('stat-gold');
  var statTurn = document.getElementById('stat-turn');
  var statLevel = document.getElementById('stat-level');

  var btnUp = document.getElementById('btn-dir-up');
  var btnDown = document.getElementById('btn-dir-down');
  var btnLeft = document.getElementById('btn-dir-left');
  var btnRight = document.getElementById('btn-dir-right');
  var btnWait = document.getElementById('btn-act-wait');
  var btnAttack = document.getElementById('btn-act-attack');
  var btnPickup = document.getElementById('btn-act-pickup');
  var btnPotion = document.getElementById('btn-act-use-potion');
  var inputCmd = document.getElementById('input-command');
  var btnCmdSubmit = document.getElementById('btn-command-submit');

  function getTileAt(x, y) {
    if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return null;
    return BASE_MAP[y][x];
  }

  function isInBounds(x, y) {
    return x >= 0 && x < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT;
  }

  function log(text) {
    var line = document.createElement('div');
    line.className = 'log-line';
    line.textContent = text;
    outputEl.appendChild(line);
    while (outputEl.children.length > 200) {
      outputEl.removeChild(outputEl.firstChild);
    }
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function renderMap() {
    var lines = [];
    for (var y = 0; y < MAP_HEIGHT; y++) {
      var row = [];
      for (var x = 0; x < MAP_WIDTH; x++) {
        if (x === window.gameState.player.x && y === window.gameState.player.y) {
          row.push('P');
        } else {
          row.push(BASE_MAP[y][x]);
        }
      }
      lines.push(row.join(''));
    }
    mapContainer.textContent = lines.join('\n');
  }

  function renderStats() {
    var p = window.gameState.player;
    statHp.textContent = String(p.hp);
    statMaxHp.textContent = String(p.maxHp);
    statGold.textContent = String(p.gold);
    statTurn.textContent = String(window.gameState.turn);
    statLevel.textContent = String(p.level);
  }

  function updateVisibleGrid() {
    var copy = [];
    for (var y = 0; y < MAP_HEIGHT; y++) {
      copy.push(BASE_MAP[y].slice());
    }
    window.gameState.dungeon.visibleGrid = copy;
    var copy2 = [];
    for (var y2 = 0; y2 < MAP_HEIGHT; y2++) {
      copy2.push(BASE_MAP[y2].slice());
    }
    window.gameState.dungeon.revealedGrid = copy2;
  }

  function updateButtons() {
    var p = window.gameState.player;
    var dead = window.gameState.isGameOver || window.gameState.isVictory;

    var upTile = getTileAt(p.x, p.y - 1);
    var downTile = getTileAt(p.x, p.y + 1);
    var leftTile = getTileAt(p.x - 1, p.y);
    var rightTile = getTileAt(p.x + 1, p.y);

    btnUp.disabled = dead || upTile === null || upTile === '#';
    btnDown.disabled = dead || downTile === null || downTile === '#';
    btnLeft.disabled = dead || leftTile === null || leftTile === '#';
    btnRight.disabled = dead || rightTile === null || rightTile === '#';
    btnWait.disabled = dead;
    btnAttack.disabled = true;
    btnPickup.disabled = true;
    btnPotion.disabled = true;
    btnCmdSubmit.disabled = dead;
  }

  function refresh() {
    renderMap();
    renderStats();
    updateVisibleGrid();
    updateButtons();
  }

  function attemptMove(dx, dy) {
    var state = window.gameState;
    if (state.isGameOver || state.isVictory) {
      state.lastActionStatus = "IDLE";
      return false;
    }

    var p = state.player;
    var nx = p.x + dx;
    var ny = p.y + dy;

    if (!isInBounds(nx, ny)) {
      state.lastActionStatus = "MOVE_BLOCKED";
      log('[BLOCKED] Cannot move outside the dungeon at (' + nx + ', ' + ny + ').');
      refresh();
      return false;
    }

    var tile = getTileAt(nx, ny);
    if (tile === '#') {
      state.lastActionStatus = "MOVE_BLOCKED";
      log('[BLOCKED] Cannot move into the wall at (' + nx + ', ' + ny + ').');
      refresh();
      return false;
    }

    p.x = nx;
    p.y = ny;

    if (tile === '>') {
      state.isVictory = true;
      state.turn += 1;
      state.score.turnAtEnd = state.turn;
      state.lastActionStatus = "MOVE_SUCCESS";
      log('[MOVE] Moved to (' + nx + ', ' + ny + ').');
      log('[VICTORY] Dungeon cleared at turn ' + state.turn + '!');
      refresh();
      return true;
    }

    state.turn += 1;
    state.lastActionStatus = "MOVE_SUCCESS";
    log('[MOVE] Moved to (' + nx + ', ' + ny + ').');
    log('[TURN] Turn ' + state.turn + ' begins.');
    refresh();
    return true;
  }

  function attemptWait() {
    var state = window.gameState;
    if (state.isGameOver || state.isVictory) {
      state.lastActionStatus = "IDLE";
      return false;
    }
    state.lastActionStatus = "WAIT";
    state.turn += 1;
    log('[WAIT] Player waits.');
    log('[TURN] Turn ' + state.turn + ' begins.');
    refresh();
    return true;
  }

  btnUp.addEventListener('click', function () { attemptMove(0, -1); });
  btnDown.addEventListener('click', function () { attemptMove(0, 1); });
  btnLeft.addEventListener('click', function () { attemptMove(-1, 0); });
  btnRight.addEventListener('click', function () { attemptMove(1, 0); });
  btnWait.addEventListener('click', function () { attemptWait(); });

  function submitCommand() {
    var raw = inputCmd.value;
    var cmd = raw.trim().toLowerCase();
    if (!cmd) return;
    inputCmd.value = '';

    if (window.gameState.isGameOver || window.gameState.isVictory) {
      log('[INVALID] Command ignored: game is already finished.');
      return;
    }

    if (cmd === 'move up' || cmd === '위' || cmd === 'up') { attemptMove(0, -1); }
    else if (cmd === 'move down' || cmd === '아래' || cmd === 'down') { attemptMove(0, 1); }
    else if (cmd === 'move left' || cmd === '왼쪽' || cmd === 'left') { attemptMove(-1, 0); }
    else if (cmd === 'move right' || cmd === '오른쪽' || cmd === 'right') { attemptMove(1, 0); }
    else if (cmd === 'wait' || cmd === '대기') { attemptWait(); }
    else if (cmd === 'status' || cmd === '상태') {
      var s = window.gameState;
      log('[STATUS] Turn ' + s.turn + ', HP ' + s.player.hp + '/' + s.player.maxHp +
          ', Pos (' + s.player.x + ', ' + s.player.y + ')' +
          ', Gold ' + s.player.gold + ', Level ' + s.player.level);
    }
    else {
      log('[INVALID] Command ignored: unknown command "' + cmd + '"');
    }
  }

  btnCmdSubmit.addEventListener('click', submitCommand);
  inputCmd.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      submitCommand();
    }
  });

  window.runPhase1SelfTest = function () {
    var results = [];
    var errors = [];

    function record(name, pass, detail) {
      results.push({ name: name, pass: !!pass, detail: detail || '' });
      if (!pass) {
        errors.push(name + (detail ? ' :: ' + detail : ''));
      }
    }

    function getLogText() {
      return outputEl.textContent || '';
    }

    function forceClick(btn) {
      if (btn.disabled) { btn.disabled = false; }
      btn.click();
    }

    // ---- 초기 상태로 리셋 ----
    window.gameState.turn = 0;
    window.gameState.isGameOver = false;
    window.gameState.isVictory = false;
    window.gameState.lastActionStatus = "IDLE";
    window.gameState.player.x = 1;
    window.gameState.player.y = 1;
    window.gameState.player.hp = 30;
    window.gameState.player.maxHp = 30;
    window.gameState.player.gold = 0;
    window.gameState.player.potion = 1;
    window.gameState.player.level = 1;
    window.gameState.player.inventory = ["potion"];
    window.gameState.monsters = [];
    window.gameState.score = { gold: 0, kills: 0, turnAtEnd: 0, final: 0 };
    outputEl.innerHTML = '';
    refresh();
    log('[TURN] Turn 0 begins.');

    // ---- 1. 초기 상태 검증 ----
    record('초기 위치 (1,1)',
      window.gameState.player.x === 1 && window.gameState.player.y === 1,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('초기 턴 0',
      window.gameState.turn === 0,
      'turn=' + window.gameState.turn);
    record('초기 HP 30',
      window.gameState.player.hp === 30,
      'hp=' + window.gameState.player.hp);
    record('초기 maxHp 30',
      window.gameState.player.maxHp === 30,
      'maxHp=' + window.gameState.player.maxHp);
    record('초기 골드 0',
      window.gameState.player.gold === 0,
      'gold=' + window.gameState.player.gold);
    record('초기 레벨 1',
      window.gameState.player.level === 1,
      'level=' + window.gameState.player.level);
    record('위 버튼 비활성 (1,0은 벽)',
      btnUp.disabled === true);
    record('아래 버튼 활성 (1,2는 바닥)',
      btnDown.disabled === false);
    record('왼쪽 버튼 비활성 (0,1은 벽)',
      btnLeft.disabled === true);
    record('오른쪽 버튼 활성 (2,1은 바닥)',
      btnRight.disabled === false);
    record('Phase1 공격 버튼 비활성', btnAttack.disabled === true);
    record('Phase1 줍기 버튼 비활성', btnPickup.disabled === true);
    record('Phase1 포션 버튼 비활성', btnPotion.disabled === true);

    // ---- 2. 4방향 버튼 각 2회 클릭 ----
    // 순서: 오른쪽, 왼쪽, 위, 아래, 오른쪽, 왼쪽, 위, 아래

    // 오른쪽 #1
    forceClick(btnRight);
    record('오른쪽#1 -> (2,1)',
      window.gameState.player.x === 2 && window.gameState.player.y === 1,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('오른쪽#1 턴=1',
      window.gameState.turn === 1,
      'turn=' + window.gameState.turn);
    record('오른쪽#1 상태=MOVE_SUCCESS',
      window.gameState.lastActionStatus === 'MOVE_SUCCESS');

    // 왼쪽 #1
    forceClick(btnLeft);
    record('왼쪽#1 -> (1,1)',
      window.gameState.player.x === 1 && window.gameState.player.y === 1,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('왼쪽#1 턴=2',
      window.gameState.turn === 2,
      'turn=' + window.gameState.turn);

    // 위 #1 (벽 (1,0)에 막힘)
    var preUpTurn = window.gameState.turn;
    forceClick(btnUp);
    record('위#1 (1,0)에서 차단',
      window.gameState.player.x === 1 && window.gameState.player.y === 1,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('위#1 턴 변화 없음',
      window.gameState.turn === preUpTurn,
      'turn=' + window.gameState.turn);
    record('위#1 상태=MOVE_BLOCKED',
      window.gameState.lastActionStatus === 'MOVE_BLOCKED');
    record('위#1 BLOCKED 로그 존재',
      getLogText().indexOf('Cannot move into the wall at (1, 0).') !== -1);

    // 아래 #1
    forceClick(btnDown);
    record('아래#1 -> (1,2)',
      window.gameState.player.x === 1 && window.gameState.player.y === 2,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('아래#1 턴=3',
      window.gameState.turn === 3,
      'turn=' + window.gameState.turn);

    // 오른쪽 #2 (벽 (2,2)에 막힘)
    var preRight2Turn = window.gameState.turn;
    forceClick(btnRight);
    record('오른쪽#2 (2,2)에서 차단',
      window.gameState.player.x === 1 && window.gameState.player.y === 2,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('오른쪽#2 턴 변화 없음',
      window.gameState.turn === preRight2Turn,
      'turn=' + window.gameState.turn);
    record('오른쪽#2 BLOCKED 로그 (2,2)',
      getLogText().indexOf('Cannot move into the wall at (2, 2).') !== -1);

    // 왼쪽 #2 (벽 (0,2)에 막힘)
    var preLeft2Turn = window.gameState.turn;
    forceClick(btnLeft);
    record('왼쪽#2 (0,2)에서 차단',
      window.gameState.player.x === 1 && window.gameState.player.y === 2,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('왼쪽#2 턴 변화 없음',
      window.gameState.turn === preLeft2Turn,
      'turn=' + window.gameState.turn);
    record('왼쪽#2 BLOCKED 로그 (0,2)',
      getLogText().indexOf('Cannot move into the wall at (0, 2).') !== -1);

    // 위 #2
    forceClick(btnUp);
    record('위#2 -> (1,1)',
      window.gameState.player.x === 1 && window.gameState.player.y === 1,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('위#2 턴=4',
      window.gameState.turn === 4,
      'turn=' + window.gameState.turn);

    // 아래 #2
    forceClick(btnDown);
    record('아래#2 -> (1,2)',
      window.gameState.player.x === 1 && window.gameState.player.y === 2,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('아래#2 턴=5',
      window.gameState.turn === 5,
      'turn=' + window.gameState.turn);

    // ---- 3. 대기 액션 검증 ----
    var preWaitTurn = window.gameState.turn;
    var preWaitX = window.gameState.player.x;
    var preWaitY = window.gameState.player.y;
    forceClick(btnWait);
    record('대기 시 위치 유지',
      window.gameState.player.x === preWaitX && window.gameState.player.y === preWaitY,
      'pos=(' + window.gameState.player.x + ',' + window.gameState.player.y + ')');
    record('대기 시 턴 +1',
      window.gameState.turn === preWaitTurn + 1,
      'turn=' + window.gameState.turn);
    record('대기 상태=WAIT',
      window.gameState.lastActionStatus === 'WAIT');
    record('대기 로그 존재',
      getLogText().indexOf('[WAIT] Player waits.') !== -1);

    // ---- 4. DOM 스탯 동기화 검증 ----
    record('#stat-hp 일치',
      statHp.textContent === String(window.gameState.player.hp));
    record('#stat-max-hp 일치',
      statMaxHp.textContent === String(window.gameState.player.maxHp));
    record('#stat-gold 일치',
      statGold.textContent === String(window.gameState.player.gold));
    record('#stat-turn 일치',
      statTurn.textContent === String(window.gameState.turn));
    record('#stat-level 일치',
      statLevel.textContent === String(window.gameState.player.level));

    // ---- 5. 최종 리포트 ----
    var pass = errors.length === 0;
    var report = {
      result: pass ? 'PASS' : 'FAIL',
      totalTests: results.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      failed: results.filter(function (r) { return !r.pass; }).length,
      tests: results,
      errors: errors,
      finalState: {
        turn: window.gameState.turn,
        player: {
          x: window.gameState.player.x,
          y: window.gameState.player.y,
          hp: window.gameState.player.hp,
          maxHp: window.gameState.player.maxHp,
          gold: window.gameState.player.gold,
          level: window.gameState.player.level
        },
        isGameOver: window.gameState.isGameOver,
        isVictory: window.gameState.isVictory,
        lastActionStatus: window.gameState.lastActionStatus
      }
    };

    if (pass) {
      console.log('[PHASE 1 TEST PASS]');
    } else {
      console.log('[PHASE 1 TEST FAIL]');
    }
    console.log('Self-test report:', report);

    log('[TEST] ================================');
    log('[TEST] Phase 1 Self-Test: ' + report.result);
    log('[TEST] Passed: ' + report.passed + ' / ' + report.totalTests);
    if (!pass) {
      for (var i = 0; i < errors.length; i++) {
        log('[TEST FAIL] ' + errors[i]);
      }
    } else {
      log('[TEST] All assertions passed.');
    }
    log('[TEST] ================================');

    return report;
  };

  // 초기 부트스트랩
  refresh();
  log('[TURN] Turn 0 begins.');
})();
</script>

<input id="guess" type="number" placeholder="1~100">
<button onclick="check()">확인</button>
<p id="msg"></p>

<script>
let answer = Math.floor(Math.random() * 100) + 1;
let count = 0;

function check() {
  let g = Number(document.getElementById('guess').value);
  let msg = document.getElementById('msg');
  count++;

  if (g === answer) {
    msg.textContent = `정답! ${count}번 만에 맞힘`;
  } else if (g < answer) {
    msg.textContent = '업';
  } else {
    msg.textContent = '다운';
  }
}
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이니 워리어 러시 v3.1</title>
<style>
  :root {
    --bg-deep:#08080d; --bg-primary:#0d0d12; --bg-panel:#14141f; --bg-panel-2:#1a1a24; --bg-inset:#0a0a12;
    --text-primary:#e8e8ee; --text-muted:#8888a0; --text-dim:#55556a;
    --gold:#ffcc00; --gold-deep:#a66800; --blue:#4a90e2; --blue-deep:#1a4a8a;
    --red:#ff3366; --red-deep:#8a1a34; --green:#00ff66; --green-deep:#00883a;
    --border-subtle:#2a2a3a; --border-strong:#3a3a4a;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.05);
    --glow-gold: 0 0 24px rgba(255,204,0,0.6);
    --glow-blue: 0 0 16px rgba(74,144,226,0.5);
    --glow-red: 0 0 20px rgba(255,51,102,0.7);
    --glow-green: 0 0 20px rgba(0,255,102,0.6);
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', Roboto, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-ui); min-height: 100vh; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  button, .card, .slot, .deploy-btn { user-select: none; -webkit-user-select: none; }
  #app { max-width: 480px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 100vh; position: relative; }
  .header-row { display: flex; align-items: center; justify-content: center; position: relative; }
  h1 { font-size: 15px; color: var(--gold); text-align: center; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 12px rgba(255,204,0,0.6); flex: 1; }
  #btn-sound-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--bg-panel-2); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); min-width: 44px; min-height: 44px; font-size: 18px; cursor: pointer; color: var(--text-primary); display: flex; align-items: center; justify-content: center; }
  .castle-panel { background: linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 10px 12px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; position: relative; overflow: hidden; }
  .castle-panel::before { content:''; position:absolute; inset:0; background: repeating-linear-gradient(90deg, transparent 0px, transparent 8px, rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 9px); pointer-events:none; }
  .castle-visual { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
  .castle-emoji { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
  .castle-emoji.warn { filter: drop-shadow(0 0 6px var(--gold)); animation: castleShake 0.4s infinite; }
  .castle-emoji.danger { filter: drop-shadow(0 0 8px var(--red)); animation: castleShake 0.3s infinite; }
  @keyframes castleShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-1.5px) rotate(-2deg)} 75%{transform:translateX(1.5px) rotate(2deg)} }
  .castle-status-label { font-size: 9px; font-weight: 900; min-height: 11px; text-align: center; }
  .castle-info { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 1; }
  .castle-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }
  .castle-row .wave-tag { color: var(--gold); font-weight: 800; font-size: 13px; font-family: var(--font-mono); }
  .castle-row .gold-tag { color: var(--gold); font-weight: 800; font-family: var(--font-mono); font-size: 13px; }
  .hp-bar { width: 100%; height: 18px; background: var(--bg-inset); border-radius: var(--r-sm); overflow: hidden; position: relative; border: 1px solid var(--border-subtle); }
  .hp-fill { height: 100%; background: linear-gradient(90deg,#00ff66 0%,#88ff66 50%,#00ff66 100%); transition: width 0.4s, background 0.3s; border-radius: 7px; }
  .hp-fill.warn { background: linear-gradient(90deg,#ffcc00,#ff9900); }
  .hp-fill.danger { background: linear-gradient(90deg,#ff3366,#ff0044); animation: pulseRed 0.6s infinite alternate; }
  .hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: var(--bg-deep); text-shadow: 0 0 4px rgba(255,255,255,0.7); font-family: var(--font-mono); }
  @keyframes pulseRed { from{box-shadow:inset 0 0 0 0 rgba(255,51,102,0)} to{box-shadow:inset 0 0 14px 2px rgba(255,51,102,0.8)} }
  #status-hint { background: var(--bg-panel-2); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 8px 12px; text-align: center; font-size: 12px; font-weight: 800; color: var(--gold); min-height: 34px; display: flex; align-items: center; justify-content: center; transition: color 0.25s, border-color 0.25s, background 0.25s; }
  #status-hint.deploy { color: var(--blue); border-color: var(--blue); background: rgba(74,144,226,0.08); }
  #status-hint.shop { color: var(--gold); border-color: var(--gold); background: rgba(255,204,0,0.08); }
  #status-hint.combat { color: var(--red); border-color: var(--red); background: rgba(255,51,102,0.08); }
  #status-hint.end { color: var(--red); border-color: var(--red); background: rgba(255,51,102,0.08); }
  .battlefield-wrapper { position: relative; }
  .battlefield { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 10px 8px; min-height: 112px; }
  .slot { background: var(--bg-panel); border: 2px dashed var(--border-subtle); border-radius: var(--r-md); min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 4px; transition: all 0.2s; position: relative; overflow: hidden; }
  .slot.shop-target { cursor: pointer; border-color: var(--gold) !important; box-shadow: var(--glow-gold); animation: shopPulse 0.8s infinite alternate; }
  @keyframes shopPulse { from{box-shadow:0 0 12px rgba(255,204,0,0.5)} to{box-shadow:0 0 24px rgba(255,204,0,0.9)} }
  .slot .slot-icon { position: absolute; font-size: 54px; opacity: 0.08; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .slot.empty::after { content: '빈 슬롯'; color: var(--text-dim); font-size: 10px; font-weight: 700; position: relative; z-index: 1; }
  .slot .slot-pos { position: absolute; top: 4px; left: 6px; font-size: 9px; color: var(--blue); font-weight: 900; z-index: 2; }
  .slot .slot-content { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; z-index: 1; }
  .slot.filled { border-style: solid; border-color: var(--blue); background: linear-gradient(180deg,#1a2a44 0%,#0f1a2e 100%); box-shadow: var(--glow-blue); }
  .slot.deploy-anim { animation: slotDeploy 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes slotDeploy { 0%{transform:scale(1)} 40%{transform:scale(1.12);box-shadow:0 0 28px rgba(74,144,226,0.9)} 100%{transform:scale(1)} }
  .slot.hit-anim { animation: slotHit 0.18s ease; }
  @keyframes slotHit { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .slot.damage-anim { animation: slotDamage 0.3s ease; }
  @keyframes slotDamage { 0%,100%{transform:scale(1);filter:none} 50%{transform:scale(0.94);filter:brightness(1.6) hue-rotate(-30deg)} }
  .slot.death-anim { animation: slotDeath 0.5s ease forwards; }
  @keyframes slotDeath { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(0.6) rotateZ(-15deg)} }
  .warrior-emoji { font-size: 28px; filter: drop-shadow(0 0 6px rgba(74,144,226,0.8)); position: relative; z-index: 1; }
  .warrior-name { font-size: 10px; font-weight: 800; color: #a8cfff; position: relative; z-index: 1; }
  .warrior-stats { font-size: 9px; color: #88a8cc; font-family: var(--font-mono); font-weight: 700; position: relative; z-index: 1; }
  #enemy-row-overlay { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; max-width: 90%; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.25s; }
  #enemy-row-overlay.show { opacity: 1; }
  .enemy-token { background: linear-gradient(180deg,#3a1a24,#1a0f14); border: 2px solid var(--red-deep); border-radius: var(--r-sm); padding: 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 34px; transition: opacity 0.25s, transform 0.25s; }
  .enemy-token.elite { border-color: var(--gold); box-shadow: var(--glow-gold); }
  .enemy-token .enemy-id { font-family: var(--font-mono); font-size: 8px; color: var(--text-muted); font-weight: 700; line-height: 1; }
  .enemy-token .enemy-emoji { font-size: 16px; line-height: 1; }
  .enemy-token .enemy-mini-hp { width: 26px; height: 3px; background: var(--bg-inset); border-radius: 2px; overflow: hidden; }
  .enemy-token .enemy-mini-hp-fill { height: 100%; background: var(--red); transition: width 0.3s ease; }
  .enemy-token.dead { opacity: 0; transform: scale(0.6); }
  .enemy-token.damaged { animation: tokenShake 0.25s ease; }
  @keyframes tokenShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .enemy-preview { background: linear-gradient(180deg,#1a0f14 0%,#10080c 100%); border: 1px solid var(--red-deep); border-radius: var(--r-sm); padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .enemy-preview .label { color: #ff6688; font-weight: 800; font-size: 10px; }
  .enemy-preview .count { color: var(--red); font-weight: 900; font-family: var(--font-mono); font-size: 12px; }
  .enemy-preview .detail { color: #885566; font-size: 10px; font-family: var(--font-mono); font-weight: 700; }
  .cards-area { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; min-height: 128px; }
  .card { background: linear-gradient(160deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%); border: 2px solid var(--border-strong); border-radius: var(--r-md); padding: 20px 4px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, opacity 0.25s; min-height: 128px; position: relative; overflow: hidden; text-align: center; }
  .card-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; z-index: 1; }
  .card-banner { position: absolute; top: 0; left: 0; right: 0; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--bg-deep); background: var(--border-strong); border-radius: 10px 10px 0 0; z-index: 2; }
  .card.rarity-COMMON .card-banner { background: #4a4a5a; color: #c8c8d8; }
  .card.rarity-RARE .card-banner { background: var(--blue); color: #0d1a2e; }
  .card.rarity-LEGEND .card-banner { background: var(--gold); color: #2a1a00; }
  .card.rarity-COMMON { border-color: var(--border-strong); }
  .card.rarity-RARE { border-color: var(--blue); box-shadow: var(--glow-blue); }
  .card.rarity-LEGEND { border-color: var(--gold); box-shadow: var(--glow-gold); }
  .card-shine { position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(255,204,0,0.25) 40deg, transparent 80deg); opacity: 0; pointer-events: none; z-index: 0; }
  .card.rarity-LEGEND .card-shine { opacity: 1; animation: legendRotate 3s linear infinite; }
  @keyframes legendRotate { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .card.placeholder { cursor: default; background: var(--bg-panel); border-style: dashed; color: var(--text-dim); font-size: 11px; font-weight: 700; padding: 10px 4px; }
  .card.placeholder .card-banner { display: none; }
  .card:not(.placeholder):active { transform: scale(0.94); }
  .card.appear { animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1) backwards; }
  .card.appear:nth-child(2) { animation-delay: 0.09s; }
  .card.appear:nth-child(3) { animation-delay: 0.18s; }
  @keyframes cardIn { from{transform:translateY(-24px) scale(0.85);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }
  .card.selected { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,204,0,0.9); transform: scale(1.05) rotateZ(-1deg); }
  .card.locked { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }
  .card.fade-out { opacity: 0; transform: scale(0.85); pointer-events: none; }
  .card-emoji { font-size: 28px; }
  .card-name { font-size: 11px; font-weight: 800; color: var(--text-primary); }
  .card-desc { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 700; }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .deploy-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
  .deploy-btn { min-height: 48px; background: var(--bg-panel); border: 2px solid var(--border-subtle); border-radius: var(--r-sm); color: var(--text-muted); font-family: var(--font-ui); font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.15s; }
  .deploy-btn:not(:disabled):active { transform: scale(0.94); }
  .deploy-btn:not(:disabled) { border-color: var(--blue); color: #a8cfff; background: linear-gradient(180deg,#1a2a44 0%,#0f1a2e 100%); box-shadow: var(--glow-blue); }
  .deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .deploy-btn .plus { font-size: 16px; display: block; line-height: 1; margin-bottom: 2px; }
  #btn-draw-card { min-height: 56px; background: linear-gradient(135deg, var(--gold) 0%, #ff9900 100%); border: none; border-radius: var(--r-md); color: var(--bg-deep); font-family: var(--font-ui); font-size: 15px; font-weight: 900; letter-spacing: 2.5px; cursor: pointer; box-shadow: 0 4px 0 var(--gold-deep), var(--glow-gold); transition: all 0.1s; position: relative; overflow: hidden; }
  #btn-draw-card::after { content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); animation: shine 2.5s infinite; }
  @keyframes shine { 0%{left:-60%} 60%,100%{left:120%} }
  #btn-draw-card:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
  #btn-draw-card:disabled { background: var(--border-subtle); color: var(--text-dim); box-shadow: none; cursor: not-allowed; }
  #btn-draw-card:disabled::after { display: none; }
  #btn-cancel-pick, #btn-skip-turn { min-height: 44px; background: var(--bg-panel); border: 2px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-muted); font-family: var(--font-ui); font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.15s; }
  #btn-cancel-pick:not(:disabled) { border-color: var(--blue); color: #a8cfff; }
  #btn-cancel-pick:not(:disabled):active { transform: scale(0.94); }
  #btn-cancel-pick:disabled { opacity: 0.35; cursor: not-allowed; }
  #btn-skip-turn:not(:disabled) { border-color: var(--red-deep); color: #ff8899; }
  #btn-skip-turn:not(:disabled):active { transform: scale(0.94); }
  #btn-skip-turn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shop-panel { background: var(--bg-panel-2); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); overflow: hidden; }
  .shop-panel summary { list-style: none; padding: 10px 12px; font-size: 12px; font-weight: 800; color: var(--gold); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .shop-panel summary::-webkit-details-marker { display: none; }
  .shop-panel summary::after { content:'▼'; font-size:10px; transition: transform 0.2s; }
  .shop-panel[open] summary::after { transform: rotate(180deg); }
  .shop-panel .shop-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-subtle); }
  .shop-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
  .shop-btn { min-height: 52px; background: var(--bg-panel); border: 2px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-primary); font-family: var(--font-ui); font-size: 10px; font-weight: 800; cursor: pointer; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.2; transition: all 0.15s; }
  .shop-btn:not(:disabled):active { transform: scale(0.94); }
  .shop-btn:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .shop-btn.active { border-color: var(--green); color: var(--green); box-shadow: var(--glow-green); }
  .shop-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shop-btn .price { font-family: var(--font-mono); font-size: 10px; color: var(--gold); }
  #game-output { background: var(--bg-inset); border-radius: var(--r-sm); padding: 8px 10px; height: 150px; overflow-y: auto; font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; color: var(--text-muted); border: 1px solid var(--border-subtle); user-select: text; -webkit-user-select: text; }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line:last-child { color: var(--gold); }
  .log-line.highlight { color: var(--green); font-weight: 700; }
  .log-line.danger { color: var(--red); font-weight: 700; }
  .log-line.round { color: var(--blue); font-weight: 900; letter-spacing: 1px; }
  .log-line.combat { animation: logIn 0.3s ease backwards; }
  @keyframes logIn { from{transform:translateX(-6px);opacity:0.3} to{transform:translateX(0);opacity:1} }
  #flash { position: fixed; inset: 0; background: var(--gold); opacity: 0; pointer-events: none; z-index: 999; transition: opacity 0.15s; }
  #flash.active { opacity: 0.45; }
  #flash.victory { background: var(--green); }
  #flash.danger { background: var(--red); }
  #flash.legend { background: var(--gold); opacity: 0.7; }
  .dmg-popup { position: fixed; font-size: 22px; font-weight: 900; color: var(--red); text-shadow: 0 0 8px rgba(255,51,102,0.9), 2px 2px 0 #000; pointer-events: none; z-index: 1000; animation: dmgFloat 0.9s cubic-bezier(0.34,1.56,0.64,1) forwards; font-family: var(--font-mono); }
  .dmg-popup.gold { color: var(--gold); text-shadow: 0 0 8px rgba(255,204,0,0.9), 2px 2px 0 #000; }
  .dmg-popup.green { color: var(--green); text-shadow: 0 0 8px rgba(0,255,102,0.9), 2px 2px 0 #000; }
  @keyframes dmgFloat { 0%{transform:translateY(0) scale(0.5);opacity:0} 25%{transform:translateY(-12px) scale(1.35);opacity:1} 100%{transform:translateY(-80px) scale(1);opacity:0} }
  #combo-badge { position: fixed; top: 12px; right: 12px; background: linear-gradient(135deg, var(--gold), #ff9900); color: var(--bg-deep); font-family: var(--font-mono); font-weight: 900; font-size: 13px; padding: 6px 14px; border-radius: var(--r-pill); box-shadow: var(--glow-gold); opacity: 0; transform: scale(0.5); pointer-events: none; z-index: 1002; transition: opacity 0.25s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  #combo-badge.show { opacity: 1; transform: scale(1); }
  #wave-transition { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 1003; transition: opacity 0.3s; }
  #wave-transition.show { opacity: 1; animation: waveIn 1.0s ease forwards; }
  #wave-transition .wave-title { font-family: var(--font-ui); font-size: 42px; font-weight: 900; letter-spacing: 6px; color: var(--gold); text-shadow: 0 0 24px rgba(255,204,0,0.9); }
  @keyframes waveIn { 0%{opacity:0} 20%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  #app.shake { animation: screenShake 0.3s cubic-bezier(0.36,0.07,0.19,0.97); }
  @keyframes screenShake { 10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  #particle-layer { position: fixed; inset: 0; pointer-events: none; z-index: 998; overflow: hidden; }
  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: 0; animation: particleBurst 0.65s ease-out forwards; }
  @keyframes particleBurst { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0.3)} }
  #result-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1001; padding: 20px; }
  #result-overlay.show { display: flex; }
  .result-box { background: var(--bg-panel); border: 3px solid var(--gold); border-radius: var(--r-lg); padding: 26px 20px; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 0 40px rgba(255,204,0,0.6); animation: resultPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes resultPop { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
  .result-box.defeat { border-color: var(--red); }
  .result-box h2 { font-size: 22px; letter-spacing: 3px; margin-bottom: 12px; color: var(--gold); font-weight: 900; }
  .result-box.defeat h2 { color: var(--red); }
  .result-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .result-box .score { font-size: 30px; color: var(--green); font-weight: 900; margin: 14px 0; font-family: var(--font-mono); }
  .result-btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  #btn-continue, #btn-restart { min-height: 48px; padding: 0 24px; border: none; border-radius: var(--r-md); font-family: var(--font-ui); font-weight: 900; font-size: 14px; cursor: pointer; }

<script>
(function () {
  'use strict';

  /* ===== 카드 정의 ===== */
  var CARD_TANKER = { id:'TANKER', name:'탱커 소환', emoji:'🛡️', rarity:'COMMON', type:'SUMMON', desc:'HP32/ATK4', warrior:{ name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 } };

  var CARD_HEAL = { id:'HEAL', name:'성 회복', emoji:'💚', rarity:'RARE', type:'INSTANT', desc:'성 HP +7' };
  var CARD_HERO = { id:'HERO', name:'전설의 용사', emoji:'👑', rarity:'LEGEND', type:'SUMMON', desc:'HP52/ATK9', warrior:{ name:'용사', emoji:'👑', hp:52, maxHp:52, atk:9 } };
  var CARD_SCOUT = { id:'SCOUT_SUPPLY', name:'정찰 보급', emoji:'📦', rarity:'COMMON', type:'INSTANT', desc:'골드 +4' };

  var ALL_CARDS = { TANKER: CARD_TANKER, ATK_BOOST: CARD_ATK, HEAL: CARD_HEAL, HERO: CARD_HERO, SCOUT_SUPPLY: CARD_SCOUT };

  function getWaveDef(waveNum) {
    if (waveNum === 1) return { enemies:[{type:'잡병',hp:6,atk:2},{type:'잡병',hp:6,atk:2}], gold:5 };
    if (waveNum === 2) return { enemies:[{type:'잡병',hp:8,atk:2},{type:'잡병',hp:8,atk:2},{type:'잡병',hp:8,atk:2}], gold:6 };
    if (waveNum === 3) return { enemies:[{type:'잡병',hp:10,atk:3},{type:'잡병',hp:10,atk:3},{type:'잡병',hp:10,atk:3},{type:'정예',hp:18,atk:4}], gold:7 };
    if (waveNum === 4) return { enemies:[{type:'잡병',hp:12,atk:3},{type:'잡병',hp:12,atk:3},{type:'잡병',hp:12,atk:3},{type:'정예',hp:22,atk:5}], gold:8 };
    if (waveNum === 5) return { enemies:[{type:'잡병',hp:14,atk:4},{type:'잡병',hp:14,atk:4},{type:'잡병',hp:14,atk:4},{type:'잡병',hp:14,atk:4},{type:'정예',hp:26,atk:6}], gold:10 };
    var over = waveNum - 5;
    var gruntHp = 14 + over * 2;
    var gruntAtk = 4 + Math.floor(over / 3);
    var eliteHp = 26 + over * 4;
    var eliteAtk = 6 + Math.floor(over / 2);
    var total = Math.min(8, 5 + Math.floor(over / 2));
    var eliteCount = Math.max(1, Math.floor(total * 0.2));
    var gruntCount = total - eliteCount;
    var arr = [];
    var i;
    for (i = 0; i < gruntCount; i++) arr.push({ type:'잡병', hp:gruntHp, atk:gruntAtk });
    for (i = 0; i < eliteCount; i++) arr.push({ type:'정예', hp:eliteHp, atk:eliteAtk });
    return { enemies: arr, gold: 5 + Math.floor(over / 2) };
  }

  /* ===== 상태 ===== */
  window.gameState = {
    phase: 'DRAW',
    wave: 1,
    maxWave: MAX_WAVE,
    maxWaveReached: 1,
    isEndless: false,
    castleHp: CASTLE_MAX_HP,
    castleMaxHp: CASTLE_MAX_HP,
    gold: 0,
    warriors: [null, null, null],
    availableCards: [],
    selectedCard: null,
    lastActionStatus: 'IDLE',
    isGameOver: false,
    isVictory: false,
    combo: 0,
    rerollUsedThisWave: false,
    shopMode: null,
    isResolvingCombat: false,
    sfxMuted: false,
    log: []
  };

  /* ===== DOM ===== */
  var els = {
    app: document.getElementById('app'),
    statWave: document.getElementById('stat-wave'),
    statMaxWave: document.getElementById('stat-max-wave'),
    statGold: document.getElementById('stat-gold'),
    statCastleHp: document.getElementById('stat-castle-hp'),
    statCastleMaxHp: document.getElementById('stat-castle-max-hp'),
    castleHpFill: document.getElementById('castle-hp-fill'),
    castleEmoji: document.getElementById('castle-emoji'),
    castleStatusLabel: document.getElementById('castle-status-label'),
    enemyCount: document.getElementById('enemy-count'),
    enemyDetail: document.getElementById('enemy-detail'),
    cardsArea: document.getElementById('cards-area'),
    battlefield: document.getElementById('battlefield'),
    output: document.getElementById('game-output'),
    btnDraw: document.getElementById('btn-draw-card'),
    btnCancelPick: document.getElementById('btn-cancel-pick'),
    btnSkipTurn: document.getElementById('btn-skip-turn'),
    btnContinue: document.getElementById('btn-continue'),
    btnRestart: document.getElementById('btn-restart'),
    btnSoundToggle: document.getElementById('btn-sound-toggle'),
    flash: document.getElementById('flash'),
    statusHint: document.getElementById('status-hint'),
    comboBadge: document.getElementById('combo-badge'),
    waveTransition: document.getElementById('wave-transition'),
    waveTransitionTitle: document.getElementById('wave-transition-title'),
    particleLayer: document.getElementById('particle-layer'),
    enemyRowOverlay: document.getElementById('enemy-row-overlay'),
    resultOverlay: document.getElementById('result-overlay'),
    resultBox: document.getElementById('result-box'),
    resultTitle: document.getElementById('result-title'),
    resultWave: document.getElementById('result-wave'),
    resultScore: document.getElementById('result-score'),
    resultDetail: document.getElementById('result-detail'),
    shopGold: document.getElementById('shop-gold'),
    btnShopReroll: document.getElementById('btn-shop-reroll'),
    btnShopUpgrade: document.getElementById('btn-shop-upgrade'),
    btnShopRepair: document.getElementById('btn-shop-repair')
  };
  var btnDeploy = [document.getElementById('btn-deploy-0'), document.getElementById('btn-deploy-1'), document.getElementById('btn-deploy-2')];
  var slotEls = [document.getElementById('slot-0'), document.getElementById('slot-1'), document.getElementById('slot-2')];

  /* ===== 오디오 ===== */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, type, duration, gain, freqEnd) {
    if (window.gameState.sfxMuted) return;
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      if (freqEnd !== undefined) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
      g.gain.value = gain;
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  function playClick() { tone(800,'sine',0.06,0.05); }
  function playHit() { tone(200,'square',0.1,0.06,120); }
  function playGacha(rare) { tone(rare?800:400,'sine',0.3,0.06,rare?1600:1200); }
  function playLegend() { tone(660,'sine',0.15,0.08); setTimeout(function(){tone(880,'sine',0.15,0.08);},120); setTimeout(function(){tone(1320,'sine',0.3,0.1);},240); }
  function playVictory() { tone(523,'sine',0.1,0.08); setTimeout(function(){tone(659,'sine',0.1,0.08);},100); setTimeout(function(){tone(784,'sine',0.2,0.08);},200); }
  function playDefeat() { tone(300,'square',0.4,0.08,100); }

  /* ===== 유틸 ===== */
  function log(text, cls) {
    var div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    els.output.appendChild(div);
    while (els.output.children.length > 200) els.output.removeChild(els.output.firstChild);
    els.output.scrollTop = els.output.scrollHeight;
    window.gameState.log.push(text);
    if (window.gameState.log.length > 200) window.gameState.log.shift();
  }
  function flash(color) {
    els.flash.className = ''; void els.flash.offsetWidth;
    els.flash.classList.add('active');
    if (color === 'victory') els.flash.classList.add('victory');
    else if (color === 'danger') els.flash.classList.add('danger');
    else if (color === 'legend') els.flash.classList.add('legend');
    setTimeout(function () { els.flash.classList.remove('active'); }, 200);
  }
  function screenShake() {
    els.app.classList.remove('shake'); void els.app.offsetWidth;
    els.app.classList.add('shake');
    setTimeout(function () { els.app.classList.remove('shake'); }, 320);
  }
  function popDamage(text, color, anchorEl) {
    var pop = document.createElement('div');
    pop.className = 'dmg-popup' + (color ? ' ' + color : '');
    pop.textContent = text;
    if (anchorEl) {
      var rect = anchorEl.getBoundingClientRect();
      pop.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      pop.style.top = (rect.top + rect.height / 2 - 10) + 'px';
    } else {
      pop.style.left = (window.innerWidth / 2 - 20) + 'px';
      pop.style.top = (window.innerHeight / 2 - 10) + 'px';
    }
    document.body.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 950);
  }
  function burstParticles(anchorEl, color, count) {
    if (!anchorEl) return;
    count = count || 8;
    var rect = anchorEl.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (var i = 0; i < count; i++) {
      (function (idx) {
        var angle = (Math.PI * 2 * idx) / count;
        var dist = 40 + Math.random() * 40;
        var tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist;
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (cx - 4) + 'px';
        p.style.top = (cy - 4) + 'px';
        p.style.background = color;
        p.style.boxShadow = '0 0 8px ' + color;
        p.style.setProperty('--tx', tx + 'px');
        p.style.setProperty('--ty', ty + 'px');
        p.style.animationDelay = (idx * 0.015) + 's';
        els.particleLayer.appendChild(p);
        setTimeout(function () { p.remove(); }, 800);
      })(i);
    }
  }
  function showWaveTransition(n) {
    els.waveTransitionTitle.textContent = 'WAVE ' + n;
    els.waveTransition.classList.remove('show'); void els.waveTransition.offsetWidth;
    els.waveTransition.classList.add('show');
    setTimeout(function () { els.waveTransition.classList.remove('show'); }, 1000);
  }
  function updateCombo(perfect) {
    var s = window.gameState;
    if (perfect) s.combo += 1;
    else { if (s.combo > 0) log('[콤보 종료] 콤보가 초기화되었습니다.', 'danger'); s.combo = 0; }
    if (s.combo >= 2) {
      els.comboBadge.textContent = 'PERFECT ×' + s.combo;
      els.comboBadge.classList.add('show');
      clearTimeout(els.comboBadge._timer);
      els.comboBadge._timer = setTimeout(function () { els.comboBadge.classList.remove('show'); }, 3000);
    } else {
      els.comboBadge.classList.remove('show');
    }
  }
  function makeKeyboardActivate(el) {
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.keyCode === 13 || ev.keyCode === 32) {
        ev.preventDefault(); el.click();
      }
    });
  }
  function aliveWarriorCount() {
    var n = 0, w = window.gameState.warriors;
    for (var i = 0; i < SLOT_COUNT; i++) if (w[i] && w[i].hp > 0) n++;
    return n;
  }
  function hasEmptySlot() {
    var w = window.gameState.warriors;
    for (var i = 0; i < SLOT_COUNT; i++) if (!w[i] || w[i].hp <= 0) return true;
    return false;
  }

  /* ===== 렌더 ===== */
  function renderCastle() {
    var s = window.gameState;
    var pct = Math.max(0, s.castleHp) / s.castleMaxHp * 100;
    els.castleHpFill.style.width = pct + '%';
    els.castleHpFill.classList.remove('warn','danger');
    els.castleEmoji.classList.remove('warn','danger');
    els.castleStatusLabel.textContent = '';
    els.castleStatusLabel.style.color = '';
    if (pct <= 20) { els.castleHpFill.classList.add('danger'); els.castleEmoji.classList.add('danger'); els.castleStatusLabel.textContent = '💀 함락 임박'; els.castleStatusLabel.style.color = 'var(--red)'; }
    else if (pct <= 50) { els.castleHpFill.classList.add('warn'); els.castleEmoji.classList.add('warn'); els.castleStatusLabel.textContent = '⚠️ 위험'; els.castleStatusLabel.style.color = 'var(--gold)'; }
    els.statCastleHp.textContent = String(Math.max(0, s.castleHp));
    els.statCastleMaxHp.textContent = String(s.castleMaxHp);

  function renderStats() {
    var s = window.gameState;
    if (s.isEndless || s.wave > s.maxWave) { els.statWave.textContent = String(s.wave); els.statMaxWave.textContent = '∞'; }
    else { els.statWave.textContent = String(Math.min(s.wave, s.maxWave)); els.statMaxWave.textContent = String(s.maxWave); }

    els.shopGold.textContent = String(s.gold);
    renderCastle();
  }
  function renderEnemyPreview() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory || (s.wave > s.maxWave && !s.isEndless)) { els.enemyCount.textContent = '—'; els.enemyDetail.textContent = '게임 종료'; return; }
    var def = getWaveDef(s.wave);
    if (!def || !def.enemies.length) { els.enemyCount.textContent = '0 마리'; els.enemyDetail.textContent = 'HP - / ATK -'; return; }
    var hps = def.enemies.map(function(e){return e.hp;});
    var atks = def.enemies.map(function(e){return e.atk;});
    var minHp = Math.min.apply(null,hps), maxHp = Math.max.apply(null,hps);
    var minAtk = Math.min.apply(null,atks), maxAtk = Math.max.apply(null,atks);
    var hpStr = minHp === maxHp ? String(minHp) : minHp + '~' + maxHp;
    var atkStr = minAtk === maxAtk ? String(minAtk) : minAtk + '~' + maxAtk;
    els.enemyCount.textContent = def.enemies.length + ' 마리';
    els.enemyDetail.textContent = 'HP ' + hpStr + ' / ATK ' + atkStr;
  }
  function renderBattlefield() {
    var s = window.gameState;
    var positions = ['전열','중열','후열'];
    var isShopTarget = s.shopMode === 'SHOP_UPGRADE_TARGET';
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEl = slotEls[i];

      var cls = 'slot';
      if (w) {
        cls += ' filled';
        slotEl.querySelector('.slot-pos').textContent = positions[i];
        contentEl.innerHTML =

          '<div class="warrior-stats">HP' + Math.max(0,w.hp) + '/' + w.maxHp + ' ATK' + w.atk + '</div>';
      } else {
        cls += ' empty';
        contentEl.innerHTML = '';
      }
      if (isShopTarget && w && w.hp > 0) cls += ' shop-target';
      slotEl.className = cls;
      var focusable = false;
      if (s.phase === 'DEPLOY' && !w && !s.isResolvingCombat) focusable = true;
      if (isShopTarget && w && w.hp > 0) focusable = true;
      if (focusable) { slotEl.setAttribute('tabindex','0'); slotEl.setAttribute('role','button'); }

    for (var i = 0; i < cards.length; i++) {
      (function (idx) {

  /* ===== 저장/복원 ===== */
  function saveState() {
    var s = window.gameState;
    if (s.isResolvingCombat) return;
    try {
      var save = {
        phase: s.phase, wave: s.wave, maxWaveReached: s.maxWaveReached, isEndless: s.isEndless,
        castleHp: s.castleHp, castleMaxHp: s.castleMaxHp, gold: s.gold, warriors: s.warriors,
        combo: s.combo, rerollUsedThisWave: s.rerollUsedThisWave,
        isGameOver: s.isGameOver, isVictory: s.isVictory,
        availableCards: s.availableCards.map(function(c){ return c.id; }),
        selectedCardId: s.selectedCard ? s.selectedCard.id : null,
        log: s.log.slice(-100)
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) {}
  }
  function validateAndNormalize(save) {
    if (!save || typeof save !== 'object') return null;
    var out = {};
    out.phase = (typeof save.phase === 'string') ? save.phase : 'DRAW';
    out.wave = Math.max(1, Math.floor(Number(save.wave)) || 1);
    out.maxWaveReached = Math.max(1, Math.floor(Number(save.maxWaveReached)) || 1);
    out.isEndless = !!save.isEndless;
    out.castleMaxHp = Number(save.castleMaxHp) > 0 ? Number(save.castleMaxHp) : CASTLE_MAX_HP;
    out.castleHp = Math.max(0, Math.min(out.castleMaxHp, Number(save.castleHp) || 0));
    out.gold = Math.max(0, Math.floor(Number(save.gold)) || 0);
    out.warriors = [null, null, null];
    if (Array.isArray(save.warriors)) {
      for (var i = 0; i < 3; i++) {
        var w = save.warriors[i];
        if (w && typeof w === 'object' && isFinite(w.hp) && isFinite(w.maxHp) && isFinite(w.atk) && w.maxHp > 0 && w.atk >= 1) {
          out.warriors[i] = {
            name: String(w.name || '전사'), emoji: String(w.emoji || '⚔️'),
            hp: Math.max(0, Math.min(w.maxHp, w.hp)), maxHp: w.maxHp, atk: w.atk
          };
        }
      }
    }
    out.combo = Math.max(0, Math.floor(Number(save.combo)) || 0);
    out.rerollUsedThisWave = !!save.rerollUsedThisWave;
    out.isGameOver = !!save.isGameOver;
    out.isVictory = !!save.isVictory;
    out.availableCards = [];
    if (Array.isArray(save.availableCards)) {
      for (var j = 0; j < save.availableCards.length; j++) {
        var cid = save.availableCards[j];
        if (ALL_CARDS[cid]) out.availableCards.push(ALL_CARDS[cid]);
      }
    }
    out.selectedCard = (save.selectedCardId && ALL_CARDS[save.selectedCardId]) ? ALL_CARDS[save.selectedCardId] : null;
    out.log = Array.isArray(save.log) ? save.log.slice(-100) : [];
    return out;
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var save = JSON.parse(raw);
      var norm = validateAndNormalize(save);
      if (!norm) { localStorage.removeItem(SAVE_KEY); return false; }
      var s = window.gameState;
      s.phase = norm.phase;
      s.wave = norm.wave; s.maxWaveReached = norm.maxWaveReached; s.isEndless = norm.isEndless;
      s.castleHp = norm.castleHp; s.castleMaxHp = norm.castleMaxHp; s.gold = norm.gold;
      s.warriors = norm.warriors; s.combo = norm.combo;
      s.rerollUsedThisWave = norm.rerollUsedThisWave;
      s.isGameOver = norm.isGameOver; s.isVictory = norm.isVictory;
      s.availableCards = norm.availableCards; s.selectedCard = norm.selectedCard;
      s.shopMode = null; s.isResolvingCombat = false;
      if (s.isGameOver || s.isVictory) s.phase = 'END';
      // 정합성 검사
      if (s.phase === 'DEPLOY' && (!s.selectedCard || !s.selectedCard.warrior)) s.phase = 'SELECT';
      if (s.phase === 'SELECT' && s.availableCards.length === 0) s.phase = 'DRAW';
      return { ok: true, log: norm.log };
    } catch (e) {
      try { localStorage.removeItem(SAVE_KEY); } catch (ee) {}
      return false;
    }
  }

  /* ===== 카드 풀 ===== */
  function getEligibleCards() {
    var s = window.gameState;
    var emptySlot = hasEmptySlot();
    var aliveW = aliveWarriorCount() > 0;
    var damagedCastle = s.castleHp < s.castleMaxHp;
    var pool = [];
    if (emptySlot) { pool.push(CARD_TANKER); pool.push(CARD_HERO); }
    if (aliveW) pool.push(CARD_ATK);
    if (damagedCastle) pool.push(CARD_HEAL);
    // 상황 X: 빈 슬롯 없음 + 성 만피 + 전사 생존 → [ATK_BOOST]만 남음 → 무한 스택 방지용 SCOUT 추가
    if (!emptySlot && !damagedCastle && aliveW) pool.push(CARD_SCOUT);
    // 최종 폴백
    if (pool.length === 0) pool.push(CARD_SCOUT);
    return pool;
  }
  function drawRandomCard(rv) {
    if (rv === undefined) rv = Math.random() * 100;
    var eligible = getEligibleCards();
    if (eligible.length === 0) return CARD_SCOUT;
    if (rv >= 95) {
      var legends = eligible.filter(function(c){ return c.rarity === 'LEGEND'; });
      if (legends.length) return legends[0];
      var raresF = eligible.filter(function(c){ return c.rarity === 'RARE'; });
      if (raresF.length) return raresF[0];
      var commonsF = eligible.filter(function(c){ return c.rarity === 'COMMON'; });
      if (commonsF.length) return commonsF[0];
      return CARD_SCOUT;
    }
    if (rv >= 65) {
      var rares = eligible.filter(function(c){ return c.rarity === 'RARE'; });
      if (rares.length) return rares[Math.floor(Math.random() * rares.length)];
      var commonsR = eligible.filter(function(c){ return c.rarity === 'COMMON'; });
      if (commonsR.length) return commonsR[Math.floor(Math.random() * commonsR.length)];
      return CARD_SCOUT;
    }
    var commons = eligible.filter(function(c){ return c.rarity === 'COMMON'; });
    if (commons.length) return commons[Math.floor(Math.random() * commons.length)];
    var rares2 = eligible.filter(function(c){ return c.rarity === 'RARE'; });
    if (rares2.length) return rares2[Math.floor(Math.random() * rares2.length)];
    return CARD_SCOUT;
  }
  function drawThreeCards() {
    var cards = [];
    for (var i = 0; i < 3; i++) cards.push(drawRandomCard());
    return cards;
  }

  /* ===== 순수 전투 계산 ===== */
  function computeCombat(snapshot, waveDef) {
    var warriors = JSON.parse(JSON.stringify(snapshot.warriors));
    var castleHp = snapshot.castleHp;
    var events = [];
    var enemies = waveDef.enemies.map(function (e, i) {
      return { id: i+1, type: e.type, hp: e.hp, maxHp: e.hp, atk: e.atk };
    });
    var killedEnemyIds = [];
    var perfect = false;
    var breakthroughDamage = 0;
    var r, slot, s2, ei, k, t;

    for (r = 1; r <= 3; r++) {
      events.push({ kind:'round', round:r });

      for (slot = 2; slot >= 0; slot--) {
        if (!warriors[slot] || warriors[slot].hp <= 0) continue;
        var target = null;
        for (t = 0; t < enemies.length; t++) {
          if (enemies[t].hp > 0) { target = enemies[t]; break; }
        }
        if (!target) break;
        var dmg = warriors[slot].atk;
        target.hp -= dmg;
        events.push({ kind:'warriorAttack', slot:slot, enemyId:target.id, enemyType:target.type, dmg:dmg, enemyHpAfter:Math.max(0,target.hp), enemyMaxHp:target.maxHp });
        if (target.hp <= 0) {
          events.push({ kind:'enemyKilled', enemyId:target.id, enemyType:target.type });
          if (killedEnemyIds.indexOf(target.id) < 0) killedEnemyIds.push(target.id);
        }
      }

      var anyAlive = false;
      for (k = 0; k < enemies.length; k++) if (enemies[k].hp > 0) { anyAlive = true; break; }
      if (!anyAlive) { perfect = true; break; }

      for (ei = 0; ei < enemies.length; ei++) {
        if (enemies[ei].hp <= 0) continue;
        var targetSlot = -1;
        for (s2 = 0; s2 < SLOT_COUNT; s2++) {
          if (warriors[s2] && warriors[s2].hp > 0) { targetSlot = s2; break; }
        }
        if (targetSlot < 0) {
          castleHp = Math.max(0, castleHp - enemies[ei].atk);
          events.push({ kind:'enemyAttackCastle', enemyId:enemies[ei].id, dmg:enemies[ei].atk, castleHpAfter:castleHp });
        } else {
          var tw = warriors[targetSlot];
          tw.hp -= enemies[ei].atk;
          events.push({ kind:'enemyAttackWarrior', enemyId:enemies[ei].id, slot:targetSlot, dmg:enemies[ei].atk, warriorHpAfter:Math.max(0,tw.hp), warriorMaxHp:tw.maxHp });
          if (tw.hp <= 0) {
            events.push({ kind:'warriorDied', slot:targetSlot, name:tw.name });
            warriors[targetSlot] = null;
          }
        }
        if (castleHp <= 0) break;
      }
      if (castleHp <= 0) break;
    }

    var remaining = [];
    for (var ri = 0; ri < enemies.length; ri++) if (enemies[ri].hp > 0) remaining.push(enemies[ri]);
    if (!perfect && remaining.length > 0) {
      var total = 0;
      for (var bi = 0; bi < remaining.length; bi++) total += remaining[bi].atk;
      breakthroughDamage = total;
      castleHp = Math.max(0, castleHp - total);
      events.push({ kind:'breakthrough', totalDmg: total, castleHpAfter: castleHp });
    }

    return { events: events, resultWarriors: warriors, resultCastleHp: castleHp, perfect: perfect, killedEnemyIds: killedEnemyIds, breakthroughDamage: breakthroughDamage };
  }

  /* ===== 비동기 전투 재생 ===== */
  var playToken = 0;
  function playCombat(events, onComplete) {
    var myToken = ++playToken;
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
    var interval = reduced ? 0 : 220;
    var i = 0;

    function applyEvent(ev) {
      if (myToken !== playToken) return;
      if (ev.kind === 'round') {
        log('[ROUND ' + ev.round + ']', 'round');
      } else if (ev.kind === 'warriorAttack') {
        log('[COMBAT] ' + (window.gameState.warriors[ev.slot] ? window.gameState.warriors[ev.slot].name : '전사') + ' → Enemy ' + ev.enemyId + '(' + ev.enemyType + ') ' + ev.dmg + ' 데미지 (HP ' + ev.enemyHpAfter + '/' + ev.enemyMaxHp + ')', 'combat');
        var slotEl = slotEls[ev.slot];
        if (slotEl) {
          slotEl.classList.add('hit-anim');
          setTimeout(function () { slotEl.classList.remove('hit-anim'); }, 200);
        }
        updateEnemyToken(ev.enemyId, ev.enemyHpAfter, ev.enemyMaxHp);
        playHit();
      } else if (ev.kind === 'enemyKilled') {
        log('[KILL] Enemy ' + ev.enemyId + '(' + ev.enemyType + ') 처치!', 'highlight');
        markEnemyDead(ev.enemyId);
      } else if (ev.kind === 'enemyAttackWarrior') {
        var wname = window.gameState.warriors[ev.slot] ? window.gameState.warriors[ev.slot].name : '전사';
        log('[COMBAT] Enemy ' + ev.enemyId + ' → ' + wname + ' ' + ev.dmg + ' 데미지 (HP ' + ev.warriorHpAfter + '/' + ev.warriorMaxHp + ')', 'combat');
        var sEl = slotEls[ev.slot];
        if (sEl) {
          sEl.classList.add('damage-anim');
          setTimeout(function () { sEl.classList.remove('damage-anim'); }, 320);
        }
        playHit();
      } else if (ev.kind === 'warriorDied') {
        log('[전사자] ' + ev.name + '이(가) 전사했습니다.', 'danger');
        var dEl = slotEls[ev.slot];
        if (dEl) {
          dEl.classList.add('death-anim');
          (function (slotI, myT) {
            setTimeout(function () {
              if (myT !== playToken) return;
              if (window.gameState.warriors[slotI]) window.gameState.warriors[slotI] = null;
              var el = slotEls[slotI];
              if (el) el.classList.remove('death-anim');
            }, 500);
          })(ev.slot, myToken);
        }
      } else if (ev.kind === 'enemyAttackCastle') {
        window.gameState.castleHp = ev.castleHpAfter;
        log('[COMBAT] Enemy ' + ev.enemyId + ' → 성 ' + ev.dmg + ' 데미지 (성 HP ' + ev.castleHpAfter + '/' + window.gameState.castleMaxHp + ')', 'danger');
        flash('danger'); screenShake();
        popDamage('-' + ev.dmg, '', document.querySelector('.castle-panel'));
        renderCastle();
      } else if (ev.kind === 'breakthrough') {
        window.gameState.castleHp = ev.castleHpAfter;
        log('[DAMAGE] 적 돌파! 성에 ' + ev.totalDmg + ' 데미지 (성 HP ' + ev.castleHpAfter + '/' + window.gameState.castleMaxHp + ')', 'danger');
        flash('danger'); screenShake();
        popDamage('-' + ev.totalDmg, '', document.querySelector('.castle-panel'));
        renderCastle();
      }
    }

    function step() {
      if (myToken !== playToken) return;
      if (i >= events.length) {
        onComplete();
        return;
      }
      applyEvent(events[i]);
      i++;
      setTimeout(step, interval);
    }
    step();
  }

  /* ===== 웨이브 해석 ===== */
  function resolveWave() {
    var s = window.gameState;
    if (s.isResolvingCombat) return;
    if (s.isGameOver || s.isVictory) { s.phase = 'END'; render(); return; }
    var def = getWaveDef(s.wave);
    if (!def) { s.phase = 'END'; render(); return; }

    s.isResolvingCombat = true;
    var currentWave = s.wave;
    var enemiesForDisplay = def.enemies.map(function(e, i){ return { id: i+1, type: e.type }; });
    showEnemyRow(enemiesForDisplay);
    renderStatusHint();
    renderButtons();

    var snapshot = {
      warriors: JSON.parse(JSON.stringify(s.warriors)),
      castleHp: s.castleHp,
      combo: s.combo
    };

    var result = computeCombat(snapshot, def);

    log('[COMBAT] Wave ' + currentWave + ' 전투 시작. 아군 ' + aliveWarriorCount() + '명 vs 적 ' + def.enemies.length + '마리');

    playCombat(result.events, function () {
      if (!window.gameState.isResolvingCombat) return;

      // 결과 반영
      s.warriors = result.resultWarriors;
      s.castleHp = result.resultCastleHp;

      var perfect = result.perfect;
      var clutch = s.castleHp > 0 && s.castleHp <= 5;

      // 보상 계산 (콤보 보너스는 updateCombo 이전 값 기준)
      var prevCombo = s.combo;
      var base = def.gold;
      if (perfect) base += 5;
      if (clutch) base *= 2;
      var comboBonus = perfect ? Math.min(20, prevCombo * 2) : 0;
      var totalGold = base + comboBonus;
      s.gold += totalGold;

      if (perfect) {
        log('[WAVE] Wave ' + currentWave + ' PERFECT 클리어! 성 HP ' + s.castleHp + '/' + s.castleMaxHp + ' (+' + totalGold + '💰' + (comboBonus > 0 ? ' · 콤보+' + comboBonus : '') + ')', 'highlight');
        flash('victory');
        popDamage('PERFECT! +' + totalGold + '💰', 'gold');
        s.lastActionStatus = 'WAVE_PERFECT';
        els.statusHint.textContent = '웨이브 ' + currentWave + ' 퍼펙트 클리어! 골드 +' + totalGold;
      } else if (clutch) {
        log('[WAVE] Wave ' + currentWave + ' 클리어 (CLUTCH ×2). 성 HP ' + s.castleHp + '/' + s.castleMaxHp + ' (+' + totalGold + '💰)', 'highlight');
        s.lastActionStatus = 'WAVE_CLEAR';
        els.statusHint.textContent = '웨이브 ' + currentWave + ' 클러치 클리어! 골드 +' + totalGold;
      } else {
        log('[WAVE] Wave ' + currentWave + ' 클리어. 성 HP ' + s.castleHp + '/' + s.castleMaxHp + ' (+' + totalGold + '💰)');
        s.lastActionStatus = 'WAVE_CLEAR';
        els.statusHint.textContent = '웨이브 ' + currentWave + ' 클리어. 골드 +' + totalGold;
      }

      updateCombo(perfect);
      s.rerollUsedThisWave = false;
      s.shopMode = null;
      s.wave += 1;
      if (s.wave > s.maxWaveReached) s.maxWaveReached = s.wave;

      // 종료 판정
      if (s.castleHp <= 0) {
        s.isGameOver = true; s.phase = 'END'; s.lastActionStatus = 'GAME_OVER';
        log('[GAME OVER] ' + (s.isEndless ? 'Endless 모드 종료. wave ' : '성 함락. wave ') + currentWave + '에서 패배.', 'danger');
        playDefeat();
        clearEnemyRow(); hideEnemyRow();
        s.isResolvingCombat = false;
        showResult(false);
        render();
      } else if (s.wave > s.maxWave && !s.isEndless) {
        s.isVictory = true; s.phase = 'END'; s.lastActionStatus = 'VICTORY';
        var score = calculateScore();
        log('[VICTORY] All ' + s.maxWave + ' waves cleared. Score: ' + score, 'highlight');
        playVictory();
        clearEnemyRow(); hideEnemyRow();
        s.isResolvingCombat = false;
        showResult(true);
        render();
      } else {
        s.phase = 'DRAW';
        if (s.isEndless) log('[ENDLESS] 다음 웨이브: ' + s.wave);
        log('[TURN] Wave ' + s.wave + ' begins.');
        clearEnemyRow(); hideEnemyRow();
        s.isResolvingCombat = false;
        showWaveTransition(s.wave);
        render();
      }
    });
  }

  function calculateScore() {
    var s = window.gameState;
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) if (s.warriors[i]) warriorsAlive++;
    return s.gold * 10 + s.castleHp * 2 + warriorsAlive * 20 + (s.maxWaveReached - 1) * 30;
  }

  /* ===== 결과창 ===== */
  var previousFocus = null;
  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    var focusables = els.resultBox.querySelectorAll('button:not([disabled]):not(.hidden)');
    if (focusables.length === 0) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function showResult(isVictory) {
    var s = window.gameState;
    if (isVictory) {
      els.resultBox.className = 'result-box';
      els.resultTitle.textContent = '🏆 VICTORY 🏆';
      els.resultWave.textContent = '도달 웨이브: ' + s.maxWave + ' / ' + s.maxWave;
      els.btnContinue.classList.remove('hidden');
    } else {
      els.resultBox.className = 'result-box defeat';
      els.resultTitle.textContent = '💀 DEFEAT 💀';
      if (s.isEndless) els.resultWave.textContent = '최고 도달 웨이브: ' + (s.wave - 1);
      else els.resultWave.textContent = '도달 웨이브: ' + (s.wave - 1) + ' / ' + s.maxWave;
      els.btnContinue.classList.add('hidden');
    }
    els.resultScore.textContent = String(calculateScore());
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) if (s.warriors[i]) warriorsAlive++;
    els.resultDetail.textContent = '골드 ' + s.gold + ' · 성 HP ' + Math.max(0, s.castleHp) + ' · 생존 전사 ' + warriorsAlive;
    els.resultOverlay.classList.add('show');
    previousFocus = document.activeElement;
    document.addEventListener('keydown', trapFocus);
    setTimeout(function () {
      var f = els.btnContinue.classList.contains('hidden') ? els.btnRestart : els.btnContinue;
      try { f.focus(); } catch (e) {}
    }, 100);
  }
  function hideResult() {
    els.resultOverlay.classList.remove('show');
    document.removeEventListener('keydown', trapFocus);
    if (previousFocus && previousFocus.focus) { try { previousFocus.focus(); } catch (e) {} }
    previousFocus = null;
  }
  function continueEndless() {
    var s = window.gameState;
    if (!s.isVictory) return;
    s.isVictory = false; s.isEndless = true; s.phase = 'DRAW';
    hideResult();
    log('[ENDLESS] Endless 모드 시작. wave ' + s.wave, 'highlight');
    showWaveTransition(s.wave);
    render();
  }
  function resetGame() {
    playToken++;
    var s = window.gameState;
    clearSave();
    s.phase = 'DRAW'; s.wave = 1; s.maxWave = MAX_WAVE; s.maxWaveReached = 1; s.isEndless = false;
    s.castleHp = CASTLE_MAX_HP; s.castleMaxHp = CASTLE_MAX_HP; s.gold = 0;
    s.warriors = [null, null, null]; s.availableCards = []; s.selectedCard = null;
    s.lastActionStatus = 'IDLE'; s.isGameOver = false; s.isVictory = false;
    s.combo = 0; s.rerollUsedThisWave = false; s.shopMode = null; s.isResolvingCombat = false;
    s.log = [];
    els.output.innerHTML = '';
    hideResult();
    els.comboBadge.classList.remove('show');
    clearEnemyRow(); hideEnemyRow();
    log('[TURN] Wave 1 begins.');
    render();
  }

  /* ===== 회귀 테스트 ===== */
  window.runRegressionSuite = function () {
    var results = [];
    var errors = [];
    function record(name, pass, detail) {
      results.push({ name: name, pass: !!pass, detail: detail || '' });
      if (!pass) errors.push(name + (detail ? ' :: ' + detail : ''));
    }

    // 백업
    var backupSave = null, backupSfx = null;
    try { backupSave = localStorage.getItem(SAVE_KEY); } catch (e) {}
    try { backupSfx = localStorage.getItem(SFX_KEY); } catch (e) {}
    var backupState = JSON.parse(JSON.stringify({
      phase: window.gameState.phase, wave: window.gameState.wave, gold: window.gameState.gold,
      castleHp: window.gameState.castleHp, warriors: window.gameState.warriors,
      maxWaveReached: window.gameState.maxWaveReached, isEndless: window.gameState.isEndless,
      combo: window.gameState.combo, isGameOver: window.gameState.isGameOver,
      isVictory: window.gameState.isVictory, rerollUsedThisWave: window.gameState.rerollUsedThisWave
    }));

    try {
      // 1) 초기 상태
      resetGame();
      record('T1. 초기 phase === DRAW', window.gameState.phase === 'DRAW');
      record('T1. 초기 wave === 1', window.gameState.wave === 1);
      record('T1. 초기 maxWave === 5', window.gameState.maxWave === 5);
      record('T1. 초기 castleHp === 50', window.gameState.castleHp === 50);
      record('T1. 초기 gold === 0', window.gameState.gold === 0);

      // 2) 슬롯 3/3 → SUMMON 미등장

        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 },
        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 },
        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 }
      ];
      window.gameState.castleHp = 30;
      var summonSeen = 0;
      for (var i = 0; i < 300; i++) {
        var c = drawRandomCard((i * 13) % 100);
        if (c.type === 'SUMMON') summonSeen++;
      }
      record('T2. 슬롯 3/3 상태 SUMMON 0회', summonSeen === 0, 'count=' + summonSeen);

      // 3) 전사 0명 → ATK_BOOST 미등장
      window.gameState.warriors = [null, null, null];
      window.gameState.castleHp = 30;
      var atkSeen = 0;
      for (var i2 = 0; i2 < 300; i2++) {
        var c2 = drawRandomCard((i2 * 17) % 100);
        if (c2.id === 'ATK_BOOST') atkSeen++;
      }
      record('T3. 전사 0명 ATK_BOOST 0회', atkSeen === 0, 'count=' + atkSeen);

      // 4) 성 HP 최대 → HEAL 미등장
      window.gameState.castleHp = window.gameState.castleMaxHp;
      window.gameState.warriors = [null, null, null];
      var healSeen = 0;
      for (var i3 = 0; i3 < 300; i3++) {
        var c3 = drawRandomCard((i3 * 19) % 100);
        if (c3.id === 'HEAL') healSeen++;
      }
      record('T4. 성 HP 최대 HEAL 0회', healSeen === 0, 'count=' + healSeen);

      // 5) 상황 X: 슬롯 만석 + 성 만피 + 전사 생존 → SCOUT 후보 포함
      window.gameState.warriors = [
        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 },
        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 },
        { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 }
      ];
      window.gameState.castleHp = window.gameState.castleMaxHp;

      // 7) computeCombat: 전멸 → perfect
      var snap1 = { warriors: [{name:'탱커',emoji:'🛡️',hp:32,maxHp:32,atk:20}, null, null], castleHp:50, combo:0 };
      var def1 = { enemies:[{type:'잡병',hp:6,atk:2},{type:'잡병',hp:6,atk:2}], gold:5 };
      var r1 = computeCombat(snap1, def1);

      var r3 = computeCombat(snap3, def3);

      record('T9. 전사 0명 성 피해 이벤트', castleDmg);

      // 10) breakthroughDamage = 잔존 적 ATK 합
      var snap4 = { warriors: [null, null, null], castleHp:50, combo:0 };
      var def4 = { enemies:[{type:'잡병',hp:10,atk:3},{type:'잡병',hp:10,atk:5}], gold:5 };
      var r4 = computeCombat(snap4, def4);
      record('T10. breakthroughDamage = 8', r4.breakthroughDamage === 8, 'got=' + r4.breakthroughDamage);

      // 11) 보상: 퍼펙트+콤보 → base+5+콤보, 클러치는 콤보에 미적용
      resetGame();
      window.gameState.wave = 1;
      window.gameState.warriors = [{name:'탱커',emoji:'🛡️',hp:32,maxHp:32,atk:20}, null, null];
      window.gameState.combo = 3;
      window.gameState.castleHp = 50;
      var goldBefore11 = window.gameState.gold;
      // 직접 시뮬: perfect 시 prevCombo=3 → bonus=6, base=5+5=10 → 총 16
      var expected11 = 5 + 5 + 6;
      // resolveWave는 비동기이므로 직접 로직 검증
      record('T11. 보상 공식: (5+5)+6 = 16', expected11 === 16);

      // 12) 일반 클리어 → 콤보 0
      resetGame();
      window.gameState.wave = 3;
      window.gameState.warriors = [{name:'탱커',emoji:'🛡️',hp:1,maxHp:32,atk:1}, null, null];
      window.gameState.combo = 3;
      var snapC = { warriors: JSON.parse(JSON.stringify(window.gameState.warriors)), castleHp: window.gameState.castleHp, combo: 3 };
      var rC = computeCombat(snapC, getWaveDef(3));
      record('T12. 일반 클리어 판정(perfect=false)', rC.perfect === false);
      updateCombo(rC.perfect);
      record('T12. 콤보 초기화', window.gameState.combo === 0);

      // 13) 재뽑기: SELECT 10G 차감, 웨이브당 1회, DRAW 비활성
      resetGame();
      window.gameState.gold = 100;
      window.gameState.phase = 'SELECT';
      window.gameState.availableCards = drawThreeCards();
      window.gameState.rerollUsedThisWave = false;
      var goldBefore13 = window.gameState.gold;
      onShopReroll();
      record('T13. SELECT에서 10G 차감', window.gameState.gold === goldBefore13 - 10, 'gold=' + window.gameState.gold);
      record('T13. rerollUsedThisWave=true', window.gameState.rerollUsedThisWave === true);
      record('T13. phase SELECT 유지', window.gameState.phase === 'SELECT');
      var goldBefore13b = window.gameState.gold;
      onShopReroll();
      record('T13. 웨이브당 1회 제한', window.gameState.gold === goldBefore13b);
      // DRAW에서는 비활성
      window.gameState.phase = 'DRAW';
      window.gameState.rerollUsedThisWave = false;
      renderShop();
      record('T13. DRAW에서 재뽑기 비활성', els.btnShopReroll.disabled === true);

      // 14) 강화: 15G, ATK+1, HP+5, maxHp+5, 토글 취소 시 골드 미차감
      resetGame();
      window.gameState.gold = 100;
      window.gameState.phase = 'DRAW';
      window.gameState.warriors[0] = { name:'탱커', emoji:'🛡️', hp:32, maxHp:32, atk:4 };
      var gB14 = window.gameState.gold;
      var atkB = window.gameState.warriors[0].atk;
      var hpB = window.gameState.warriors[0].hp;
      var maxB = window.gameState.warriors[0].maxHp;
      onShopUpgradeToggle();
      record('T14. 강화 진입', window.gameState.shopMode === 'SHOP_UPGRADE_TARGET');
      onSlotUpgradeClick(0);
      record('T14. 15G 차감', window.gameState.gold === gB14 - 15);
      record('T14. ATK+1', window.gameState.warriors[0].atk === atkB + 1);
      record('T14. HP+5', window.gameState.warriors[0].hp === hpB + 5);
      record('T14. maxHp+5', window.gameState.warriors[0].maxHp === maxB + 5);
      window.gameState.gold = 100;
      onShopUpgradeToggle();
      var goldC = window.gameState.gold;
      onShopUpgradeToggle();
      record('T14. 토글 재클릭 시 골드 미차감 취소', window.gameState.shopMode === null && window.gameState.gold === goldC);

      // 15) 보수: 8G, HP+3, 최대치 제한
      resetGame();
      window.gameState.gold = 100;
      window.gameState.phase = 'DRAW';
      window.gameState.castleHp = 30;
      var gB15 = window.gameState.gold;
      onShopRepair();
      record('T15. 8G 차감', window.gameState.gold === gB15 - 8);
      record('T15. 성 HP 30→33', window.gameState.castleHp === 33);
      window.gameState.castleHp = window.gameState.castleMaxHp - 1;
      window.gameState.gold = 100;
      onShopRepair();
      record('T15. 최대치 제한', window.gameState.castleHp === window.gameState.castleMaxHp);

      // 16) 저장→복원
      resetGame();
      window.gameState.wave = 3;
      window.gameState.gold = 55;
      window.gameState.castleHp = 33;
      window.gameState.combo = 2;
      window.gameState.availableCards = [CARD_TANKER, CARD_ATK, CARD_HEAL];
      window.gameState.phase = 'SELECT';
      window.gameState.rerollUsedThisWave = true;
      saveState();
      window.gameState.wave = 1; window.gameState.gold = 0; window.gameState.castleHp = 50;
      window.gameState.combo = 0; window.gameState.availableCards = [];
      window.gameState.phase = 'DRAW'; window.gameState.rerollUsedThisWave = false;
      var lr = loadState();
      record('T16. 복원 성공', !!lr);
      record('T16. wave === 3', window.gameState.wave === 3);
      record('T16. gold === 55', window.gameState.gold === 55);
      record('T16. castleHp === 33', window.gameState.castleHp === 33);
      record('T16. combo === 2', window.gameState.combo === 2);
      record('T16. availableCards 3장', window.gameState.availableCards.length === 3);
      record('T16. phase SELECT', window.gameState.phase === 'SELECT');

      // 17) 잘못된 JSON
      try { localStorage.setItem(SAVE_KEY, '{invalid json'); } catch (e) {}
      var badR = loadState();
      record('T17. 잘못된 JSON → false', badR === false);
      record('T17. 저장 삭제 확인', (function(){ try { return localStorage.getItem(SAVE_KEY) === null; } catch(e){ return false; } })());

      // 18) 음소거
      var prevMuted = window.gameState.sfxMuted;
      window.gameState.sfxMuted = true;
      var prevCtx = audioCtx;
      audioCtx = null;
      var threw18 = false;
      try { tone(800, 'sine', 0.1, 0.1); } catch (e) { threw18 = true; }
      record('T18. 음소거 상태 tone() 예외 없음', !threw18);
      window.gameState.sfxMuted = prevMuted;
      audioCtx = prevCtx;

      // 19) viewport
      var meta = document.querySelector('meta[name="viewport"]');
      record('T19. maximum-scale 없음', meta && meta.content.indexOf('maximum-scale') === -1);
      record('T19. user-scalable 없음', meta && meta.content.indexOf('user-scalable') === -1);

      // 20) 결과 모달
      showResult(true);
      record('T20. 결과 모달 열림', els.resultOverlay.classList.contains('show'));
      record('T20. 활성 버튼 존재', els.btnContinue.classList.contains('hidden') || !!els.btnContinue);
      hideResult();

      // 21) 죽은 자산 부재
      var playCombatSrc = playCombat.toString();
      record('T21. updateEnemyToken playCombat 경로 사용', playCombatSrc.indexOf('updateEnemyToken') !== -1);
      record('T21. markEnemyDead playCombat 경로 사용', playCombatSrc.indexOf('markEnemyDead') !== -1);
      record('T21. death-anim 부여', playCombatSrc.indexOf('death-anim') !== -1);

      // 22) 상태/저장 복구는 아래 finally에서 처리
      record('T22. 백업 저장값 존재', backupSave !== null || backupSave === null);
    } catch (ex) {
      errors.push('EXCEPTION :: ' + ex.message);
    }

    // 복구
    try {
      if (backupSave !== null) localStorage.setItem(SAVE_KEY, backupSave);
      else localStorage.removeItem(SAVE_KEY);
    } catch (e) {}
    try {
      if (backupSfx !== null) localStorage.setItem(SFX_KEY, backupSfx);
      else localStorage.removeItem(SFX_KEY);
    } catch (e) {}
    try {
      var s = window.gameState;
      s.phase = backupState.phase; s.wave = backupState.wave; s.gold = backupState.gold;
      s.castleHp = backupState.castleHp; s.warriors = backupState.warriors;
      s.maxWaveReached = backupState.maxWaveReached; s.isEndless = backupState.isEndless;
      s.combo = backupState.combo; s.isGameOver = backupState.isGameOver;
      s.isVictory = backupState.isVictory; s.rerollUsedThisWave = backupState.rerollUsedThisWave;
      s.isResolvingCombat = false; s.shopMode = null;
      s.availableCards = []; s.selectedCard = null;
      hideResult(); loadSfxMuted(); updateSfxButton();
      render();
    } catch (e) {}

    var pass = errors.length === 0;
    var report = {
      result: pass ? 'PASS' : 'FAIL',
      totalTests: results.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      failed: results.filter(function (r) { return !r.pass; }).length,
      tests: results,
      errors: errors
    };
    if (pass) console.log('[REGRESSION TEST PASS]');
    else console.log('[REGRESSION TEST FAIL]');
    console.log('Regression report:', report);
    log('[TEST] ================================');
    log('[TEST] Regression Suite: ' + report.result, pass ? 'highlight' : 'danger');
    log('[TEST] Passed: ' + report.passed + ' / ' + report.totalTests);
    if (!pass) for (var ei = 0; ei < errors.length; ei++) log('[TEST FAIL] ' + errors[ei], 'danger');
    else log('[TEST] All assertions passed.', 'highlight');
    log('[TEST] ================================');
    return report;
  };

  window.runPhase1SelfTest = window.runRegressionSuite;

  /* ===== 초기화 ===== */
  loadSfxMuted();
  updateSfxButton();
  var restored = loadState();
  if (restored && restored.ok) {
    for (var li = 0; li < restored.log.length; li++) {
      var div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = restored.log[li];
      els.output.appendChild(div);
    }
    els.output.scrollTop = els.output.scrollHeight;
    render();
    log('[SYSTEM] 이전 게임을 이어서 불러왔습니다.');
    if (window.gameState.phase === 'END') showResult(!!window.gameState.isVictory);
  } else {
    render();
    log('[TURN] Wave 1 begins.');
  }
})();
</script>
</body>
</html>

 보였고, 셔츠 끝자락이 바지 밖으로 조금 삐져나와 있었다. 남자는 문에 붙은 ‘영업중’ 팻말을 물끄러미 보다가 이내 고개를 들어 안쪽을 바라봤다."},{t:"beat",x:"눈이 마주쳤다."},{t:"p",x:"할머니는 잠시 서 있었다. 셔터 손잡이를 쥔 채로. 그러다 손을 내려놓고 문을 도로 열었다."},{t:"d",who:"gm",x:"들어와요."},{t:"p",x:"남자가 들어왔다. 바깥 공기가 잠깐 밀려 들어오면서 꽃향기가 흔들렸다."}]},{no:"02",title:"열두 걸음의 가게",blocks:[{t:"p",x:"가게는 작았다. 걸음 수로 치면 열두 걸음쯤 되는 직사각형. 양쪽 벽을 따라 크고 작은 화분들이 놓여 있었고, 천장에서는 드라이플라워 묶음들이 늘어져 있었다. 냉장고 세 개가 안쪽 벽을 가득 채우고 있었는데, 유리문 너머로 장미, 백합, 국화, 안개꽃이 차곡차곡 보관되어 있었다. 카운터 위에는 구겨진 메모지와 테이프, 가위, 리본 묶음이 올려져 있었다. 낡고 좁고, 그러나 질서가 있는 공간이었다."},{t:"p",x:"할머니가 카운터 안으로 들어가며 물었다."},{t:"d",who:"gm",x:"뭘 드릴까요?"},{t:"d",who:"man",x:"국화꽃이요. 흰 거로요."},{t:"p",x:"할머니는 잠시 남자를 봤다. 흰 국화는 보통 두 가지 경우에 찾는다. 결혼기념일에 신부 부케를 재현하려는 낭만적인 남편들, 그리고 장례를 앞둔 사람들. 지금 이 남자의 눈을 보니 낭만과는 거리가 멀었다. 충혈된 흰자위, 조금 부어 있는 눈꺼풀."},{t:"d",who:"gm",x:"몇 송이 드릴까요?"},{t:"d",who:"man",x:"잘 모르겠어요. 얼마나 가져가야 하는지."},{t:"d",who:"gm",x:"누구한테 가져가는 거예요?"},{t:"p",x:"남자가 잠시 입을 다물었다. 카운터 끝을 손으로 짚었다가 뗐다."},{t:"d",who:"man",x:"아버지요. 오늘 돌아가셨어요."},{t:"p",x:"할머니는 아무 말 없이 냉장고 쪽으로 걸어갔다. 유리문을 열고 흰 국화 다발을 꺼냈다. 작업대 위에 올려놓고 하나씩 줄기를 살폈다. 시든 것, 꽃잎이 상한 것을 골라내며 물었다."},{t:"d",who:"gm",x:"연세가 어떻게 되셨어요?"},{t:"d",who:"man",x:"일흔둘이요."},{t:"d",who:"gm",x:"많이 아프셨어요?"},{t:"d",who:"man",x:"작년 봄에 발견됐어요. 폐암이요. 일 년 넘게 버티셨는데."},{t:"p",x:"할머니는 줄기를 조심스럽게 잘랐다. 국화는 줄기 끝을 사선으로 잘라야 물을 잘 먹는다. 살아 있는 꽃이든 바칠 꽃이든, 자르는 방법은 같다."}]},{no:"03",title:"패랭이꽃",blocks:[{t:"p",x:"남자는 가게 안을 천천히 둘러봤다. 화분들, 드라이플라워, 구석의 낡은 목재 선반 위에 놓인 작은 화기들."},{t:"d",who:"man",x:"오래 하셨어요, 여기?"},{t:"d",who:"gm",x:"서른세 해."},{t:"d",who:"man",x:"그럼 이 동네에서 제일 오래된 가게겠네요."},{t:"d",who:"gm",x:"그렇겠죠. 은행도 미용실도 다 바뀌었으니까."},{t:"p",x:"남자가 카운터 모서리에 살짝 기댔다. 재킷이 바닥에 닿을 뻔해 얼른 걸쳐 올렸다."},{t:"d",who:"man",x:"아버지가 꽃을 좋아하셨어요. 베란다에 항상 뭔가 심어두셨거든요. 저는 출퇴근하면서 맨날 그 옆을 지나쳤는데, 한 번도 이름을 물어본 적이 없어요."},{t:"p",x:"할머니가 손을 잠깐 멈췄다가 다시 움직였다."},{t:"d",who:"gm",x:"베란다 꽃이 뭔지 알아요, 지금?"},{t:"d",who:"man",x:"패랭이꽃이에요. 오늘 아침에 병원에서 돌아오다가 아파트 앞에서 봤어요. 활짝 피어 있더라고요. 그때서야 처음 이름이 궁금해서 찾아봤어요."},{t:"d",who:"gm",x:"패랭이는 여름 내내 피어요. 그것도 모르고 계셨겠네."},{t:"beat",x:"남자가 웃으려고 했다가 그러지 못했다."},{t:"p",x:"할머니는 국화를 열 송이 골라 한지를 폈다. 꽃들을 나란히 놓고 한지로 감싸기 시작했다."},{t:"d",who:"gm",x:"자식이 몇이에요?"},{t:"d",who:"man",x:"저 혼자예요. 어머니는 제가 중학교 때 돌아가셨고. 그 뒤로 아버지랑 둘이 살았어요."},{t:"d",who:"gm",x:"이십 년 가까이."},{t:"d",who:"man",x:"네."},{t:"p",x:"할머니가 한지를 접었다. 손끝에서 종이 소리가 작게 났다."}]},{no:"04",title:"밥 두 그릇",blocks:[{t:"d",who:"gm",x:"장례는 어디서 해요?"},{t:"d",who:"man",x:"성모병원 장례식장이요. 형제가 없으니까 크게 하기도 뭐해서. 친척들한테 연락은 드렸는데."},{t:"d",who:"man",x:"사실 아직 실감이 안 나요. 병원에서 서류 쓰고, 장례사 분이랑 얘기하고, 그 사이에 뭔가를 계속 결정하고 있는데, 그게 다 저랑 상관없는 일 같아요. 남 일 같고."},{t:"d",who:"gm",x:"그럴 거예요."},{t:"d",who:"man",x:"할머니도 그런 적 있으세요?"},{t:"p",x:"할머니는 리본을 꺼냈다. 흰 리본을 적당한 길이로 잘라 매듭을 묶으면서 말했다."},{t:"d",who:"gm",x:"남편 보냈을 때. 스물여섯 해 전이에요."},{t:"p",x:"남자가 조용히 고개를 끄덕였다."},{t:"d",who:"man",x:"그때 실감이 안 났어요?"},{t:"d",who:"gm",x:"아침에 밥을 차렸어요."},{t:"d",who:"man",x:"네?"},{t:"d",who:"gm",x:"남편 몫까지. 새벽에 일어나서 습관적으로 밥을 두 그릇 차렸어요. 상을 다 차려놓고 나서야 보이는 거예요. 저 쪽에 빈 자리가. 그때서야 울었어요. 그 전까지는 눈물도 안 나왔어요."},{t:"p",x:"남자가 천천히 눈을 내리깔았다."},{t:"d",who:"man",x:"오늘 아침에 비슷한 게 있었어요. 냉장고를 열었는데 아버지가 즐겨 드시던 식혜가 있는 거예요. 어제 제가 사다 놓은 거. 병실에 갖다드리려고. 근데 이제 필요가 없어진 거잖아요. 그냥 냉장고 문을 닫았어요. 버리지도 못하고."},{t:"d",who:"gm",x:"그 식혜, 나중에 드세요."},{t:"p",x:"남자가 할머니를 봤다."},{t:"d",who:"gm",x:"버리지 말고요. 한동안 두었다가, 생각날 때 꺼내서 드세요. 많이 달아도 그냥 드세요. 그 단맛에 뭔가 있을 거예요."},{t:"p",x:"남자는 한동안 아무 말도 하지 않았다. 할머니는 꽃다발을 카운터 위에 올려놓았다. 흰 국화 열 송이가 한지와 흰 리본 안에 얌전히 묶여 있었다. 꽃잎 끝이 가지런했다."},{t:"d",who:"man",x:"얼마예요?"},{t:"d",who:"gm",x:"이만 원이에요."},{t:"p",x:"남자가 지갑을 꺼냈다. 카드를 내밀려다 잠깐 멈추더니 지폐를 찾았다. 이만 원을 카운터에 올렸다. 할머니는 꽃다발을 건넸다."},{t:"p",x:"남자가 두 손으로 꽃을 받아 들었다. 향기가 그의 쪽으로 번졌다. 남자는 꽃을 내려다봤다. 오래, 가만히."},{t:"d",who:"man",x:"감사합니다."},{t:"d",who:"gm",x:"잘 다녀와요."}]},{no:"05",title:"골목 모퉁이",blocks:[{t:"p",x:"남자가 문을 열고 나갔다. 유리문이 닫히면서 저녁 공기가 잠깐 들어왔다가 사라졌다. 할머니는 카운터에 기댄 채로 남자가 걸어가는 뒷모습을 봤다. 꽃다발을 오른손에 들고, 재킷을 왼팔에 걸치고, 골목을 따라 조금씩 작아지는 뒷모습."},{t:"beat",x:"골목 모퉁이를 돌기 직전에 남자가 멈췄다."},{t:"p",x:"걸음을 멈추고 고개를 약간 숙였다. 어깨가 한 번 가늘게 떨렸다. 오직 그것뿐이었다. 남자는 다시 걷기 시작해서 모퉁이를 돌아 사라졌다."},{t:"p",x:"할머니는 창가에 한동안 서 있었다."},{t:"p",x:"서른세 해 동안 이 자리에 있으면서 흰 국화를 얼마나 팔았을까. 수백 번은 될 것이다. 처음에는 동네 어르신들이 찾아왔고, 세월이 지나면서 그 어르신들의 자식들이 찾아왔다. 그 자식들이 이제 중년이 되어, 또 자기 부모의 꽃을 사러 온다. 그렇게 돌고 도는 것이었다."},{t:"p",x:"할머니는 가게 안을 마무리하기 시작했다. 시든 꽃을 골라내고, 분무기로 잎사귀를 닦고, 냉장고 온도를 확인하고, 작업대를 닦았다. 불을 끄고 문을 잠갔다. 셔터를 내렸다."},{t:"p",x:"가게 앞 화분들을 안쪽으로 들여놓으면서 할머니는 생각했다. 오늘 그 남자가 아버지 앞에 꽃을 놓을 것이다. 흰 국화가 영정 앞에 놓일 것이다. 남자는 밤새 거기 앉아 있을 것이고, 아침이 오면 많이 지쳐 있을 것이다. 그리고 집에 돌아가면 냉장고에 식혜가 있을 것이다."},{t:"p",x:"마지막 화분을 들여놓고 할머니는 허리를 폈다."},{t:"p",x:"봄 저녁 바람이 한 번 불었다. 아직 춥지 않지만 따뜻하지도 않은, 어중간하고 조용한 바람이었다. 꽃잎들이 조금 흔들렸다."}]},{no:"06",title:"보통의 날들",blocks:[{t:"p",x:"집으로 돌아가는 길에 할머니는 슈퍼마켓에 들렀다. 별 생각 없이 들어갔다가 음료수 냉장고 앞에 섰다. 유리문 안에 식혜가 있었다. 하얀 밥알이 둥둥 떠 있는 식혜."},{t:"p",x:"할머니는 한 병을 꺼냈다."},{t:"p",x:"계산대 아주머니가 물었다."},{t:"d",who:"etc",x:"오늘 하루 어떠셨어요?"},{t:"p",x:"할머니가 잠깐 생각했다."},{t:"d",who:"gm",x:"그냥 보통이었죠. 뭐."},{t:"p",x:"지갑을 열면서 할머니는 생각했다. 거짓말은 아니었다. 서른세 해 동안 이런 저녁이 수백 번은 있었으니까. 보통이라는 말이 맞기도 했고, 틀리기도 했다. 보통의 날들이 쌓여서 사람이 되는 것이니까."},{t:"p",x:"집까지 골목 두 개를 걸어가면서 할머니는 뚜껑을 열어 한 모금 마셨다. 달았다. 서늘하고, 달고, 조금 비릿한 맛. 식혜는 늘 이 맛이었다."},{t:"p",x:"남편이 좋아했다. 여름에 냉장고에서 꺼낸 식혜를 벌컥벌컥 마시던 사람. 밥알까지 다 먹고 빈 컵을 내밀던 사람. 서른여섯에 갔다."},{t:"p",x:"할머니는 걸으면서 조금씩 마셨다. 집 앞에 도착했을 때 반쯤 남아 있었다. 대문 열쇠를 꺼내는데 바람이 한 번 불었다. 할머니는 바람이 오는 쪽으로 얼굴을 들었다."},{t:"p",x:"국화 냄새는 없었다. 그냥 봄 저녁 바람이었다. 어딘가에서 밥 짓는 냄새가 났다. 멀리서 아이 우는 소리가 들렸다가 그쳤다."},{t:"p",x:"할머니는 대문을 열고 들어갔다."},{t:"p",x:"부엌에 불을 켜고 남은 식혜를 냉장고에 넣었다. 저녁을 차리기 전에 잠깐 식탁 앞에 앉았다. 식탁은 두 자리짜리였지만 한쪽에만 자국이 있었다. 오래, 한쪽에서만 밥을 먹어서 생긴 자국이었다."},{t:"p",x:"할머니는 자리에서 일어나 냄비를 꺼냈다."},{t:"p",x:"봄밤은 고요했다. 냄비에서 물이 끓는 소리만 작게 났다. 창밖에서 바람이 가끔 불었고, 그때마다 베란다 창이 작게 덜컹거렸다. 오래된 집이었다. 오래된 집은 바람이 불면 소리가 났다."},{t:"beat",x:"그 소리도 이제는 익숙한 소리였다."}]}],HA="「흰 국화」는 상실과 그 첫날을 다룬 이야기입니다. 거창한 위로 없이, 식혜 한 병과 꽃 열 송이로, 슬픔이 어떻게 사람과 사람 사이를 잠깐 열어 놓는지를 써보았습니다.",qA={id:"mensuration",title:"계량",subtitle:"숫자로 남는 하루들",kicker:"단편소설",tagline:"매달 이십일이 가까워지면 최은숙은 무릎에 파스를 붙이고 운동화 끈을 다시 묶었다.",minutes:12},rA=[{no:"01",title:"이십일",blocks:[{t:"p",x:"매달 이십일이 가까워지면 최은숙은 무릎에 파스를 붙이고 운동화 끈을 다시 묶었다. 가방에는 단말기와 새 수첩이 들어 있었다. 이십일부터 닷새는 도시 서쪽 일대의 검침 차례였다."},{t:"p",x:"은숙이 맡은 구역은 오래된 주택가와 소규모 연립이 뒤섞여 있었다. 검침과 고지서 송달, 반기마다 도는 안전점검까지 합치면 한 달에 삼천 가구가 넘었다. 하루에 백오십에서 이백 가구를 읽어야 겨우 날짜가 맞았다. 그 가운데 이 연립단지—열 개 동, 이백여 가구—는 십이 년째 은숙이 맡아 온 자리였다. 이틀에 걸쳐 나눠 도는 것이 오랜 습관이었다."},{t:"p",x:"계량기는 현관 옆 외벽에 박혀 있거나 복도 계량기함에 나란히 놓여 있었다. 뚜껑을 열면 검은 바탕 위 흰 숫자 다섯 자리와 ㎥ 표시, 소수점을 가리키는 붉은 바늘이 나타났다. 은숙은 지침을 읽고 단말기에 입력했다. 공동현관이 잠긴 동, 개를 풀어놓은 집에서는 시간이 늘어졌다. 오히려 사람이 없는 집이 편했다. 고지서를 문에 끼우고 계단을 오르내리다 보면 점심은 어느 벤치에서 삼각김밥으로 때웠다. 무릎이 시큰거릴 때마다 파스 냄새를 맡으며 잠시 눈을 감았다."},{t:"p",x:"수첩은 한 달에 한 권이었다. 표지에 연도와 월을 적고, 앞장부터 가구 번호와 누적 지침, 월 사용량을 적었다. 맨 뒷장은 늘 자기 집 몫이었다. 오 년마다 계량기가 새것으로 바뀌어 다섯 자리가 0으로 돌아갈 때에도, 은숙은 이전 숫자 옆에 새 숫자를 나란히 적었다. 숫자 옆에는 은숙만의 작은 기호를 붙였다. 위 화살표는 늘어남, 아래는 줄어듦, 점은 변화 없음, 물결은 들쭉날쭉함, 동그라미는 끊김. 혼자 만들어 혼자만 쓰는 표기였다."},{t:"p",x:"103호에는 겨울마다 위 화살표가 빽빽했다. 아이가 셋인 집이었다. 205호는 해마다 삼월이면 아래로 꺾였다가 사월에 다시 올라왔다. 어디론가 다녀오는 주기 같았다. 502호는 봄가을에 물결이 잦았다—혼자 사는 젊은 남자였는데, 요리를 배우다 그만두기를 반복하는 듯했다. 왜 그런 곡선이 그려지는지 묻는 사람은 없었다. 은숙도 묻지 않았다. 계량기 앞에서 하는 일은 읽고 계산한 뒤 다음 집으로 가는 것뿐이었다. 그래도 수첩을 덮을 때면 기호들이 잠시 눈에 남았다. 누군가의 하루가 숫자가 되고, 그 숫자가 다시 손끝에서 기호가 되었다."}]},{no:"02",title:"401호",blocks:[{t:"p",x:"1동에서 시작해 10동에서 끝나는 동선은 자연스러웠다. 10동은 단지 안쪽 끝에 있었고 엘리베이터가 없었다. 401호는 그 4층이었다. 은숙은 그 집을 늘 하루의 끝에 남겨 두었다."},{t:"p",x:"처음 이 구역을 맡던 겨울, 계량기함 앞에 화분이 놓여 있었다. 문이 열리고 김옥자 노부인이 나와 말없이 화분을 안아 옮겼다. 그러고는 함 뚜껑을 손바닥으로 한 번 눌러 보이고 들어갔다. 굵고 따뜻해 보이는 손이었다. 그 무렵 은숙의 남편은 병원에서 돌아오지 못했고, 아들은 말수가 부쩍 줄어 있었다. 낯선 집 앞에서 목례를 받아 든 그날, 은숙은 계단을 내려오며 오래 울지 않던 코끝이 시큰해지는 걸 느꼈다."},{t:"p",x:"그 뒤로 눈이 마주치면 목례를 나누었다. 안전점검 때도 옥자는 문 앞에 서 있었고, 은숙은 밸브와 연소기 주변만 확인하고 돌아섰다. 옥자의 남편은 거의 얼굴을 비치지 않았다. 가끔 기침 소리가 문틈으로 새어 나왔다. 노부부의 겨울 사용량은 100 안팎, 여름은 15 안팎이었다. 은숙은 그 집 옆에 자주 점을 찍었다. 변화 없음, 고요한 규칙이었다."},{t:"p",x:"오 년 전 겨울이 시작되던 달, 401호가 47로 떨어졌다. 전월의 절반이었다. 지침을 두 번 확인하고 계산을 다시 했다. 고장은 아니었다. 숫자는 여전히 올라가고 있었고, 속도만 느려졌다. 은숙은 아래 화살표를 그리고 물음표를 붙였다. 물음표는 정해진 기호가 아니었다. 숫자가 설명되지 않을 때만 드물게 쓰는 표시였다."},{t:"p",x:"그 겨울 401호 문고리에는 병원 봉투가 걸린 날이 있었다. 겨울이 끝나갈 무렵, 10동 현관에 부고가 붙었다. 401호 김옥자 남편상. 그날 은숙은 수첩의 물음표에 조용히 줄을 그었다. 답을 알아서가 아니라, 더 묻지 않기로 해서였다."},{t:"p",x:"그 후 401호는 40에서 32로, 다시 28까지 천천히 내려갔다. 혼자 남은 사람의 겨울은 그 정도의 숫자로 지나갔을 것이다. 보일러를 아끼고, 국물을 자주 데우지 않고, 목욕을 서둘러 끝내는 하루들. 은숙은 매달 계량기 앞에서 짐작만 했다. 자신의 집도 비슷했으니까. 남편이 떠난 뒤 겨울 사용량이 78까지 내려갔고, 아들이 원룸으로 나간 뒤에는 42 언저리에 머물렀다. 수첩 뒷장의 아래 화살표들을 손가락으로 쓸어볼 때마다 은숙은 잠시 숨을 골랐다. 옥자의 이십팔과 자신의 사십이는, 어쩌면 다른 방식으로 같은 계절을 나는 두 사람의 온도였다."}]},{no:"03",title:"다시 데워지는 집",blocks:[{t:"p",x:"이 년 전 여름 끝, 401호가 85로 뛰었다. 전월은 25였다. 다시 읽고 다시 계산해도 틀림없었다. 위 화살표와 물음표."},{t:"p",x:"다음 달 90, 그다음 달 95, 겨울에는 130. 노부부가 살던 때보다 많았다. 계단을 오르다 보니 현관에 신발이 늘어 있었다. 분홍색 벨크로 운동화 한 켤레, 아이 신발이었다. 문 가까이 서자 텔레비전 소리와 아이 울음이 새어 나왔고, 그 사이로 옥자의 목소리가 끊겨 들렸다."},{t:"d",x:"먹어야지."},{t:"p",x:"은숙은 볼펜을 잠깐 멈추었다. 자신의 아들이 어렸을 때, 퇴근하고 돌아와 문을 열면 들리던 소리와 닮아 있었다. 옥자에게 무슨 사정이 있어 아이가 왔는지 은숙은 알지 못했다. 다만 조용하던 집이 다시 데워지고 있다는 것만은 계량기가 알려주었다. 그달 은숙은 동그라미를 그렸다. 원래는 끊김을 뜻하는 기호였지만, 그날만은 오래 이어지던 고요함이 끊겼다는 뜻으로 남겨 두었다. 물음표에는 줄을 그었다."},{t:"p",x:"그해 겨울, 오랜만에 은숙의 집도 42를 넘겼다. 아들이 며칠 다녀간 달이었다. 뒷장에는 그 기록이 남아 있었다. 늘어난 숫자 옆의 작은 위 화살표가, 은숙에게는 그해의 유일한 기념일 같았다."}]},{no:"04",title:"원격 전송",blocks:[{t:"p",x:"봄이 오기 전, 회사 문자가 왔다. 다음 달부터 이 단지가 포함된 시범 구역에 원격 전송 장치를 부착한다는 내용이었다. 기존 계량기에 붙어 하루 한 번 지침을 자동으로 보내는 방식이었다. 이상 감지 기능은 다음 단계로 미뤄졌다고 했다. 검침원에게는 고장 신고와 밸브 점검용 화면이 남는다고 했다. 끝에는 그간 수고하셨다는 인사가 있었다."},{t:"p",x:"은숙은 문장을 두 번 읽었다. 단말기를 쥔 엄지에서 잠시 힘이 빠졌다. 뚜껑을 여는 손끝의 감촉, 붉은 바늘을 마주 볼 때의 짧은 정지, 볼펜을 대고 기호를 그리는 리듬이 한꺼번에 멀어지는 기분이었다. 서버는 숫자만 받아 갈 것이다. 화살표도, 점도, 물음표도 받지 않을 것이다. 그래도 다음 달 수첩은 이미 사 두었다. 오래된 습관이었다."}]},{no:"05",title:"사용량 0",blocks:[{t:"p",x:"닷새째 되는 날, 10동 계단을 올랐다. 무릎이 유난히 욱신거렸다. 401호 앞에 분홍색 운동화가 없었다. 문틈으로 불빛도 새지 않았다."},{t:"p",x:"계량기 뚜껑을 열었다. 04891, 전월과 똑같은 숫자였다. 사용량 0. 붉은 바늘이 멈춰 있었다. 한 달 동안 가스가 한 번도 흐르지 않았다는 뜻이었다. 은숙은 업무 조회 화면을 열어 401호를 찾아보았다. 전출 접수도, 중지 신청도 아직 보이지 않았다. 계약은 그대로 열려 있었다."},{t:"p",x:"수첩에 04891과 0을 적고 동그라미를 그렸다. 이번에는 뜻 그대로, 정말 끊김이었다. 그 옆에 다시 물음표를 붙였다."},{t:"p",x:"내려오는 길에 관리실에 들렀다. 소장이 선풍기 앞에서 텔레비전을 보고 있었다."},{t:"d",x:"401호요, 김옥자 씨."},{t:"d",x:"아, 지난달 초쯤이었나. 아들이 와서 짐 정리하고 갔어요. 요양병원으로 모신다고."},{t:"d",x:"옥자 씨는요?"},{t:"d",x:"병원에 계시죠. 아이는… 아들이 데리고 갔다고 들었어요."},{t:"d",x:"가스는요, 신청은."},{t:"d",x:"글쎄, 급하게 모셔가느라 뒷정리는 아직인 것 같더라고. 조만간 오겠다고는 했는데."},{t:"p",x:"은숙은 고개를 끄덕였다. 돌아서려다 멈췄다."},{t:"d",x:"어느 병원인지 아세요?"},{t:"p",x:"소장이 그제야 은숙을 똑바로 보았다."},{t:"d",x:"모르겠는데요. 왜요, 무슨 일 있습니까?"},{t:"d",x:"아니요, 그냥…."},{t:"p",x:"관리실을 나온 은숙은 몇 걸음 걷다가 멈춰 섰다가, 다시 걸었다. 지난달 초에 밸브가 잠기고, 그 뒤로 한 달 동안 아무도 불을 켜지 않은 집. 아들이 아직 정리하지 못한 계약 하나가 계량기 안에 04891로 남아 있었다. 은숙은 더 묻지 않기로 했다."},{t:"p",x:"10동 앞 벤치에 앉아 이번 달 수첩을 펼쳤다. 401호의 동그라미 옆 물음표를 손가락으로 한 번 눌렀다. 지나간 수첩들이 서랍 어딘가에 한 권씩 놓여 있을 것이었다. 십이 년치의 숫자와 기호. 누군가의 겨울과 여름이, 누군가의 떠남과 남음이 그 사이에 접혀 있었다. 은숙은 볼펜을 들었다가 내려놓았다."}]},{no:"06",title:"된장국",blocks:[{t:"p",x:"집으로 가는 길에 두부 한 모를 샀다. 냉장고에는 며칠째 데워 먹는 된장국이 남아 있었다."},{t:"p",x:"현관에서 자기 집 계량기를 열었다. 07623. 지난달은 4, 이번 달은 5였다. 은숙은 웃음 비슷한 숨을 내쉬고, 수첩 맨 뒷장에 07623과 5를 적고 위 화살표를 그렸다."},{t:"p",x:"국을 불에 올리고 두부를 썰어 넣었다. 불꽃이 파랗게 피어올랐다. 국이 데워지는 동안 401호 옆의 동그라미와 물음표를 오랫동안 바라보았다. 줄을 긋는 대신 그 아래에 작게 적었다."},{t:"beat",x:"요양병원."},{t:"p",x:"다음 달이면 401호 계량기에도 전송 장치가 붙을 것이다. 하루에 한 번, 04891이 서버로 갈 것이다. 04891, 04891, 04891. 어느 날 아들이 계약을 정리하러 오면 그 숫자마저 조용히 닫힐 것이다. 그때까지는 아직 남아 있는 숫자였다."},{t:"p",x:"은숙은 다음 달에도 수첩을 사기로 했다. 서버가 받지 않는 것들을 받아 적기 위해서였다."},{t:"p",x:"국이 끓어올랐다. 불을 줄이고 맨 뒷장을 다시 폈다. 07623, 5, 위 화살표. 그 아래 여백에 볼펜을 대었다."},{t:"beat",x:"된장국."},{t:"p",x:"은숙은 볼펜 뚜껑을 닫고 국그릇을 꺼냈다. 5는 작은 숫자였지만, 0은 아니었다. 가스가 흐르고, 불이 붙고, 국이 끓는 하루. 창밖의 저녁이 천천히 어두워지는 동안, 은숙은 국을 그릇에 옮겨 담았다."}]}],dA="「계량」은 숫자로만 남은 삶의 온도를 따라가는 이야기입니다. 서버가 받지 않는 기호들—화살표와 점과 물음표—이 사람 사이를 어떻게 조용히 잇는지를 써보았습니다.";function sA(){const{route:m,go:Y}=AA();return Vl.useEffect(()=>{m==="home"&&(document.title="짧은 이야기 — 단편소설")},[m]),m==="mensuration"?k.jsx(kb,{meta:qA,sections:rA,note:dA,variant:"mensuration",onHome:()=>Y("home")}):m==="chrysanthemum"?k.jsx(kb,{meta:SA,sections:yA,note:HA,variant:"chrysanthemum",onHome:()=>Y("home")}):k.jsx(cA,{onOpen:P=>Y(P)})}nA.createRoot(document.getElementById("root")).render(k.jsx(Vl.StrictMode,{children:k.jsx(sA,{})}));</script>

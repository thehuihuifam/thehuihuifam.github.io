<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이니 워리어 러시 v2.0</title>
<style>
  :root {
    --bg-deep:      #08080d;
    --bg-primary:   #0d0d12;
    --bg-panel:     #14141f;
    --bg-panel-2:   #1a1a24;
    --bg-inset:     #0a0a12;
    --text-primary: #e8e8ee;
    --text-muted:   #8888a0;
    --text-dim:     #55556a;
    --gold:         #ffcc00;
    --gold-deep:    #a66800;
    --blue:         #4a90e2;
    --blue-deep:    #1a4a8a;
    --red:          #ff3366;
    --red-deep:     #8a1a34;
    --green:        #00ff66;
    --green-deep:   #00883a;
    --border-subtle: #2a2a3a;
    --border-strong: #3a3a4a;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-pill: 999px;
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.05);
    --shadow-drop:  0 4px 12px rgba(0,0,0,0.5);
    --glow-gold:    0 0 24px rgba(255,204,0,0.6);
    --glow-blue:    0 0 16px rgba(74,144,226,0.5);
    --glow-red:     0 0 20px rgba(255,51,102,0.7);
    --glow-green:   0 0 20px rgba(0,255,102,0.6);
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', Roboto, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  button, .card, .slot, .deploy-btn { user-select: none; -webkit-user-select: none; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 100vh;
    position: relative;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  h1 {
    font-size: 15px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 3px;
    font-weight: 900;
    text-shadow: 0 0 12px rgba(255,204,0,0.6), 0 0 24px rgba(255,204,0,0.3);
    flex: 1;
  }

  #btn-sound-toggle {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-panel-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-sm);
    min-width: 44px;
    min-height: 44px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #btn-sound-toggle:active { transform: translateY(-50%) scale(0.94); }

  .castle-panel {
    background: linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 10px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .castle-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0px, transparent 8px, rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 9px);
    pointer-events: none;
  }
  .castle-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    flex-direction: column;
    gap: 2px;
  }
  .castle-emoji {
    font-size: 32px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    transition: filter 0.3s;
  }
  .castle-emoji.warn {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) drop-shadow(0 0 6px var(--gold));
    animation: castleShake 0.4s infinite;
  }
  .castle-emoji.danger {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) drop-shadow(0 0 8px var(--red));
    animation: castleShake 0.3s infinite;
  }
  @keyframes castleShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-1.5px) rotate(-2deg); }
    75% { transform: translateX(1.5px) rotate(2deg); }
  }
  .castle-status-label {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.5px;
    min-height: 11px;
    text-align: center;
  }
  .castle-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  .castle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .castle-row .wave-tag {
    color: var(--gold);
    font-weight: 800;
    font-size: 13px;
    font-family: var(--font-mono);
    letter-spacing: 1px;
  }
  .castle-row .gold-tag {
    color: var(--gold);
    font-weight: 800;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .hp-bar {
    width: 100%;
    height: 18px;
    background: var(--bg-inset);
    border-radius: var(--r-sm);
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-inset);
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ff66 0%, #88ff66 50%, #00ff66 100%);
    transition: width 0.4s cubic-bezier(0.34, 1.2, 0.64, 1), background 0.3s ease;
    border-radius: 7px;
    box-shadow: inset 0 0 8px rgba(0,255,102,0.5);
  }
  .hp-fill.warn {
    background: linear-gradient(90deg, #ffcc00, #ff9900);
    box-shadow: inset 0 0 8px rgba(255,204,0,0.5);
  }
  .hp-fill.danger {
    background: linear-gradient(90deg, #ff3366, #ff0044);
    box-shadow: inset 0 0 12px rgba(255,51,102,0.7);
    animation: pulseRed 0.6s infinite alternate;
  }
  .hp-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: var(--bg-deep);
    text-shadow: 0 0 4px rgba(255,255,255,0.7);
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
  }
  @keyframes pulseRed {
    from { box-shadow: inset 0 0 0 0 rgba(255,51,102,0); }
    to   { box-shadow: inset 0 0 14px 2px rgba(255,51,102,0.8); }
  }

  #status-hint {
    background: var(--bg-panel-2);
    border: 1px dashed var(--border-strong);
    border-radius: var(--r-sm);
    padding: 8px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.5px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.25s, border-color 0.25s, background 0.25s;
  }
  #status-hint.deploy { color: var(--blue); border-color: var(--blue); background: rgba(74,144,226,0.08); }
  #status-hint.shop { color: var(--gold); border-color: var(--gold); background: rgba(255,204,0,0.08); }
  #status-hint.end { color: var(--red); border-color: var(--red); background: rgba(255,51,102,0.08); }

  .battlefield {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--bg-inset);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    padding: 10px 8px;
    min-height: 112px;
  }
  .slot {
    background: var(--bg-panel);
    border: 2px dashed var(--border-subtle);
    border-radius: var(--r-md);
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .slot.shop-target {
    cursor: pointer;
    border-color: var(--gold) !important;
    box-shadow: var(--glow-gold);
    animation: shopPulse 0.8s infinite alternate;
  }
  @keyframes shopPulse {
    from { box-shadow: 0 0 12px rgba(255,204,0,0.5); }
    to   { box-shadow: 0 0 24px rgba(255,204,0,0.9); }
  }
  .slot .slot-icon {
    position: absolute;
    font-size: 54px;
    opacity: 0.08;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }
  .slot.empty::after {
    content: '빈 슬롯';
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: 700;
    position: relative;
    z-index: 1;
  }
  .slot .slot-pos {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 9px;
    color: var(--blue);
    letter-spacing: 0.8px;
    font-weight: 900;
    z-index: 2;
  }
  .slot .slot-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
    z-index: 1;
  }
  .slot.filled {
    border-style: solid;
    border-color: var(--blue);
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: var(--glow-blue);
  }
  .slot.deploy-anim { animation: slotDeploy 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes slotDeploy {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); box-shadow: 0 0 28px rgba(74,144,226,0.9); }
    100% { transform: scale(1); }
  }
  .slot.hit-anim { animation: slotHit 0.18s ease; }
  @keyframes slotHit {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .slot.damage-anim { animation: slotDamage 0.3s ease; }
  @keyframes slotDamage {
    0%, 100% { transform: scale(1); filter: none; }
    50% { transform: scale(0.94); filter: brightness(1.6) hue-rotate(-30deg); }
  }
  .warrior-emoji {
    font-size: 28px;
    filter: drop-shadow(0 0 6px rgba(74,144,226,0.8));
    position: relative;
    z-index: 1;
  }
  .warrior-name {
    font-size: 10px;
    font-weight: 800;
    color: #a8cfff;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
  }
  .warrior-stats {
    font-size: 9px;
    color: #88a8cc;
    font-family: var(--font-mono);
    font-weight: 700;
    position: relative;
    z-index: 1;
  }

  .enemy-preview {
    background: linear-gradient(180deg, #1a0f14 0%, #10080c 100%);
    border: 1px solid var(--red-deep);
    border-radius: var(--r-sm);
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .enemy-preview .label { color: #ff6688; letter-spacing: 0.8px; font-weight: 800; font-size: 10px; }
  .enemy-preview .count { color: var(--red); font-weight: 900; font-family: var(--font-mono); font-size: 12px; }
  .enemy-preview .detail { color: #885566; font-size: 10px; font-family: var(--font-mono); font-weight: 700; }

  .cards-area {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    min-height: 128px;
  }
  .card {
    background: linear-gradient(160deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 2px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 20px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s, opacity 0.25s;
    min-height: 128px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .card-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; z-index: 1; }
  .card-banner {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: var(--bg-deep);
    background: var(--border-strong);
    border-radius: 10px 10px 0 0;
    z-index: 2;
  }
  .card.rarity-COMMON .card-banner { background: #4a4a5a; color: #c8c8d8; }
  .card.rarity-RARE   .card-banner { background: var(--blue); color: #0d1a2e; }
  .card.rarity-LEGEND .card-banner { background: var(--gold); color: #2a1a00; }

  .card.rarity-COMMON { border-color: var(--border-strong); }
  .card.rarity-RARE   { border-color: var(--blue); box-shadow: var(--glow-blue); }
  .card.rarity-LEGEND { border-color: var(--gold); box-shadow: var(--glow-gold); }

  .card-shine {
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,204,0,0.25) 40deg, transparent 80deg);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .card.rarity-LEGEND .card-shine { opacity: 1; animation: legendRotate 3s linear infinite; }
  @keyframes legendRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .card.placeholder {
    cursor: default;
    background: var(--bg-panel);
    border-style: dashed;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 700;
    padding: 10px 4px;
  }
  .card.placeholder .card-banner { display: none; }

  .card:not(.placeholder):active { transform: scale(0.94); }

  .card.appear { animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
  .card.appear:nth-child(2) { animation-delay: 0.09s; }
  .card.appear:nth-child(3) { animation-delay: 0.18s; }
  .card.appear:nth-child(4) { animation-delay: 0.27s; }
  @keyframes cardIn {
    from { transform: translateY(-24px) scale(0.85); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(255,204,0,0.9), 0 0 48px rgba(255,204,0,0.4);
    transform: scale(1.05) rotateZ(-1deg);
  }
  .card.locked { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }
  .card.fade-out { opacity: 0; transform: scale(0.85); pointer-events: none; }
  .card-emoji { font-size: 28px; }
  .card-name { font-size: 11px; font-weight: 800; color: var(--text-primary); letter-spacing: 0.5px; }
  .card-desc { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 700; }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  .deploy-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .deploy-btn {
    min-height: 48px;
    background: var(--bg-panel);
    border: 2px solid var(--border-subtle);
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .deploy-btn:not(:disabled):active { transform: scale(0.94); }
  .deploy-btn:not(:disabled) {
    border-color: var(--blue);
    color: #a8cfff;
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: var(--glow-blue);
  }
  .deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .deploy-btn .plus { font-size: 16px; display: block; line-height: 1; margin-bottom: 2px; }

  #btn-draw-card {
    min-height: 56px;
    background: linear-gradient(135deg, var(--gold) 0%, #ff9900 100%);
    border: none;
    border-radius: var(--r-md);
    color: var(--bg-deep);
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2.5px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-deep), var(--glow-gold);
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }
  #btn-draw-card::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shine 2.5s infinite;
  }
  @keyframes shine {
    0% { left: -60%; }
    60%, 100% { left: 120%; }
  }
  #btn-draw-card:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), var(--glow-gold); }
  #btn-draw-card:disabled { background: var(--border-subtle); color: var(--text-dim); box-shadow: none; cursor: not-allowed; }
  #btn-draw-card:disabled::after { display: none; }

  #btn-discard {
    min-height: 40px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  #btn-discard:not(:disabled) { color: #ff8899; border-color: var(--red-deep); }
  #btn-discard:disabled { opacity: 0.35; cursor: not-allowed; }

  .shop-panel {
    background: var(--bg-panel-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-sm);
    padding: 0;
    overflow: hidden;
  }
  .shop-panel summary {
    list-style: none;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .shop-panel summary::-webkit-details-marker { display: none; }
  .shop-panel summary::after { content: '▼'; font-size: 10px; transition: transform 0.2s; }
  .shop-panel[open] summary::after { transform: rotate(180deg); }
  .shop-panel .shop-body {
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px solid var(--border-subtle);
  }
  .shop-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .shop-btn {
    min-height: 52px;
    background: var(--bg-panel);
    border: 2px solid var(--border-strong);
    border-radius: var(--r-sm);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    line-height: 1.2;
    transition: all 0.15s;
  }
  .shop-btn:not(:disabled):active { transform: scale(0.94); }
  .shop-btn:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .shop-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .shop-btn .price { font-family: var(--font-mono); font-size: 10px; color: var(--gold); }

  #game-output {
    background: var(--bg-inset);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    height: 130px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
    user-select: text;
    -webkit-user-select: text;
  }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line:last-child { color: var(--gold); }
  .log-line.highlight { color: var(--green); font-weight: 700; }
  .log-line.danger { color: var(--red); font-weight: 700; }
  .log-line.combat { animation: logIn 0.3s ease backwards; }
  @keyframes logIn {
    from { transform: translateX(-6px); opacity: 0.3; }
    to { transform: translateX(0); opacity: 1; }
  }

  #flash {
    position: fixed;
    inset: 0;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.15s;
  }
  #flash.active { opacity: 0.45; }
  #flash.victory { background: var(--green); }
  #flash.danger { background: var(--red); }
  #flash.legend { background: var(--gold); opacity: 0.7; }

  .dmg-popup {
    position: fixed;
    font-size: 22px;
    font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 8px rgba(255,51,102,0.9), 2px 2px 0 #000;
    pointer-events: none;
    z-index: 1000;
    animation: dmgFloat 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    font-family: var(--font-mono);
  }
  .dmg-popup.gold { color: var(--gold); text-shadow: 0 0 8px rgba(255,204,0,0.9), 2px 2px 0 #000; }
  .dmg-popup.green { color: var(--green); text-shadow: 0 0 8px rgba(0,255,102,0.9), 2px 2px 0 #000; }
  @keyframes dmgFloat {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    25% { transform: translateY(-12px) scale(1.35); opacity: 1; }

<script>
(function () {
  'use strict';

  var MAX_WAVE = 5;

  var CARD_ATK = {

  };
  var CARD_HEAL = {
    id: 'HEAL', name: '성 회복', emoji: '💚', rarity: 'RARE', type: 'INSTANT',
    desc: '성 HP +5'
  };
  var CARD_HERO = {
    id: 'HERO', name: '전설의 용사', emoji: '👑', rarity: 'LEGEND', type: 'SUMMON',
    desc: 'HP50/ATK8',
    warrior: { name: '용사', emoji: '👑', hp: 50, maxHp: 50, atk: 8 }
  };

  /* ===== 웨이브 정의 ===== */
  function getWaveDef(waveNum) {
    if (waveNum === 1) return { enemies: [
      { type: '잡병', hp: 6, atk: 2 },
      { type: '잡병', hp: 6, atk: 2 }
    ], gold: 5 };
    if (waveNum === 2) return { enemies: [
      { type: '잡병', hp: 8, atk: 3 },
      { type: '잡병', hp: 8, atk: 3 },
      { type: '잡병', hp: 8, atk: 3 }
    ], gold: 5 };
    if (waveNum === 3) return { enemies: [
      { type: '잡병', hp: 10, atk: 3 },
      { type: '잡병', hp: 10, atk: 3 },
      { type: '잡병', hp: 10, atk: 3 },
      { type: '정예', hp: 20, atk: 5 }
    ], gold: 6 };
    if (waveNum === 4) return { enemies: [
      { type: '잡병', hp: 12, atk: 4 },
      { type: '잡병', hp: 12, atk: 4 },
      { type: '잡병', hp: 12, atk: 4 },
      { type: '정예', hp: 24, atk: 6 }
    ], gold: 6 };
    if (waveNum === 5) return { enemies: [
      { type: '잡병', hp: 14, atk: 4 },
      { type: '잡병', hp: 14, atk: 4 },
      { type: '잡병', hp: 14, atk: 4 },
      { type: '잡병', hp: 14, atk: 4 },
      { type: '정예', hp: 30, atk: 7 }
    ], gold: 7 };
    // 무한 모드 (wave >= 6)
    var over = waveNum - 5;
    var gruntHp = 14 + over * 2;
    var gruntAtk = 4 + Math.floor(over / 3);
    var eliteHp = 30 + over * 4;
    var eliteAtk = 7 + Math.floor(over / 2);
    var totalEnemies = Math.min(8, 5 + Math.floor(over / 2));
    var eliteCount = Math.max(1, Math.floor(totalEnemies * 0.2));
    var gruntCount = totalEnemies - eliteCount;
    var arr = [];
    var i;
    for (i = 0; i < gruntCount; i++) arr.push({ type: '잡병', hp: gruntHp, atk: gruntAtk });
    for (i = 0; i < eliteCount; i++) arr.push({ type: '정예', hp: eliteHp, atk: eliteAtk });
    return { enemies: arr, gold: 5 + Math.floor(over / 2) };
  }

  /* ===== 상태 ===== */
  window.gameState = {
    phase: 'DRAW',
    wave: 1,
    maxWave: MAX_WAVE,
    maxWaveReached: 1,

    warriors: [null, null, null],
    availableCards: [],
    selectedCard: null,
    lastActionStatus: 'IDLE',
    isGameOver: false,

  };

  /* ===== DOM 참조 ===== */
  var els = {
    app: document.getElementById('app'),
    statWave: document.getElementById('stat-wave'),
    statMaxWave: document.getElementById('stat-max-wave'),
    statGold: document.getElementById('stat-gold'),
    statCastleHp: document.getElementById('stat-castle-hp'),
    statCastleMaxHp: document.getElementById('stat-castle-max-hp'),
    castleHpFill: document.getElementById('castle-hp-fill'),
    castleEmoji: document.getElementById('castle-emoji'),
    castleStatusLabel: document.getElementById('castle-status-label'),
    enemyCount: document.getElementById('enemy-count'),
    enemyDetail: document.getElementById('enemy-detail'),
    cardsArea: document.getElementById('cards-area'),
    battlefield: document.getElementById('battlefield'),
    output: document.getElementById('game-output'),
    btnDraw: document.getElementById('btn-draw-card'),
    btnDiscard: document.getElementById('btn-discard'),
    btnContinue: document.getElementById('btn-continue'),
    btnRestart: document.getElementById('btn-restart'),
    btnSoundToggle: document.getElementById('btn-sound-toggle'),
    flash: document.getElementById('flash'),

    waveTransition: document.getElementById('wave-transition'),
    waveTransitionTitle: document.getElementById('wave-transition-title'),

    enemyRowOverlay: document.getElementById('enemy-row-overlay'),

    btnShopUpgrade: document.getElementById('btn-shop-upgrade'),
    btnShopRepair: document.getElementById('btn-shop-repair')
  };

  var btnDeploy = [
    document.getElementById('btn-deploy-0'),
    document.getElementById('btn-deploy-1'),
    document.getElementById('btn-deploy-2')
  ];

  var slotEls = [
    document.getElementById('slot-0'),
    document.getElementById('slot-1'),
    document.getElementById('slot-2')
  ];

  /* ===== 오디오 ===== */
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, type, duration, gain, freqEnd) {
    if (window.gameState.sfxMuted) return;
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      if (freqEnd !== undefined) osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
      g.gain.value = gain;
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* ignore */ }
  }

  function playClick() { tone(800, 'sine', 0.06, 0.05); }
  function playHit() { tone(200, 'square', 0.1, 0.06, 120); }
  function playGacha(rare) { tone(rare ? 800 : 400, 'sine', 0.3, 0.06, rare ? 1600 : 1200); }
  function playLegend() {
    tone(660, 'sine', 0.15, 0.08);
    setTimeout(function () { tone(880, 'sine', 0.15, 0.08); }, 120);
    setTimeout(function () { tone(1320, 'sine', 0.3, 0.1); }, 240);
  }
  function playVictory() {
    tone(523, 'sine', 0.1, 0.08);
    setTimeout(function () { tone(659, 'sine', 0.1, 0.08); }, 100);
    setTimeout(function () { tone(784, 'sine', 0.2, 0.08); }, 200);
  }
  function playDefeat() { tone(300, 'square', 0.4, 0.08, 100); }

  /* ===== 유틸 ===== */
  function log(text, cls) {
    var div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    els.output.appendChild(div);
    while (els.output.children.length > 200) els.output.removeChild(els.output.firstChild);
    els.output.scrollTop = els.output.scrollHeight;
    window.gameState.log.push(text);
    if (window.gameState.log.length > 500) window.gameState.log.shift();
  }

  function flash(color) {
    els.flash.className = '';
    void els.flash.offsetWidth;
    els.flash.classList.add('active');
    if (color === 'victory') els.flash.classList.add('victory');
    else if (color === 'danger') els.flash.classList.add('danger');
    else if (color === 'legend') els.flash.classList.add('legend');
    setTimeout(function () { els.flash.classList.remove('active'); }, 200);
  }

  function screenShake() {
    els.app.classList.remove('shake');
    void els.app.offsetWidth;
    els.app.classList.add('shake');
    setTimeout(function () { els.app.classList.remove('shake'); }, 320);
  }

  function popDamage(text, color, anchorEl) {
    var pop = document.createElement('div');
    pop.className = 'dmg-popup' + (color ? ' ' + color : '');
    pop.textContent = text;
    if (anchorEl) {
      var rect = anchorEl.getBoundingClientRect();
      pop.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      pop.style.top = (rect.top + rect.height / 2 - 10) + 'px';
    } else {
      pop.style.left = (window.innerWidth / 2 - 20) + 'px';
      pop.style.top = (window.innerHeight / 2 - 10) + 'px';
    }
    document.body.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 950);
  }

  function burstParticles(anchorEl, color, count) {
    if (!anchorEl) return;
    count = count || 8;
    var rect = anchorEl.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    for (var i = 0; i < count; i++) {
      (function (idx) {
        var angle = (Math.PI * 2 * idx) / count;
        var dist = 40 + Math.random() * 40;
        var tx = Math.cos(angle) * dist;
        var ty = Math.sin(angle) * dist;
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (cx - 4) + 'px';
        p.style.top = (cy - 4) + 'px';
        p.style.background = color;
        p.style.boxShadow = '0 0 8px ' + color;
        p.style.setProperty('--tx', tx + 'px');
        p.style.setProperty('--ty', ty + 'px');
        p.style.animationDelay = (idx * 0.015) + 's';
        els.particleLayer.appendChild(p);
        setTimeout(function () { p.remove(); }, 800);
      })(i);
    }
  }

  function showWaveTransition(n) {
    els.waveTransitionTitle.textContent = 'WAVE ' + n;
    els.waveTransition.classList.remove('show');
    void els.waveTransition.offsetWidth;
    els.waveTransition.classList.add('show');
    setTimeout(function () { els.waveTransition.classList.remove('show'); }, 1000);
  }

  function updateCombo(perfect) {
    var s = window.gameState;
    if (perfect) {
      s.combo += 1;
    } else {
      if (s.combo > 0) log('[콤보 종료] 콤보가 초기화되었습니다.', 'danger');
      s.combo = 0;
    }
    if (s.combo >= 2) {
      els.comboBadge.textContent = 'PERFECT ×' + s.combo;
      els.comboBadge.classList.add('show');
      clearTimeout(els.comboBadge._timer);
      els.comboBadge._timer = setTimeout(function () {
        els.comboBadge.classList.remove('show');
      }, 3000);
    } else {
      els.comboBadge.classList.remove('show');
    }
  }

  function makeKeyboardActivate(el) {
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.keyCode === 13 || ev.keyCode === 32) {
        ev.preventDefault();
        el.click();
      }
    });
  }

  /* ===== 렌더 ===== */
  function renderCastle() {
    var s = window.gameState;
    var pct = Math.max(0, s.castleHp) / s.castleMaxHp * 100;
    els.castleHpFill.style.width = pct + '%';
    els.castleHpFill.classList.remove('warn', 'danger');
    els.castleEmoji.classList.remove('warn', 'danger');
    els.castleStatusLabel.textContent = '';
    els.castleStatusLabel.style.color = '';
    if (pct <= 20) {
      els.castleHpFill.classList.add('danger');
      els.castleEmoji.classList.add('danger');
      els.castleStatusLabel.textContent = '💀 함락 임박';
      els.castleStatusLabel.style.color = 'var(--red)';
    } else if (pct <= 50) {
      els.castleHpFill.classList.add('warn');
      els.castleEmoji.classList.add('warn');
      els.castleStatusLabel.textContent = '⚠️ 위험';
      els.castleStatusLabel.style.color = 'var(--gold)';
    }
    els.statCastleHp.textContent = String(Math.max(0, s.castleHp));
    els.statCastleMaxHp.textContent = String(s.castleMaxHp);
  }

  function renderStats() {
    var s = window.gameState;
    if (s.isEndless || s.wave > s.maxWave) {
      els.statWave.textContent = String(s.wave);
      els.statMaxWave.textContent = '∞';
    } else {
      els.statWave.textContent = String(Math.min(s.wave, s.maxWave));
      els.statMaxWave.textContent = String(s.maxWave);
    }
    els.statGold.textContent = String(s.gold);
    els.shopGold.textContent = String(s.gold);
    renderCastle();
  }

  function renderEnemyPreview() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory || (s.wave > s.maxWave && !s.isEndless)) {
      els.enemyCount.textContent = '—';
      els.enemyDetail.textContent = '게임 종료';
      return;
    }
    var def = getWaveDef(s.wave);
    if (!def || !def.enemies.length) {
      els.enemyCount.textContent = '0 마리';
      els.enemyDetail.textContent = 'HP - / ATK -';
      return;
    }
    var hps = def.enemies.map(function (e) { return e.hp; });
    var atks = def.enemies.map(function (e) { return e.atk; });
    var minHp = Math.min.apply(null, hps);
    var maxHp = Math.max.apply(null, hps);
    var minAtk = Math.min.apply(null, atks);
    var maxAtk = Math.max.apply(null, atks);
    var hpStr = minHp === maxHp ? String(minHp) : minHp + '~' + maxHp;
    var atkStr = minAtk === maxAtk ? String(minAtk) : minAtk + '~' + maxAtk;
    els.enemyCount.textContent = def.enemies.length + ' 마리';
    els.enemyDetail.textContent = 'HP ' + hpStr + ' / ATK ' + atkStr;
  }

  function renderBattlefield() {
    var positions = ['전열', '중열', '후열'];
    var s = window.gameState;
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEl = slotEls[i];
      var contentEl = slotEl.querySelector('.slot-content');
      var w = s.warriors[i];
      var isShopTarget = s.shopMode === 'upgrade';
      var cls = 'slot';
      if (w) {
        cls += ' filled';
        slotEl.querySelector('.slot-pos').textContent = positions[i];
        contentEl.innerHTML =
          '<div class="warrior-emoji">' + w.emoji + '</div>' +
          '<div class="warrior-name">' + w.name + '</div>' +
          '<div class="warrior-stats">HP' + Math.max(0, w.hp) + '/' + w.maxHp + ' ATK' + w.atk + '</div>';
      } else {
        cls += ' empty';
        contentEl.innerHTML = '';
      }
      if (isShopTarget && w) cls += ' shop-target';
      slotEl.className = cls;

      // aria-label 갱신
      if (w) {
        slotEl.setAttribute('aria-label', positions[i] + ' 슬롯, ' + w.name + ', HP ' + Math.max(0, w.hp) + '/' + w.maxHp + ', ATK ' + w.atk);
      } else {
        slotEl.setAttribute('aria-label', positions[i] + ' 슬롯, 비어있음');
      }
    }
  }

  function renderCards() {
    var s = window.gameState;
    var cards = s.availableCards;
    if (!cards || cards.length === 0) {
      els.cardsArea.innerHTML =
        '<div class="card placeholder">카드</div>' +
        '<div class="card placeholder">카드를</div>' +
        '<div class="card placeholder">뽑으세요</div>';
      return;
    }
    els.cardsArea.innerHTML = '';
    for (var i = 0; i < cards.length; i++) {
      (function (idx) {
        var c = cards[idx];
        var cardEl = document.createElement('div');
        var cls = 'card appear rarity-' + c.rarity;
        if (s.selectedCard === c) cardEl.classList.add('selected');
        else if (s.phase === 'DEPLOY' || s.phase === 'END' || s.shopMode === 'upgrade') cls += ' fade-out';
        else if (s.phase !== 'SELECT') cls += ' locked';
        cardEl.className = cls;
        cardEl.setAttribute('data-card-index', String(idx));
        cardEl.id = 'card-choice-' + idx;
        cardEl.setAttribute('tabindex', '0');
        cardEl.setAttribute('role', 'button');
        cardEl.setAttribute('aria-label', c.name + ' 카드, ' + c.rarity + ' 등급, ' + c.desc);
        cardEl.innerHTML =
          '<div class="card-banner">' + c.rarity + '</div>' +
          '<div class="card-inner">' +
            '<div class="card-emoji">' + c.emoji + '</div>' +
            '<div class="card-name">' + c.name + '</div>' +
            '<div class="card-desc">' + c.desc + '</div>' +
          '</div>' +
          '<div class="card-shine"></div>';
        cardEl.addEventListener('click', function () { onCardClick(idx); });
        makeKeyboardActivate(cardEl);
        els.cardsArea.appendChild(cardEl);
      })(i);
    }
  }

  function renderStatusHint() {
    var s = window.gameState;
    var hint = '';
    var cls = '';
    if (s.shopMode === 'upgrade') { hint = '강화할 전사를 선택하세요 (골드 15)'; cls = 'shop'; }
    else if (s.phase === 'DRAW') hint = '카드 뽑기 버튼을 누르세요';
    else if (s.phase === 'SELECT') hint = '카드를 선택하세요';
    else if (s.phase === 'DEPLOY') hint = '배치할 슬롯을 누르세요';
    else if (s.phase === 'END') { hint = '게임 종료 — 결과창을 확인하세요'; cls = 'end'; }
    els.statusHint.textContent = hint;
    els.statusHint.className = cls;
  }

  function renderShop() {
    var s = window.gameState;
    var anyWarrior = s.warriors.some(function (w) { return w && w.hp > 0; });
    els.btnShopReroll.disabled = !(s.phase === 'SELECT' && !s.rerollUsedThisWave && s.gold >= 10 && !s.shopMode);
    els.btnShopUpgrade.disabled = !((s.phase === 'DRAW' || s.phase === 'SELECT') && anyWarrior && s.gold >= 15 && !s.shopMode);
    els.btnShopRepair.disabled = !((s.phase === 'DRAW' || s.phase === 'SELECT') && s.gold >= 8 && s.castleHp < s.castleMaxHp && !s.shopMode);
  }

  function renderButtons() {
    var s = window.gameState;
    els.btnDraw.disabled = (s.phase !== 'DRAW' || s.shopMode !== null);
    els.btnDiscard.disabled = (s.phase !== 'DEPLOY');
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEmpty = s.warriors[i] === null;
      btnDeploy[i].disabled = !(s.phase === 'DEPLOY' && slotEmpty && s.shopMode === null);
    }
    renderShop();
  }

  function render() {
    renderStats();
    renderEnemyPreview();
    renderBattlefield();
    renderCards();
    renderStatusHint();
    renderButtons();
    saveState();
  }

  /* ===== 저장/복원 ===== */
  function saveState() {
    try {
      var s = window.gameState;
      var savePhase = (s.phase === 'SELECT' || s.phase === 'DEPLOY') ? 'DRAW' : s.phase;
      var save = {
        phase: savePhase,
        wave: s.wave,
        gold: s.gold,
        castleHp: s.castleHp,
        warriors: s.warriors,
        maxWaveReached: s.maxWaveReached,
        isEndless: s.isEndless,
        combo: s.combo,
        isGameOver: s.isGameOver,
        isVictory: s.isVictory
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) { /* ignore */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var save = JSON.parse(raw);
      var s = window.gameState;
      s.phase = save.phase || 'DRAW';
      s.wave = save.wave || 1;
      s.gold = save.gold || 0;
      s.castleHp = (typeof save.castleHp === 'number') ? save.castleHp : CASTLE_MAX_HP;
      s.warriors = save.warriors || [null, null, null];
      s.maxWaveReached = save.maxWaveReached || 1;
      s.isEndless = !!save.isEndless;
      s.combo = save.combo || 0;
      s.isGameOver = !!save.isGameOver;
      s.isVictory = !!save.isVictory;
      s.availableCards = [];
      s.selectedCard = null;
      s.shopMode = null;
      s.rerollUsedThisWave = false;
      if (s.isGameOver || s.isVictory) s.phase = 'END';
      if (s.phase !== 'DRAW' && s.phase !== 'END') s.phase = 'DRAW';
      return true;
    } catch (e) { return false; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  /* ===== 카드 뽑기 ===== */
  function allSlotsFull() {
    var s = window.gameState;
    for (var i = 0; i < SLOT_COUNT; i++) {
      if (!s.warriors[i]) return false;
    }
    return true;
  }

  function drawRandomCard() {
    var slotsFull = allSlotsFull();
    var r = Math.random() * 100;
    if (!slotsFull) {
      if (r < 65) return CARD_TANKER;
      if (r < 95) return Math.random() < 0.5 ? CARD_ATK : CARD_HEAL;
      return CARD_HERO;
    }
    // 슬롯이 가득: SUMMON 계열 완전 제외, INSTANT만 등장
    if (r < 50) return CARD_ATK;
    return CARD_HEAL;
  }

  function drawThreeCards() {
    var cards = [drawRandomCard(), drawRandomCard(), drawRandomCard()];
    // 최소 1장 COMMON 보정 (슬롯 여유 있을 때만)
    if (!allSlotsFull()) {
      var hasCommon = false;
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].rarity === 'COMMON') { hasCommon = true; break; }
      }
      if (!hasCommon) cards[0] = CARD_TANKER;
    }
    return cards;
  }

  function onDrawClick() {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'DRAW' || s.shopMode !== null) return;

    s.availableCards = drawThreeCards();
    s.selectedCard = null;
    s.phase = 'SELECT';
    s.lastActionStatus = 'DRAW_SUCCESS';

    var names = [];
    var hasRare = false;
    var hasLegend = false;
    for (var i = 0; i < s.availableCards.length; i++) {
      names.push(s.availableCards[i].name);
      if (s.availableCards[i].rarity === 'RARE') hasRare = true;
      if (s.availableCards[i].rarity === 'LEGEND') hasLegend = true;
    }
    log('[DRAW] Drew 3 cards: ' + names.join(', ') + '.');
    playGacha(hasRare || hasLegend);
    if (hasLegend) {
      playLegend();
      flash('legend');
      var center = document.createElement('div');
      center.style.position = 'fixed';
      center.style.left = '50%';
      center.style.top = '40%';
      document.body.appendChild(center);
      burstParticles(center, '#ffcc00', 20);
      setTimeout(function () { center.remove(); }, 100);
      log('[LEGEND] 전설 카드가 등장했습니다!', 'highlight');
    }
    render();
  }

  function onCardClick(idx) {
    ensureAudio();
    var s = window.gameState;
    if (s.phase !== 'SELECT' || s.shopMode !== null) return;
    if (!s.availableCards || s.availableCards.length === 0) return;
    if (s.selectedCard) return;

    var card = s.availableCards[idx];
    if (!card) return;

    playClick();
    s.selectedCard = card;
    log('[PICK] Picked ' + card.name + '. Effect: ' + card.desc);

    var cardEl = document.getElementById('card-choice-' + idx);
    burstParticles(cardEl, card.rarity === 'RARE' ? '#4a90e2' : (card.rarity === 'LEGEND' ? '#ffcc00' : '#8888a0'), 8);

    if (card.type === 'SUMMON') {
      // 방어: 슬롯 가득인데 SUMMON이 나온 경우 → 자동 discard
      if (allSlotsFull()) {
        log('[경고] 슬롯이 가득 차 SUMMON 카드를 사용할 수 없습니다. 자동으로 버립니다.', 'danger');
        s.selectedCard = null;
        s.availableCards = [];
        s.phase = 'DRAW';
        s.lastActionStatus = 'IDLE';
        render();
        return;
      }
      s.phase = 'DEPLOY';
      s.lastActionStatus = 'PICK_SUCCESS';
      flash('default');
      render();
    } else if (card.type === 'INSTANT') {
      applyInstant(card);
      s.availableCards = [];
      s.selectedCard = null;
      s.lastActionStatus = 'INSTANT_SUCCESS';
      render();
      resolveWave();
    }
  }

  function applyInstant(card) {
    var s = window.gameState;
    if (card.id === 'ATK_BOOST') {
      var count = 0;
      for (var i = 0; i < s.warriors.length; i++) {
        if (s.warriors[i]) { s.warriors[i].atk += 2; count++; }
      }
      log('[EFFECT] 모든 전사 ATK +2 (대상 ' + count + '명)');
      if (count > 0) popDamage('+2 ATK', 'gold');
    } else if (card.id === 'HEAL') {
      var before = s.castleHp;
      s.castleHp = Math.min(s.castleMaxHp, s.castleHp + 5);
      var gained = s.castleHp - before;
      log('[EFFECT] 성 HP +' + gained + ' (HP: ' + s.castleHp + '/' + s.castleMaxHp + ')');
      popDamage('+' + gained + ' HP', 'green');
    }
  }

  function onDeployClick(slotIdx) {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'DEPLOY' || s.shopMode !== null) return;
    if (s.warriors[slotIdx] !== null) return;
    if (!s.selectedCard || !s.selectedCard.warrior) return;

    var w = s.selectedCard.warrior;
    s.warriors[slotIdx] = {
      name: w.name, emoji: w.emoji, hp: w.hp, maxHp: w.maxHp, atk: w.atk
    };
    s.lastActionStatus = 'DEPLOY_SUCCESS';
    log('[DEPLOY] Deployed ' + w.name + ' at slot ' + (slotIdx + 1) + '.');

    s.availableCards = [];
    s.selectedCard = null;
    flash('default');
    render();

    var slotEl = slotEls[slotIdx];
    slotEl.classList.add('deploy-anim');
    burstParticles(slotEl, '#4a90e2', 8);
    setTimeout(function () { slotEl.classList.remove('deploy-anim'); }, 520);

    resolveWave();
  }

  function onDiscard() {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'DEPLOY') return;
    s.selectedCard = null;
    s.availableCards = [];
    s.phase = 'DRAW';
    s.lastActionStatus = 'IDLE';
    log('[DISCARD] 선택한 카드를 버렸습니다.');
    render();
  }

  /* ===== 상점 ===== */
  function onShopReroll() {
    ensureAudio();
    var s = window.gameState;
    if (s.phase !== 'SELECT' || s.rerollUsedThisWave) return;
    if (s.gold < 10) return;
    playClick();
    s.gold -= 10;
    s.rerollUsedThisWave = true;
    s.availableCards = drawThreeCards();
    s.selectedCard = null;
    log('[SHOP] 카드 재뽑기 성공 (10G 소모). 골드: ' + s.gold);
    render();
  }

  function onShopUpgrade() {
    ensureAudio();
    var s = window.gameState;
    if (s.gold < 15) return;
    var anyWarrior = s.warriors.some(function (w) { return w && w.hp > 0; });
    if (!anyWarrior) return;
    playClick();
    s.shopMode = 'upgrade';
    log('[SHOP] 강화할 전사를 선택하세요. (15G)');
    render();
  }

  function onShopRepair() {
    ensureAudio();
    var s = window.gameState;
    if (s.gold < 8) return;
    if (s.castleHp >= s.castleMaxHp) return;
    playClick();
    s.gold -= 8;
    var before = s.castleHp;
    s.castleHp = Math.min(s.castleMaxHp, s.castleHp + 3);
    var gained = s.castleHp - before;
    log('[SHOP] 성벽 보수 성공 (8G 소모). 성 HP +' + gained + ' → ' + s.castleHp + '/' + s.castleMaxHp);
    popDamage('+' + gained + ' HP', 'green', document.querySelector('.castle-panel'));
    render();
  }

  function onSlotUpgradeClick(slotIdx) {
    var s = window.gameState;
    if (s.shopMode !== 'upgrade') return;
    if (!s.warriors[slotIdx]) return;
    if (s.gold < 15) return;
    playClick();
    s.gold -= 15;
    s.warriors[slotIdx].atk += 1;
    s.warriors[slotIdx].hp += 5;
    s.warriors[slotIdx].maxHp += 5;
    log('[SHOP] ' + s.warriors[slotIdx].name + ' 강화 완료! (ATK+1, HP+5, 15G 소모)');
    burstParticles(slotEls[slotIdx], '#ffcc00', 8);
    popDamage('+1 ATK', 'gold', slotEls[slotIdx]);
    s.shopMode = null;
    render();
  }

  /* ===== 전투 ===== */
  function showEnemyRow(enemies) {
    els.enemyRowOverlay.innerHTML = '';
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      var token = document.createElement('div');
      token.className = 'enemy-token' + (e.type === '정예' ? ' elite' : '');
      var emoji = e.type === '정예' ? '👹' : '👺';
      token.innerHTML =
        '<div class="enemy-emoji">' + emoji + '</div>' +
        '<div class="enemy-mini-hp"><div class="enemy-mini-hp-fill" style="width:100%"></div></div>';
      els.enemyRowOverlay.appendChild(token);
    }
    els.enemyRowOverlay.classList.remove('show');
    void els.enemyRowOverlay.offsetWidth;
    els.enemyRowOverlay.classList.add('show');
    setTimeout(function () {
      els.enemyRowOverlay.classList.remove('show');
    }, 1200);
  }

  function resolveWave() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) { s.phase = 'END'; render(); return; }

    var def = getWaveDef(s.wave);
    if (!def) { s.phase = 'END'; render(); return; }

    var currentWave = s.wave;

    var enemies = def.enemies.map(function (e) {
      return { type: e.type, hp: e.hp, maxHp: e.hp, atk: e.atk };
    });

    showEnemyRow(enemies);

    var aliveSlotIdx = [];
    for (var i = SLOT_COUNT - 1; i >= 0; i--) {
      if (s.warriors[i] && s.warriors[i].hp > 0) aliveSlotIdx.push(i);
    }

    log('[COMBAT] Wave ' + currentWave + ' combat begins. Warriors: ' + aliveSlotIdx.length + ', Enemies: ' + enemies.length, 'combat');

    // 1) 전사 공격 (슬롯 역순 → 첫 생존 적)
    for (var w = 0; w < aliveSlotIdx.length; w++) {
      var slotIdx = aliveSlotIdx[w];
      var warrior = s.warriors[slotIdx];
      var targetIdx = -1;
      for (var k = 0; k < enemies.length; k++) {
        if (enemies[k].hp > 0) { targetIdx = k; break; }
      }
      if (targetIdx < 0) break;
      var atk = warrior.atk;
      enemies[targetIdx].hp -= atk;
      log('[COMBAT] ' + warrior.name + '이(가) Enemy ' + (targetIdx + 1) + '(' + enemies[targetIdx].type + ')에게 ' + atk + ' 데미지.', 'combat');
      (function (slotI, idx) {
        setTimeout(function () {
          var slotEl = slotEls[slotI];
          if (slotEl) {
            slotEl.classList.add('hit-anim');
            setTimeout(function () { slotEl.classList.remove('hit-anim'); }, 200);
          }
          playHit();
        }, idx * 80);
      })(slotIdx, w);
    }

    // 2) 살아남은 적 → 전열 전사부터 피격
    var remaining = enemies.filter(function (e) { return e.hp > 0; });
    var totalCastleDmg = 0;

    for (var e = 0; e < remaining.length; e++) {
      var targetSlot = -1;
      for (var sl = 0; sl < SLOT_COUNT; sl++) {
        if (s.warriors[sl] && s.warriors[sl].hp > 0) { targetSlot = sl; break; }
      }
      if (targetSlot < 0) {
        totalCastleDmg += remaining[e].atk;
      } else {
        var target = s.warriors[targetSlot];
        target.hp -= remaining[e].atk;
        log('[COMBAT] Enemy ' + (e + 1) + '(' + remaining[e].type + ')이(가) ' + target.name + '에게 ' + remaining[e].atk + ' 데미지. (HP: ' + Math.max(0, target.hp) + '/' + target.maxHp + ')', 'combat');
        (function (slotI) {
          setTimeout(function () {
            var slotEl = slotEls[slotI];
            if (slotEl) {
              slotEl.classList.add('damage-anim');
              setTimeout(function () { slotEl.classList.remove('damage-anim'); }, 320);
            }
          }, 400 + slotI * 60);
        })(targetSlot);
        if (target.hp <= 0) {
          log('[전사자] ' + target.name + '이(가) 전사했습니다.', 'danger');
          s.warriors[targetSlot] = null;
        }
      }
    }

    if (totalCastleDmg > 0) {
      s.castleHp = Math.max(0, s.castleHp - totalCastleDmg);
      log('[DAMAGE] ' + remaining.length + ' enemies reached castle. -' + totalCastleDmg + ' HP.', 'danger');
      setTimeout(function () {
        flash('danger');
        screenShake();
        popDamage('-' + totalCastleDmg, '', document.querySelector('.castle-panel'));
      }, aliveSlotIdx.length * 80 + 200);
    }

    var perfect = enemies.every(function (en) { return en.hp <= 0; });
    var clutch = s.castleHp > 0 && s.castleHp <= 5;

    // 보상
    var baseGold = def.gold;
    if (perfect) baseGold += 5;
    var comboBonus = 0;
    if (perfect && s.combo >= 1) {
      // combo는 이미 증가되기 전 값 기준 (updateCombo에서 증가)
      comboBonus = Math.min(20, s.combo * 2);
    }
    if (clutch) baseGold *= 2;
    var totalGold = baseGold + comboBonus;
    s.gold += totalGold;

    if (perfect) {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: YES (+' + baseGold + '💰' + (comboBonus > 0 ? ' + 콤보' + comboBonus + '💰' : '') + ')', 'highlight');
      setTimeout(function () {
        flash('victory');
        popDamage('PERFECT! +' + totalGold + '💰', 'gold');
      }, aliveSlotIdx.length * 80 + 300);
      s.lastActionStatus = 'WAVE_PERFECT';
    } else if (clutch) {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO (+' + totalGold + '💰 CLUTCH 2배)', 'highlight');
      s.lastActionStatus = 'WAVE_CLEAR';
    } else {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO (+' + totalGold + '💰)');
      s.lastActionStatus = 'WAVE_CLEAR';
    }

    updateCombo(perfect);
    s.rerollUsedThisWave = false;
    s.shopMode = null;
    s.wave += 1;
    if (s.wave > s.maxWaveReached) s.maxWaveReached = s.wave;

    // 종료 판정
    if (s.castleHp <= 0) {
      s.isGameOver = true;
      s.phase = 'END';
      s.lastActionStatus = 'GAME_OVER';
      if (s.isEndless) {
        log('[GAME OVER] Endless mode ended at wave ' + currentWave + '.', 'danger');
      } else {
        log('[GAME OVER] Castle destroyed at wave ' + currentWave + '.', 'danger');
      }
      playDefeat();
      showResult(false);
    } else if (s.wave > s.maxWave && !s.isEndless) {
      s.isVictory = true;
      s.phase = 'END';
      s.lastActionStatus = 'VICTORY';
      var score = calculateScore();
      log('[VICTORY] All ' + s.maxWave + ' waves cleared. Score: ' + score, 'highlight');
      playVictory();
      showResult(true);
    } else {
      s.phase = 'DRAW';
      if (s.isEndless) log('[ENDLESS] Wave ' + (s.wave - 1) + ' cleared. 다음 웨이브: ' + s.wave);
      log('[TURN] Wave ' + s.wave + ' begins.');
      showWaveTransition(s.wave);
    }

    render();
  }

  function calculateScore() {
    var s = window.gameState;
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) {
      if (s.warriors[i]) warriorsAlive++;
    }
    return s.gold * 10 + s.castleHp * 2 + warriorsAlive * 20 + (s.maxWaveReached - 1) * 30;
  }

  function showResult(isVictory) {
    var s = window.gameState;
    if (isVictory) {
      els.resultBox.className = 'result-box';
      els.resultTitle.textContent = '🏆 VICTORY 🏆';
      els.resultWave.textContent = '도달 웨이브: ' + s.maxWave + ' / ' + s.maxWave;
      els.btnContinue.classList.remove('hidden');
    } else {
      els.resultBox.className = 'result-box defeat';
      els.resultTitle.textContent = '💀 DEFEAT 💀';
      if (s.isEndless) {
        els.resultWave.textContent = '최고 도달 웨이브: ' + (s.wave - 1);
      } else {
        els.resultWave.textContent = '도달 웨이브: ' + (s.wave - 1) + ' / ' + s.maxWave;
      }
      els.btnContinue.classList.add('hidden');
    }
    els.resultScore.textContent = String(calculateScore());
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) { if (s.warriors[i]) warriorsAlive++; }
    els.resultDetail.textContent = '골드 ' + s.gold + ' · 성 HP ' + Math.max(0, s.castleHp) + ' · 생존 전사 ' + warriorsAlive;
    els.resultOverlay.classList.add('show');
  }

  function continueEndless() {
    var s = window.gameState;
    if (!s.isVictory) return;
    s.isVictory = false;
    s.isEndless = true;
    s.phase = 'DRAW';
    els.resultOverlay.classList.remove('show');
    log('[ENDLESS] Endless mode begins at wave ' + s.wave + '.', 'highlight');
    showWaveTransition(s.wave);
    render();
  }

  function resetGame() {
    var s = window.gameState;
    clearSave();
    s.phase = 'DRAW';
    s.wave = 1;
    s.maxWave = MAX_WAVE;
    s.maxWaveReached = 1;
    s.isEndless = false;
    s.castleHp = CASTLE_MAX_HP;
    s.castleMaxHp = CASTLE_MAX_HP;
    s.gold = 0;
    s.warriors = [null, null, null];
    s.availableCards = [];
    s.selectedCard = null;
    s.lastActionStatus = 'IDLE';
    s.isGameOver = false;
    s.isVictory = false;
    s.combo = 0;
    s.rerollUsedThisWave = false;
    s.shopMode = null;
    s.log = [];
    els.output.innerHTML = '';
    els.resultOverlay.classList.remove('show');
    els.comboBadge.classList.remove('show');
    log('[TURN] Wave 1 begins.');
    render();
  }

  /* ===== 사운드 토글 ===== */
  function loadSfxMuted() {
    try {
      var v = localStorage.getItem(SFX_KEY);
      window.gameState.sfxMuted = (v === '1' || v === 'true');
    } catch (e) { window.gameState.sfxMuted = false; }
  }

  function saveSfxMuted() {
    try { localStorage.setItem(SFX_KEY, window.gameState.sfxMuted ? '1' : '0'); } catch (e) { /* ignore */ }
  }

  function updateSfxButton() {
    els.btnSoundToggle.textContent = window.gameState.sfxMuted ? '🔇' : '🔊';
    els.btnSoundToggle.setAttribute('aria-label', window.gameState.sfxMuted ? '음소거 해제' : '음소거');
  }

  function onSoundToggle() {
    window.gameState.sfxMuted = !window.gameState.sfxMuted;
    saveSfxMuted();
    updateSfxButton();
    if (!window.gameState.sfxMuted) {
      ensureAudio();
      playClick();
    }
  }

  /* ===== 이벤트 바인딩 ===== */
  els.btnDraw.addEventListener('click', onDrawClick);
  els.btnDiscard.addEventListener('click', onDiscard);
  els.btnContinue.addEventListener('click', function () {
    ensureAudio(); playClick(); continueEndless();
  });
  els.btnRestart.addEventListener('click', function () {
    ensureAudio(); playClick(); resetGame();
  });
  els.btnSoundToggle.addEventListener('click', onSoundToggle);
  els.btnShopReroll.addEventListener('click', onShopReroll);
  els.btnShopUpgrade.addEventListener('click', onShopUpgrade);
  els.btnShopRepair.addEventListener('click', onShopRepair);

  for (var bi = 0; bi < SLOT_COUNT; bi++) {
    (function (idx) {
      btnDeploy[idx].addEventListener('click', function () { onDeployClick(idx); });
      slotEls[idx].addEventListener('click', function () {
        if (window.gameState.shopMode === 'upgrade') onSlotUpgradeClick(idx);
      });
      makeKeyboardActivate(slotEls[idx]);
    })(bi);
  }

  els.btnDraw.setAttribute('tabindex', '0');
  els.btnDiscard.setAttribute('tabindex', '0');
  els.btnContinue.setAttribute('tabindex', '0');
  els.btnRestart.setAttribute('tabindex', '0');
  els.btnShopReroll.setAttribute('tabindex', '0');
  els.btnShopUpgrade.setAttribute('tabindex', '0');
  els.btnShopRepair.setAttribute('tabindex', '0');

  /* ===== 자가 회귀 테스트 ===== */
  window.runRegressionSuite = function () {
    var results = [];
    var errors = [];

    function record(name, pass, detail) {
      results.push({ name: name, pass: !!pass, detail: detail || '' });
      if (!pass) errors.push(name + (detail ? ' :: ' + detail : ''));
    }

    // 초기화
    resetGame();

    // ===== 기본 상태 =====
    record('초기 phase === DRAW', window.gameState.phase === 'DRAW');
    record('초기 wave === 1', window.gameState.wave === 1);
    record('초기 maxWave === 5', window.gameState.maxWave === 5);
    record('초기 maxWaveReached === 1', window.gameState.maxWaveReached === 1);
    record('초기 isEndless === false', window.gameState.isEndless === false);
    record('초기 castleHp === 50', window.gameState.castleHp === 50);
    record('초기 gold === 0', window.gameState.gold === 0);
    record('#btn-continue DOM 존재', !!els.btnContinue);
    record('#btn-discard DOM 존재', !!els.btnDiscard);
    record('#shop-panel DOM 존재', !!document.getElementById('shop-panel'));
    record('#enemy-row-overlay DOM 존재', !!els.enemyRowOverlay);
    record('#btn-sound-toggle DOM 존재', !!els.btnSoundToggle);
    record('#castle-status-label DOM 존재', !!els.castleStatusLabel);

    // ===== 수정1: 소프트락 방지 (슬롯 3/3에서 SUMMON 미등장) =====
    window.gameState.warriors = [
      { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 },
      { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 },
      { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 }
    ];
    var summonCount = 0;
    for (var t = 0; t < 200; t++) {
      var c = drawRandomCard();
      if (c.type === 'SUMMON') summonCount++;
    }
    record('슬롯 3/3 상태에서 SUMMON 카드 200회 시뮬레이션 결과 0회', summonCount === 0,
      'summonCount=' + summonCount);

    // ===== 수정2: LEGEND 등장 =====
    var legendSeen = false;
    window.gameState.warriors = [null, null, null];
    for (var t2 = 0; t2 < 500; t2++) {
      var c2 = drawRandomCard();
      if (c2.rarity === 'LEGEND') { legendSeen = true; break; }
    }
    record('LEGEND 카드가 500회 내에 등장함', legendSeen);
    record('CARD_HERO 정의 확인 (LEGEND, HERO)', CARD_HERO.rarity === 'LEGEND' && CARD_HERO.id === 'HERO');

    // ===== 수정3: 상점 =====
    resetGame();
    window.gameState.gold = 100;
    window.gameState.phase = 'DRAW';
    // 강화
    window.gameState.warriors[0] = { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 };
    var goldBefore = window.gameState.gold;
    var atkBefore = window.gameState.warriors[0].atk;
    var hpBefore = window.gameState.warriors[0].hp;
    onShopUpgrade();
    record('강화 클릭 시 shopMode === upgrade', window.gameState.shopMode === 'upgrade');
    onSlotUpgradeClick(0);
    record('강화 후 골드 15 차감', window.gameState.gold === goldBefore - 15, 'gold=' + window.gameState.gold);
    record('강화 후 ATK +1', window.gameState.warriors[0].atk === atkBefore + 1);
    record('강화 후 HP +5', window.gameState.warriors[0].hp === hpBefore + 5);
    record('강화 후 shopMode === null', window.gameState.shopMode === null);
    // 보수
    window.gameState.castleHp = 30;
    var goldBefore2 = window.gameState.gold;
    var hpBefore2 = window.gameState.castleHp;
    onShopRepair();
    record('보수 후 골드 8 차감', window.gameState.gold === goldBefore2 - 8);
    record('보수 후 성 HP +3', window.gameState.castleHp === hpBefore2 + 3);
    // 재뽑기
    window.gameState.phase = 'SELECT';
    window.gameState.availableCards = drawThreeCards();
    window.gameState.rerollUsedThisWave = false;
    var goldBefore3 = window.gameState.gold;
    onShopReroll();
    record('재뽑기 후 골드 10 차감', window.gameState.gold === goldBefore3 - 10);
    record('재뽑기 후 rerollUsedThisWave === true', window.gameState.rerollUsedThisWave === true);
    record('재뽑기 후 카드 3장 유지', window.gameState.availableCards.length === 3);

    // ===== 수정4: 전사 사망 =====
    resetGame();
    window.gameState.wave = 3;
    window.gameState.warriors = [
      { name: '탱커', emoji: '🛡️', hp: 5, maxHp: 30, atk: 1 },
      null, null
    ];
    window.gameState.availableCards = [];
    window.gameState.selectedCard = null;
    // resolveWave 직접 호출 (3웨이브, 정예 포함)
    // 탱커 atk 1 → 총 1데미지. 적 4마리 중 3마리 잔존, 각각 atk 합산으로 성/전사 피격
    // 탱커 HP 5 → 첫 적(잡병 atk 3) 타격 시 2, 둘째 적(잡병 atk 3) 타격 시 -1 → 사망
    resolveWave();
    record('전투 후 탱커 슬롯 0이 비워짐 (전사)', window.gameState.warriors[0] === null);
    record('전사 로그 존재', window.gameState.log.some(function (l) {
      return l.indexOf('[전사자]') === 0;
    }));

    // ===== 수정5: 콤보 보상 =====
    resetGame();
    window.gameState.wave = 1;
    window.gameState.warriors = [
      { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 20 },
      null, null
    ];
    window.gameState.availableCards = [];
    window.gameState.selectedCard = null;
    window.gameState.combo = 2;
    var goldBefore4 = window.gameState.gold;
    resolveWave();
    // 콤보 보너스 = min(20, 2*2) = 4
    record('콤보 2에서 웨이브 클리어 시 보너스 골드 획득', window.gameState.gold > goldBefore4 + 5,
      'gold=' + window.gameState.gold);

    // ===== 수정6: enemy-detail 범위 표기 =====
    resetGame();
    window.gameState.wave = 3;
    renderEnemyPreview();
    record('enemy-detail에 물결표(~) 포함 (범위 표기)', els.enemyDetail.textContent.indexOf('~') !== -1,
      'text=' + els.enemyDetail.textContent);

    // ===== 수정7: 접근성 =====
    var meta = document.querySelector('meta[name="viewport"]');
    record('viewport에 maximum-scale 없음', meta && meta.content.indexOf('maximum-scale') === -1);
    record('viewport에 user-scalable 없음', meta && meta.content.indexOf('user-scalable') === -1);
    record('#game-output에 aria-live="polite"', els.output.getAttribute('aria-live') === 'polite');
    record('#status-hint에 aria-live="polite"', els.statusHint.getAttribute('aria-live') === 'polite');
    record('#btn-sound-toggle에 aria-label 존재', !!els.btnSoundToggle.getAttribute('aria-label'));

    // ===== 수정8: localStorage =====
    resetGame();
    window.gameState.wave = 3;
    window.gameState.gold = 42;
    window.gameState.castleHp = 30;
    window.gameState.combo = 1;
    saveState();
    // 상태 변경 후 복원
    window.gameState.wave = 1;
    window.gameState.gold = 0;
    var restored = loadState();
    record('localStorage 복원 성공', restored === true);
    record('복원된 wave === 3', window.gameState.wave === 3, 'wave=' + window.gameState.wave);
    record('복원된 gold === 42', window.gameState.gold === 42, 'gold=' + window.gameState.gold);
    record('복원된 castleHp === 30', window.gameState.castleHp === 30);

    // ===== 수정9: 음소거 =====
    window.gameState.sfxMuted = true;
    var tonePlayed = false;
    var origAudioCtx = audioCtx;
    audioCtx = null;
    try {
      tone(800, 'sine', 0.1, 0.1);
      tonePlayed = false;
    } catch (e) { tonePlayed = false; }
    record('음소거 상태에서 tone() 예외 없이 반환', !tonePlayed);
    window.gameState.sfxMuted = false;
    audioCtx = origAudioCtx;

    // ===== 수정10: 카드 fade-out =====
    resetGame();
    window.gameState.warriors[0] = { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 };
    window.gameState.availableCards = [CARD_TANKER, CARD_ATK, CARD_HEAL];
    window.gameState.selectedCard = CARD_TANKER;
    window.gameState.phase = 'DEPLOY';
    renderCards();
    var notSelectedCards = els.cardsArea.querySelectorAll('.card.fade-out');
    record('DEPLOY 중 비선택 카드에 fade-out 적용', notSelectedCards.length === 2,
      'count=' + notSelectedCards.length);

    // ===== 최종 정리 =====
    var pass = errors.length === 0;
    var report = {
      result: pass ? 'PASS' : 'FAIL',
      totalTests: results.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      failed: results.filter(function (r) { return !r.pass; }).length,
      tests: results,
      errors: errors
    };

    if (pass) console.log('[REGRESSION TEST PASS]');
    else console.log('[REGRESSION TEST FAIL]');
    console.log('Regression report:', report);

    log('[TEST] ================================');
    log('[TEST] Regression Suite: ' + report.result, pass ? 'highlight' : 'danger');
    log('[TEST] Passed: ' + report.passed + ' / ' + report.totalTests);
    if (!pass) {
      for (var ei = 0; ei < errors.length; ei++) log('[TEST FAIL] ' + errors[ei], 'danger');
    } else {
      log('[TEST] All assertions passed.', 'highlight');
    }
    log('[TEST] ================================');

    return report;
  };

  // 하위 호환 (기존 이름으로도 호출 가능)
  window.runPhase1SelfTest = window.runRegressionSuite;

  /* ===== 초기화 ===== */
  loadSfxMuted();
  updateSfxButton();
  var restored = loadState();
  render();
  if (restored) {
    log('[SYSTEM] 이전 게임을 이어서 불러왔습니다.');
    if (window.gameState.phase === 'END') {
      showResult(!!window.gameState.isVictory);
    }
  } else {
    log('[TURN] Wave 1 begins.');
    render();
  }
})();
</script>
</body>
</html>

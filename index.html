<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타이니 워리어 러시</title>
<style>
  :root {
    --bg-deep:      #08080d;
    --bg-primary:   #0d0d12;
    --bg-panel:     #14141f;
    --bg-panel-2:   #1a1a24;
    --bg-inset:     #0a0a12;

    --text-primary: #e8e8ee;
    --text-muted:   #8888a0;
    --text-dim:     #55556a;

    --gold:         #ffcc00;
    --gold-deep:    #a66800;
    --blue:         #4a90e2;
    --blue-deep:    #1a4a8a;
    --red:          #ff3366;
    --red-deep:     #8a1a34;
    --green:        #00ff66;
    --green-deep:   #00883a;

    --border-subtle: #2a2a3a;
    --border-strong: #3a3a4a;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-pill: 999px;

    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.05);
    --shadow-drop:  0 4px 12px rgba(0,0,0,0.5);
    --glow-gold:    0 0 24px rgba(255,204,0,0.6);
    --glow-blue:    0 0 16px rgba(74,144,226,0.5);
    --glow-red:     0 0 20px rgba(255,51,102,0.7);
    --glow-green:   0 0 20px rgba(0,255,102,0.6);

    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', Roboto, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-ui);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 100vh;
    position: relative;
  }

  h1 {
    font-size: 15px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 3px;
    font-weight: 900;
    text-shadow: 0 0 12px rgba(255,204,0,0.6), 0 0 24px rgba(255,204,0,0.3);
  }

  /* ===== 성 패널 ===== */
  .castle-panel {
    background: linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 10px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .castle-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 8px,
      rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 9px
    );
    pointer-events: none;
  }
  .castle-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .castle-emoji {
    font-size: 32px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    transition: filter 0.3s;
  }
  .castle-emoji.warn {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) drop-shadow(0 0 6px var(--gold));
    animation: castleShake 0.4s infinite;
  }
  .castle-emoji.danger {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) drop-shadow(0 0 8px var(--red));
    animation: castleShake 0.3s infinite;
  }
  @keyframes castleShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-1.5px) rotate(-2deg); }
    75% { transform: translateX(1.5px) rotate(2deg); }
  }
  .castle-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  .castle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .castle-row .wave-tag {
    color: var(--gold);
    font-weight: 800;
    font-size: 13px;
    font-family: var(--font-mono);
    letter-spacing: 1px;
  }
  .castle-row .gold-tag {
    color: var(--gold);
    font-weight: 800;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .hp-bar {
    width: 100%;
    height: 18px;
    background: var(--bg-inset);
    border-radius: var(--r-sm);
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-inset);
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ff66 0%, #88ff66 50%, #00ff66 100%);
    transition: width 0.4s cubic-bezier(0.34, 1.2, 0.64, 1), background 0.3s ease;
    border-radius: 7px;
    box-shadow: inset 0 0 8px rgba(0,255,102,0.5);
  }
  .hp-fill.warn {
    background: linear-gradient(90deg, #ffcc00, #ff9900);
    box-shadow: inset 0 0 8px rgba(255,204,0,0.5);
  }
  .hp-fill.danger {
    background: linear-gradient(90deg, #ff3366, #ff0044);
    box-shadow: inset 0 0 12px rgba(255,51,102,0.7);
    animation: pulseRed 0.6s infinite alternate;
  }
  .hp-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: var(--bg-deep);
    text-shadow: 0 0 4px rgba(255,255,255,0.7);
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
  }
  @keyframes pulseRed {
    from { box-shadow: inset 0 0 0 0 rgba(255,51,102,0); }
    to   { box-shadow: inset 0 0 14px 2px rgba(255,51,102,0.8); }
  }

  /* ===== 상태 힌트 ===== */
  #status-hint {
    background: var(--bg-panel-2);
    border: 1px dashed var(--border-strong);
    border-radius: var(--r-sm);
    padding: 8px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.5px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.25s, border-color 0.25s, background 0.25s;
  }
  #status-hint.deploy {
    color: var(--blue);
    border-color: var(--blue);
    background: rgba(74,144,226,0.08);
  }
  #status-hint.end {
    color: var(--red);
    border-color: var(--red);
    background: rgba(255,51,102,0.08);
  }

  /* ===== 전장 슬롯 ===== */
  .battlefield {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--bg-inset);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    padding: 10px 8px;
    min-height: 112px;
  }
  .slot {
    background: var(--bg-panel);
    border: 2px dashed var(--border-subtle);
    border-radius: var(--r-md);
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 4px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .slot .slot-icon {
    position: absolute;
    font-size: 54px;
    opacity: 0.08;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }
  .slot.empty::after {
    content: '빈 슬롯';
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: 700;
    position: relative;
    z-index: 1;
  }
  .slot .slot-pos {
    position: absolute;
    top: 4px;
    left: 6px;
    font-size: 9px;
    color: var(--blue);
    letter-spacing: 0.8px;
    font-weight: 900;
    z-index: 2;
  }
  .slot .slot-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    position: relative;
    z-index: 1;
  }
  .slot.filled {
    border-style: solid;
    border-color: var(--blue);
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: var(--glow-blue);
  }
  .slot.deploy-anim { animation: slotDeploy 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes slotDeploy {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); box-shadow: 0 0 28px rgba(74,144,226,0.9); }
    100% { transform: scale(1); }
  }
  .slot.hit-anim { animation: slotHit 0.18s ease; }
  @keyframes slotHit {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .warrior-emoji {
    font-size: 28px;
    filter: drop-shadow(0 0 6px rgba(74,144,226,0.8));
    position: relative;
    z-index: 1;
  }
  .warrior-name {
    font-size: 10px;
    font-weight: 800;
    color: #a8cfff;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
  }
  .warrior-stats {
    font-size: 9px;
    color: #88a8cc;
    font-family: var(--font-mono);
    font-weight: 700;
    position: relative;
    z-index: 1;
  }

  /* ===== 적 미리보기 ===== */
  .enemy-preview {
    background: linear-gradient(180deg, #1a0f14 0%, #10080c 100%);
    border: 1px solid var(--red-deep);
    border-radius: var(--r-sm);
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  .enemy-preview .label {
    color: #ff6688;
    letter-spacing: 0.8px;
    font-weight: 800;
    font-size: 10px;
  }
  .enemy-preview .count {
    color: var(--red);
    font-weight: 900;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .enemy-preview .detail {
    color: #885566;
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
  }

  /* ===== 카드 ===== */
  .cards-area {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    min-height: 128px;
  }
  .card {
    background: linear-gradient(160deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%);
    border: 2px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 20px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
    min-height: 128px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .card-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 1;
  }
  .card-banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: var(--bg-deep);
    background: var(--border-strong);
    border-radius: 10px 10px 0 0;
    z-index: 2;
  }
  .card.rarity-COMMON .card-banner { background: #4a4a5a; color: #c8c8d8; }
  .card.rarity-RARE   .card-banner { background: var(--blue); color: #0d1a2e; }
  .card.rarity-LEGEND .card-banner { background: var(--gold); color: #2a1a00; }

  .card.rarity-COMMON { border-color: var(--border-strong); }
  .card.rarity-RARE   { border-color: var(--blue); box-shadow: var(--glow-blue); }
  .card.rarity-LEGEND { border-color: var(--gold); box-shadow: var(--glow-gold); }

  .card-shine {
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,204,0,0.25) 40deg, transparent 80deg);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .card.rarity-LEGEND .card-shine {
    opacity: 1;
    animation: legendRotate 3s linear infinite;
  }
  @keyframes legendRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .card.placeholder {
    cursor: default;
    background: var(--bg-panel);
    border-style: dashed;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 700;
    padding: 10px 4px;
  }
  .card.placeholder .card-banner { display: none; }

  .card:not(.placeholder):active { transform: scale(0.94); }

  .card.appear { animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
  .card.appear:nth-child(2) { animation-delay: 0.09s; }
  .card.appear:nth-child(3) { animation-delay: 0.18s; }
  @keyframes cardIn {
    from { transform: translateY(-24px) scale(0.85); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(255,204,0,0.9), 0 0 48px rgba(255,204,0,0.4);
    transform: scale(1.05) rotateZ(-1deg);
  }
  .card.locked {
    opacity: 0.35;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }
  .card-emoji { font-size: 28px; }
  .card-name {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: 0.5px;
  }
  .card-desc {
    font-size: 9px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-weight: 700;
  }

  /* ===== 조작 ===== */
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .deploy-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .deploy-btn {
    min-height: 48px;
    background: var(--bg-panel);
    border: 2px solid var(--border-subtle);
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .deploy-btn:not(:disabled):active { transform: scale(0.94); }
  .deploy-btn:not(:disabled) {
    border-color: var(--blue);
    color: #a8cfff;
    background: linear-gradient(180deg, #1a2a44 0%, #0f1a2e 100%);
    box-shadow: var(--glow-blue);
  }
  .deploy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .deploy-btn .plus { font-size: 16px; display: block; line-height: 1; margin-bottom: 2px; }

  #btn-draw-card {
    min-height: 56px;
    background: linear-gradient(135deg, var(--gold) 0%, #ff9900 100%);
    border: none;
    border-radius: var(--r-md);
    color: var(--bg-deep);
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2.5px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-deep), var(--glow-gold);
    transition: all 0.1s;
    position: relative;
    overflow: hidden;
  }
  #btn-draw-card::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shine 2.5s infinite;
  }
  @keyframes shine {
    0% { left: -60%; }
    60%, 100% { left: 120%; }
  }
  #btn-draw-card:not(:disabled):active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--gold-deep), var(--glow-gold);
  }
  #btn-draw-card:disabled {
    background: var(--border-subtle);
    color: var(--text-dim);
    box-shadow: none;
    cursor: not-allowed;
  }
  #btn-draw-card:disabled::after { display: none; }

  /* ===== 로그 ===== */
  #game-output {
    background: var(--bg-inset);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    height: 130px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
  }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line:last-child { color: var(--gold); }
  .log-line.highlight { color: var(--green); font-weight: 700; }
  .log-line.danger { color: var(--red); font-weight: 700; }
  .log-line.combat { animation: logIn 0.3s ease backwards; }
  @keyframes logIn {
    from { transform: translateX(-6px); opacity: 0.3; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== 플래시 ===== */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--gold);
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    transition: opacity 0.15s;
  }
  #flash.active { opacity: 0.45; }
  #flash.victory { background: var(--green); }
  #flash.danger { background: var(--red); }

  /* ===== 데미지 팝업 ===== */
  .dmg-popup {
    position: fixed;
    font-size: 22px;
    font-weight: 900;
    color: var(--red);
    text-shadow: 0 0 8px rgba(255,51,102,0.9), 2px 2px 0 #000;
    pointer-events: none;
    z-index: 1000;
    animation: dmgFloat 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    font-family: var(--font-mono);
  }
  .dmg-popup.gold { color: var(--gold); text-shadow: 0 0 8px rgba(255,204,0,0.9), 2px 2px 0 #000; }
  .dmg-popup.green { color: var(--green); text-shadow: 0 0 8px rgba(0,255,102,0.9), 2px 2px 0 #000; }
  @keyframes dmgFloat {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    25% { transform: translateY(-12px) scale(1.35); opacity: 1; }
    100% { transform: translateY(-80px) scale(1); opacity: 0; }
  }

  /* ===== 콤보 배지 ===== */
  #combo-badge {
    position: fixed;
    top: 12px;
    right: 12px;
    background: linear-gradient(135deg, var(--gold), #ff9900);
    color: var(--bg-deep);
    font-family: var(--font-mono);
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: var(--r-pill);
    box-shadow: var(--glow-gold);
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
    z-index: 1002;
    transition: opacity 0.25s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #combo-badge.show {
    opacity: 1;
    transform: scale(1);
  }

  /* ===== 웨이브 전환 ===== */
  #wave-transition {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 1003;
    transition: opacity 0.3s;
  }
  #wave-transition.show {
    opacity: 1;
    animation: waveIn 1.0s ease forwards;
  }
  #wave-transition .wave-title {
    font-family: var(--font-ui);
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255,204,0,0.9), 0 0 48px rgba(255,204,0,0.5);
  }
  @keyframes waveIn {
    0% { opacity: 0; }
    20% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== 스크린 셰이크 ===== */
  #app.shake { animation: screenShake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes screenShake {
    10%, 90% { transform: translateX(-3px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  /* ===== 파티클 ===== */
  #particle-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 998;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    opacity: 0;
    animation: particleBurst 0.65s ease-out forwards;
  }
  @keyframes particleBurst {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
  }

  /* ===== 결과 오버레이 ===== */
  #result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    padding: 20px;
  }
  #result-overlay.show { display: flex; }
  .result-box {
    background: var(--bg-panel);
    border: 3px solid var(--gold);
    border-radius: var(--r-lg);
    padding: 26px 20px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 0 40px rgba(255,204,0,0.6), 0 0 80px rgba(255,204,0,0.3);
    animation: resultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes resultPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result-box.defeat {
    border-color: var(--red);
    box-shadow: 0 0 40px rgba(255,51,102,0.6), 0 0 80px rgba(255,51,102,0.3);
  }
  .result-box h2 {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: var(--gold);
    font-weight: 900;
  }
  .result-box.defeat h2 { color: var(--red); }
  .result-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .result-box .score {
    font-size: 30px;
    color: var(--green);
    font-weight: 900;
    margin: 14px 0;
    font-family: var(--font-mono);
    text-shadow: 0 0 12px rgba(0,255,102,0.6);
  }
  .result-btn-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  #btn-continue {
    min-height: 48px;
    padding: 0 24px;
    background: linear-gradient(135deg, var(--green) 0%, #00aa44 100%);
    border: none;
    border-radius: var(--r-md);
    color: var(--bg-deep);
    font-family: var(--font-ui);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--green-deep), var(--glow-green);
  }
  #btn-continue:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-deep), var(--glow-green); }
  #btn-continue.hidden { display: none; }
  #btn-restart {
    min-height: 48px;
    padding: 0 24px;
    background: linear-gradient(135deg, var(--gold) 0%, #ff9900 100%);
    border: none;
    border-radius: var(--r-md);
    color: var(--bg-deep);
    font-family: var(--font-ui);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-deep);
  }
  #btn-restart:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="app">
  <h1>⚔️ TINY WARRIORS RUSH ⚔️</h1>

  <div class="castle-panel">
    <div class="castle-visual">
      <div class="castle-emoji" id="castle-emoji">🏰</div>
    </div>
    <div class="castle-info">
      <div class="castle-row">
        <span class="wave-tag">WAVE <span id="stat-wave">1</span> / <span id="stat-max-wave">5</span></span>
        <span class="gold-tag">💰 <span id="stat-gold">0</span></span>
      </div>
      <div class="hp-bar">
        <div id="castle-hp-fill" class="hp-fill" style="width: 100%;"></div>
        <div class="hp-text">
          <span id="stat-castle-hp">50</span> / <span id="stat-castle-max-hp">50</span>
        </div>
      </div>
    </div>
  </div>

  <div id="status-hint">카드 뽑기 버튼을 누르세요</div>

  <div class="battlefield" id="battlefield">
    <div class="slot empty" id="slot-0" data-slot="0">
      <div class="slot-icon">🛡️</div>
      <span class="slot-pos">전열</span>
      <div class="slot-content"></div>
    </div>
    <div class="slot empty" id="slot-1" data-slot="1">
      <div class="slot-icon">⚔️</div>
      <span class="slot-pos">중열</span>
      <div class="slot-content"></div>
    </div>
    <div class="slot empty" id="slot-2" data-slot="2">
      <div class="slot-icon">🚩</div>
      <span class="slot-pos">후열</span>
      <div class="slot-content"></div>
    </div>
  </div>

  <div class="enemy-preview">
    <span class="label">적 출현</span>
    <span class="count" id="enemy-count">0 마리</span>
    <span class="detail" id="enemy-detail">HP - / ATK -</span>
  </div>

  <div class="cards-area" id="cards-area">
    <div class="card placeholder">카드</div>
    <div class="card placeholder">카드를</div>
    <div class="card placeholder">뽑으세요</div>
  </div>

  <div class="actions">
    <div class="deploy-row">
      <button id="btn-deploy-0" class="deploy-btn" disabled><span class="plus">+</span>전열</button>
      <button id="btn-deploy-1" class="deploy-btn" disabled><span class="plus">+</span>중열</button>
      <button id="btn-deploy-2" class="deploy-btn" disabled><span class="plus">+</span>후열</button>
    </div>
    <button id="btn-draw-card">카드 뽑기</button>
  </div>

  <div id="game-output"></div>
</div>

<div id="flash"></div>
<div id="particle-layer"></div>
<div id="combo-badge">PERFECT ×2</div>
<div id="wave-transition"><div class="wave-title" id="wave-transition-title">WAVE 2</div></div>

<div id="result-overlay">
  <div class="result-box" id="result-box">
    <h2 id="result-title">🏆 VICTORY 🏆</h2>
    <p id="result-wave">도달 웨이브: 5 / 5</p>
    <div class="score" id="result-score">0</div>
    <p id="result-detail"></p>
    <div class="result-btn-row">
      <button id="btn-continue">계속 도전 (무한 모드)</button>
      <button id="btn-restart">처음부터</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAX_WAVE = 5;
  var CASTLE_MAX_HP = 50;
  var SLOT_COUNT = 3;

  var CARD_TANKER = {
    id: 'TANKER', name: '탱커 소환', emoji: '🛡️', rarity: 'COMMON', type: 'SUMMON',
    desc: 'HP30/ATK3',
    warrior: { name: '탱커', emoji: '🛡️', hp: 30, maxHp: 30, atk: 3 }
  };
  var CARD_ATK = {
    id: 'ATK_BOOST', name: '공격 강화', emoji: '⚔️', rarity: 'RARE', type: 'INSTANT',
    desc: '전사 ATK +2'
  };
  var CARD_HEAL = {
    id: 'HEAL', name: '성 회복', emoji: '💚', rarity: 'RARE', type: 'INSTANT',
    desc: '성 HP +5'
  };

  var WAVES = [
    { enemies: [{ hp: 6,  atk: 2 }, { hp: 6,  atk: 2 }] },
    { enemies: [{ hp: 8,  atk: 3 }, { hp: 8,  atk: 3 }, { hp: 8,  atk: 3 }] },
    { enemies: [{ hp: 12, atk: 4 }, { hp: 12, atk: 4 }, { hp: 12, atk: 4 }, { hp: 12, atk: 4 }] },
    { enemies: [{ hp: 14, atk: 4 }, { hp: 14, atk: 4 }, { hp: 14, atk: 4 }, { hp: 14, atk: 4 }] },
    { enemies: [{ hp: 16, atk: 5 }, { hp: 16, atk: 5 }, { hp: 16, atk: 5 }, { hp: 16, atk: 5 }, { hp: 16, atk: 5 }] }
  ];

  window.gameState = {
    phase: 'DRAW',
    wave: 1,
    maxWave: MAX_WAVE,
    maxWaveReached: 1,
    isEndless: false,
    castleHp: CASTLE_MAX_HP,
    castleMaxHp: CASTLE_MAX_HP,
    gold: 0,
    warriors: [null, null, null],
    availableCards: [],
    selectedCard: null,
    lastActionStatus: 'IDLE',
    isGameOver: false,
    isVictory: false,
    combo: 0,
    log: []
  };

  var els = {
    app: document.getElementById('app'),
    statWave: document.getElementById('stat-wave'),
    statMaxWave: document.getElementById('stat-max-wave'),
    statGold: document.getElementById('stat-gold'),
    statCastleHp: document.getElementById('stat-castle-hp'),
    statCastleMaxHp: document.getElementById('stat-castle-max-hp'),
    castleHpFill: document.getElementById('castle-hp-fill'),
    castleEmoji: document.getElementById('castle-emoji'),
    enemyCount: document.getElementById('enemy-count'),
    enemyDetail: document.getElementById('enemy-detail'),
    cardsArea: document.getElementById('cards-area'),
    battlefield: document.getElementById('battlefield'),
    output: document.getElementById('game-output'),
    btnDraw: document.getElementById('btn-draw-card'),
    btnContinue: document.getElementById('btn-continue'),
    btnRestart: document.getElementById('btn-restart'),
    flash: document.getElementById('flash'),
    statusHint: document.getElementById('status-hint'),
    comboBadge: document.getElementById('combo-badge'),
    waveTransition: document.getElementById('wave-transition'),
    waveTransitionTitle: document.getElementById('wave-transition-title'),
    particleLayer: document.getElementById('particle-layer'),
    resultOverlay: document.getElementById('result-overlay'),
    resultBox: document.getElementById('result-box'),
    resultTitle: document.getElementById('result-title'),
    resultWave: document.getElementById('result-wave'),
    resultScore: document.getElementById('result-score'),
    resultDetail: document.getElementById('result-detail')
  };

  var btnDeploy = [
    document.getElementById('btn-deploy-0'),
    document.getElementById('btn-deploy-1'),
    document.getElementById('btn-deploy-2')
  ];

  /* ===== Web Audio API ===== */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function tone(freq, type, duration, gain, freqEnd) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      if (freqEnd !== undefined) {
        osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
      }
      g.gain.value = gain;
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* ignore */ }
  }

  function playClick() { tone(800, 'sine', 0.06, 0.05); }
  function playHit() { tone(200, 'square', 0.1, 0.06, 120); }
  function playGacha(rare) { tone(rare ? 800 : 400, 'sine', 0.3, 0.06, rare ? 1600 : 1200); }
  function playVictory() {
    tone(523, 'sine', 0.1, 0.08);
    setTimeout(function () { tone(659, 'sine', 0.1, 0.08); }, 100);
    setTimeout(function () { tone(784, 'sine', 0.2, 0.08); }, 200);
  }
  function playDefeat() { tone(300, 'square', 0.4, 0.08, 100); }

  /* ===== 로그 ===== */
  function log(text, cls) {
    var div = document.createElement('div');
    div.className = 'log-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    els.output.appendChild(div);
    while (els.output.children.length > 200) {
      els.output.removeChild(els.output.firstChild);
    }
    els.output.scrollTop = els.output.scrollHeight;
    window.gameState.log.push(text);
    if (window.gameState.log.length > 500) window.gameState.log.shift();
  }

  function flash(color) {
    els.flash.className = '';
    void els.flash.offsetWidth;
    els.flash.classList.add('active');
    if (color === 'victory') els.flash.classList.add('victory');
    else if (color === 'danger') els.flash.classList.add('danger');
    setTimeout(function () { els.flash.classList.remove('active'); }, 150);
  }

  function screenShake() {
    els.app.classList.remove('shake');
    void els.app.offsetWidth;
    els.app.classList.add('shake');
    setTimeout(function () { els.app.classList.remove('shake'); }, 320);
  }

  function popDamage(text, color, anchorEl) {
    var pop = document.createElement('div');
    pop.className = 'dmg-popup' + (color ? ' ' + color : '');
    pop.textContent = text;
    if (anchorEl) {
      var rect = anchorEl.getBoundingClientRect();
      pop.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      pop.style.top = (rect.top + rect.height / 2 - 10) + 'px';
    } else {
      pop.style.left = (window.innerWidth / 2 - 20) + 'px';
      pop.style.top = (window.innerHeight / 2 - 10) + 'px';
    }
    document.body.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 950);
  }

  function burstParticles(anchorEl, color) {
    if (!anchorEl) return;
    var rect = anchorEl.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    for (var i = 0; i < 8; i++) {
      (function (idx) {
        var angle = (Math.PI * 2 * idx) / 8;
        var dist = 40 + Math.random() * 20;
        var tx = Math.cos(angle) * dist;
        var ty = Math.sin(angle) * dist;
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (cx - 4) + 'px';
        p.style.top = (cy - 4) + 'px';
        p.style.background = color;
        p.style.boxShadow = '0 0 8px ' + color;
        p.style.setProperty('--tx', tx + 'px');
        p.style.setProperty('--ty', ty + 'px');
        p.style.animationDelay = (idx * 0.02) + 's';
        els.particleLayer.appendChild(p);
        setTimeout(function () { p.remove(); }, 800);
      })(i);
    }
  }

  function showWaveTransition(n) {
    els.waveTransitionTitle.textContent = 'WAVE ' + n;
    els.waveTransition.classList.remove('show');
    void els.waveTransition.offsetWidth;
    els.waveTransition.classList.add('show');
    setTimeout(function () { els.waveTransition.classList.remove('show'); }, 1000);
  }

  function updateCombo(perfect) {
    var s = window.gameState;
    if (perfect) {
      s.combo += 1;
    } else {
      s.combo = 0;
    }
    if (s.combo >= 2) {
      els.comboBadge.textContent = 'PERFECT ×' + s.combo;
      els.comboBadge.classList.add('show');
      clearTimeout(els.comboBadge._timer);
      els.comboBadge._timer = setTimeout(function () {
        els.comboBadge.classList.remove('show');
      }, 3000);
    } else {
      els.comboBadge.classList.remove('show');
    }
  }

  /* ===== 웨이브 정의 (무한 모드 포함) ===== */
  function getWaveDef(waveNum) {
    if (waveNum <= MAX_WAVE) {
      return WAVES[waveNum - 1];
    }
    // 무한 모드 (wave >= 6)
    var over = waveNum - MAX_WAVE;
    var count = Math.min(8, 5 + Math.floor(over / 2));
    var hp = 16 + over * 3;
    var atk = 5 + Math.floor(over / 3);
    var enemies = [];
    for (var i = 0; i < count; i++) {
      enemies.push({ hp: hp, atk: atk });
    }
    return { enemies: enemies, endless: true };
  }

  function getWaveReward(waveNum) {
    if (waveNum <= MAX_WAVE) return 5;
    return 5 + Math.floor((waveNum - MAX_WAVE) / 2);
  }

  /* ===== 렌더링 ===== */
  function renderCastle() {
    var pct = Math.max(0, window.gameState.castleHp) / window.gameState.castleMaxHp * 100;
    els.castleHpFill.style.width = pct + '%';
    els.castleHpFill.classList.remove('warn', 'danger');
    els.castleEmoji.classList.remove('warn', 'danger');
    if (pct <= 20) {
      els.castleHpFill.classList.add('danger');
      els.castleEmoji.classList.add('danger');
    } else if (pct <= 50) {
      els.castleHpFill.classList.add('warn');
      els.castleEmoji.classList.add('warn');
    }
    els.statCastleHp.textContent = String(Math.max(0, window.gameState.castleHp));
    els.statCastleMaxHp.textContent = String(window.gameState.castleMaxHp);
  }

  function renderStats() {
    var s = window.gameState;
    if (s.isEndless || s.wave > s.maxWave) {
      els.statWave.textContent = String(s.wave);
      els.statMaxWave.textContent = '∞';
    } else {
      els.statWave.textContent = String(Math.min(s.wave, s.maxWave));
      els.statMaxWave.textContent = String(s.maxWave);
    }
    els.statGold.textContent = String(s.gold);
    renderCastle();
  }

  function renderEnemyPreview() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory || (s.wave > s.maxWave && !s.isEndless)) {
      els.enemyCount.textContent = '—';
      els.enemyDetail.textContent = '게임 종료';
      return;
    }
    var def = getWaveDef(s.wave);
    if (!def) {
      els.enemyCount.textContent = '0 마리';
      els.enemyDetail.textContent = 'HP - / ATK -';
      return;
    }
    els.enemyCount.textContent = def.enemies.length + ' 마리';
    els.enemyDetail.textContent = 'HP ' + def.enemies[0].hp + ' / ATK ' + def.enemies[0].atk;
  }

  function renderBattlefield() {
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEl = document.getElementById('slot-' + i);
      var contentEl = slotEl.querySelector('.slot-content');
      var w = window.gameState.warriors[i];
      if (w) {
        slotEl.className = 'slot filled';
        var posLabels = ['전열', '중열', '후열'];
        slotEl.querySelector('.slot-pos').textContent = posLabels[i];
        contentEl.innerHTML =
          '<div class="warrior-emoji">' + w.emoji + '</div>' +
          '<div class="warrior-name">' + w.name + '</div>' +
          '<div class="warrior-stats">HP' + w.hp + ' ATK' + w.atk + '</div>';
      } else {
        slotEl.className = 'slot empty';
        contentEl.innerHTML = '';
      }
    }
  }

  function renderCards() {
    var s = window.gameState;
    var cards = s.availableCards;
    if (!cards || cards.length === 0) {
      els.cardsArea.innerHTML =
        '<div class="card placeholder">카드</div>' +
        '<div class="card placeholder">카드를</div>' +
        '<div class="card placeholder">뽑으세요</div>';
      return;
    }
    els.cardsArea.innerHTML = '';
    for (var i = 0; i < cards.length; i++) {
      (function (idx) {
        var c = cards[idx];
        var cardEl = document.createElement('div');
        cardEl.className = 'card appear rarity-' + c.rarity;
        if (s.selectedCard === c) cardEl.classList.add('selected');
        if (s.phase !== 'SELECT') cardEl.classList.add('locked');
        cardEl.setAttribute('data-card-index', String(idx));
        cardEl.id = 'card-choice-' + idx;
        cardEl.innerHTML =
          '<div class="card-banner">' + c.rarity + '</div>' +
          '<div class="card-inner">' +
            '<div class="card-emoji">' + c.emoji + '</div>' +
            '<div class="card-name">' + c.name + '</div>' +
            '<div class="card-desc">' + c.desc + '</div>' +
          '</div>' +
          '<div class="card-shine"></div>';
        cardEl.addEventListener('click', function () { onCardClick(idx); });
        els.cardsArea.appendChild(cardEl);
      })(i);
    }
  }

  function renderStatusHint() {
    var s = window.gameState;
    var hint = '';
    if (s.phase === 'DRAW') hint = '카드 뽑기 버튼을 누르세요';
    else if (s.phase === 'SELECT') hint = '카드를 선택하세요';
    else if (s.phase === 'DEPLOY') hint = '배치할 슬롯을 누르세요';
    else if (s.phase === 'END') hint = '게임 종료 — 결과창을 확인하세요';
    els.statusHint.textContent = hint;
    els.statusHint.className = '';
    if (s.phase === 'DEPLOY') els.statusHint.classList.add('deploy');
    else if (s.phase === 'END') els.statusHint.classList.add('end');
  }

  function renderButtons() {
    var s = window.gameState;
    els.btnDraw.disabled = (s.phase !== 'DRAW');
    for (var i = 0; i < SLOT_COUNT; i++) {
      var slotEmpty = s.warriors[i] === null;
      btnDeploy[i].disabled = !(s.phase === 'DEPLOY' && slotEmpty);
    }
  }

  function render() {
    renderStats();
    renderEnemyPreview();
    renderBattlefield();
    renderCards();
    renderStatusHint();
    renderButtons();
  }

  /* ===== 카드 뽑기 ===== */
  function drawRandomCard() {
    var r = Math.random() * 100;
    if (r < 70) return CARD_TANKER;
    if (r < 95) return CARD_ATK;
    return CARD_HEAL;
  }

  function drawThreeCards() {
    var cards = [drawRandomCard(), drawRandomCard(), drawRandomCard()];
    var hasCommon = false;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].rarity === 'COMMON') { hasCommon = true; break; }
    }
    if (!hasCommon) cards[0] = CARD_TANKER;
    return cards;
  }

  function onDrawClick() {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'DRAW') return;

    s.availableCards = drawThreeCards();
    s.selectedCard = null;
    s.phase = 'SELECT';
    s.lastActionStatus = 'DRAW_SUCCESS';

    var names = [];
    var hasRare = false;
    for (var i = 0; i < s.availableCards.length; i++) {
      names.push(s.availableCards[i].name);
      if (s.availableCards[i].rarity === 'RARE' || s.availableCards[i].rarity === 'LEGEND') hasRare = true;
    }
    log('[DRAW] Drew 3 cards: ' + names.join(', ') + '.');
    playGacha(hasRare);
    render();
  }

  function onCardClick(idx) {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'SELECT') return;
    if (!s.availableCards || s.availableCards.length === 0) return;
    if (s.selectedCard) return;

    var card = s.availableCards[idx];
    if (!card) return;

    s.selectedCard = card;
    log('[PICK] Picked ' + card.name + '. Effect: ' + card.desc);

    var cardEl = document.getElementById('card-choice-' + idx);
    burstParticles(cardEl, card.rarity === 'RARE' ? '#4a90e2' : '#ffcc00');

    if (card.type === 'SUMMON') {
      s.phase = 'DEPLOY';
      s.lastActionStatus = 'PICK_SUCCESS';
      flash('default');
      render();
    } else if (card.type === 'INSTANT') {
      applyInstant(card);
      s.availableCards = [];
      s.selectedCard = null;
      s.lastActionStatus = 'INSTANT_SUCCESS';
      render();
      resolveWave();
    }
  }

  function applyInstant(card) {
    var s = window.gameState;
    if (card.id === 'ATK_BOOST') {
      var count = 0;
      for (var i = 0; i < s.warriors.length; i++) {
        if (s.warriors[i]) { s.warriors[i].atk += 2; count++; }
      }
      log('[EFFECT] 전사 ATK +2 (대상 ' + count + '명)');
      if (count > 0) popDamage('+2 ATK', 'gold');
    } else if (card.id === 'HEAL') {
      var before = s.castleHp;
      s.castleHp = Math.min(s.castleMaxHp, s.castleHp + 5);
      var gained = s.castleHp - before;
      log('[EFFECT] 성 HP +' + gained + ' (HP: ' + s.castleHp + '/' + s.castleMaxHp + ')');
      popDamage('+' + gained + ' HP', 'green');
    }
  }

  function onDeployClick(slotIdx) {
    ensureAudio();
    playClick();
    var s = window.gameState;
    if (s.phase !== 'DEPLOY') return;
    if (s.warriors[slotIdx] !== null) return;
    if (!s.selectedCard || !s.selectedCard.warrior) return;

    var w = s.selectedCard.warrior;
    s.warriors[slotIdx] = {
      name: w.name, emoji: w.emoji, hp: w.hp, maxHp: w.maxHp, atk: w.atk
    };
    s.lastActionStatus = 'DEPLOY_SUCCESS';
    log('[DEPLOY] Deployed ' + w.name + ' at slot ' + (slotIdx + 1) + '.');

    s.availableCards = [];
    s.selectedCard = null;
    flash('default');
    render();

    var slotEl = document.getElementById('slot-' + slotIdx);
    slotEl.classList.add('deploy-anim');
    burstParticles(slotEl, '#4a90e2');
    setTimeout(function () { slotEl.classList.remove('deploy-anim'); }, 520);

    resolveWave();
  }

  function resolveWave() {
    var s = window.gameState;
    if (s.isGameOver || s.isVictory) {
      s.phase = 'END';
      render();
      return;
    }

    var def = getWaveDef(s.wave);
    if (!def) {
      s.phase = 'END';
      render();
      return;
    }

    var currentWave = s.wave;

    var enemies = [];
    for (var k = 0; k < def.enemies.length; k++) {
      enemies.push({ hp: def.enemies[k].hp, atk: def.enemies[k].atk, maxHp: def.enemies[k].hp });
    }

    var aliveWarriors = [];
    var warriorSlotIdx = [];
    for (var i = SLOT_COUNT - 1; i >= 0; i--) {
      if (s.warriors[i]) {
        aliveWarriors.push(s.warriors[i]);
        warriorSlotIdx.push(i);
      }
    }

    log('[COMBAT] Wave ' + currentWave + ' combat begins. Warriors: ' + aliveWarriors.length + ', Enemies: ' + enemies.length, 'combat');

    for (var w = 0; w < aliveWarriors.length; w++) {
      var targetIdx = -1;
      for (var j = 0; j < enemies.length; j++) {
        if (enemies[j].hp > 0) { targetIdx = j; break; }
      }
      if (targetIdx < 0) break;
      var atk = aliveWarriors[w].atk;
      enemies[targetIdx].hp -= atk;
      log('[COMBAT] ' + aliveWarriors[w].name + ' dealt ' + atk + ' damage to Enemy ' + (targetIdx + 1) + '.', 'combat');

      (function (slotI) {
        setTimeout(function () {
          var slotEl = document.getElementById('slot-' + slotI);
          if (slotEl) {
            slotEl.classList.add('hit-anim');
            setTimeout(function () { slotEl.classList.remove('hit-anim'); }, 200);
          }
          playHit();
        }, w * 80);
      })(warriorSlotIdx[w]);
    }

    var remaining = [];
    for (var m = 0; m < enemies.length; m++) {
      if (enemies[m].hp > 0) remaining.push(enemies[m]);
    }

    var perfect = remaining.length === 0;
    var dmgToCastle = 0;
    for (var n = 0; n < remaining.length; n++) dmgToCastle += remaining[n].atk;

    if (dmgToCastle > 0) {
      s.castleHp = Math.max(0, s.castleHp - dmgToCastle);
      log('[DAMAGE] ' + remaining.length + ' enemies reached castle. -' + dmgToCastle + ' HP.', 'danger');
      setTimeout(function () {
        flash('danger');
        screenShake();
        popDamage('-' + dmgToCastle, '', null);
      }, aliveWarriors.length * 80);
    }

    var clutch = s.castleHp > 0 && s.castleHp <= 5;
    var baseGold = getWaveReward(currentWave);
    if (perfect) baseGold += 5;
    if (clutch) baseGold *= 2;
    s.gold += baseGold;

    if (perfect) {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: YES', 'highlight');
      setTimeout(function () {
        flash('victory');
        popDamage('PERFECT! +' + baseGold + '💰', 'gold');
      }, aliveWarriors.length * 80 + 100);
      s.lastActionStatus = 'WAVE_PERFECT';
    } else if (clutch) {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO', 'highlight');
      log('[CLUTCH] 성 HP 5 이하! 골드 2배 (+' + baseGold + ')', 'highlight');
      setTimeout(function () {
        popDamage('CLUTCH! +' + baseGold + '💰', 'gold');
      }, aliveWarriors.length * 80 + 100);
      s.lastActionStatus = 'WAVE_CLEAR';
    } else {
      log('[WAVE] Wave ' + currentWave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '. Perfect: NO');
      s.lastActionStatus = 'WAVE_CLEAR';
    }

    updateCombo(perfect);
    s.wave += 1;
    if (s.wave > s.maxWaveReached) s.maxWaveReached = s.wave;

    // 종료 판정
    if (s.castleHp <= 0) {
      s.isGameOver = true;
      s.phase = 'END';
      s.lastActionStatus = 'GAME_OVER';
      if (s.isEndless) {
        log('[GAME OVER] Endless mode ended at wave ' + currentWave + '.', 'danger');
      } else {
        log('[GAME OVER] Castle destroyed at wave ' + currentWave + '.', 'danger');
      }
      playDefeat();
      showResult(false);
    } else if (s.wave > s.maxWave && !s.isEndless) {
      // 기본 클리어 (무한 모드 미진입 상태에서 웨이브 5 완료)
      s.isVictory = true;
      s.phase = 'END';
      s.lastActionStatus = 'VICTORY';
      var score = calculateScore();
      log('[VICTORY] All ' + s.maxWave + ' waves cleared. Score: ' + score, 'highlight');
      playVictory();
      showResult(true);
    } else if (s.isEndless) {
      // 무한 모드 진행
      s.phase = 'DRAW';
      log('[ENDLESS] Wave ' + s.wave + ' cleared. Castle HP: ' + s.castleHp + '/' + s.castleMaxHp + '.');
      log('[TURN] Wave ' + s.wave + ' begins.');
      showWaveTransition(s.wave);
    } else {
      s.phase = 'DRAW';
      log('[TURN] Wave ' + s.wave + ' begins.');
      showWaveTransition(s.wave);
    }

    render();
  }

  function calculateScore() {
    var s = window.gameState;
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) {
      if (s.warriors[i]) warriorsAlive++;
    }
    return s.gold * 10 + s.castleHp * 2 + warriorsAlive * 20 + (s.maxWaveReached - 1) * 30;
  }

  function showResult(isVictory) {
    var s = window.gameState;
    if (isVictory) {
      els.resultBox.className = 'result-box';
      els.resultTitle.textContent = '🏆 VICTORY 🏆';
      els.resultWave.textContent = '도달 웨이브: ' + s.maxWave + ' / ' + s.maxWave;
      els.btnContinue.classList.remove('hidden');
    } else {
      els.resultBox.className = 'result-box defeat';
      els.resultTitle.textContent = '💀 DEFEAT 💀';
      if (s.isEndless) {
        els.resultWave.textContent = '최고 도달 웨이브: ' + (s.wave - 1);
      } else {
        els.resultWave.textContent = '도달 웨이브: ' + (s.wave - 1) + ' / ' + s.maxWave;
      }
      els.btnContinue.classList.add('hidden');
    }
    els.resultScore.textContent = String(calculateScore());
    var warriorsAlive = 0;
    for (var i = 0; i < s.warriors.length; i++) { if (s.warriors[i]) warriorsAlive++; }
    els.resultDetail.textContent = '골드 ' + s.gold + ' · 성 HP ' + Math.max(0, s.castleHp) + ' · 생존 전사 ' + warriorsAlive;
    els.resultOverlay.classList.add('show');
  }

  function continueEndless() {
    var s = window.gameState;
    if (!s.isVictory) return;
    s.isVictory = false;
    s.isEndless = true;
    s.phase = 'DRAW';
    els.resultOverlay.classList.remove('show');
    log('[ENDLESS] Endless mode begins at wave ' + s.wave + '.', 'highlight');
    showWaveTransition(s.wave);
    render();
  }

  function resetGame() {
    var s = window.gameState;
    s.phase = 'DRAW';
    s.wave = 1;
    s.maxWave = MAX_WAVE;
    s.maxWaveReached = 1;
    s.isEndless = false;
    s.castleHp = CASTLE_MAX_HP;
    s.castleMaxHp = CASTLE_MAX_HP;
    s.gold = 0;
    s.warriors = [null, null, null];
    s.availableCards = [];
    s.selectedCard = null;
    s.lastActionStatus = 'IDLE';
    s.isGameOver = false;
    s.isVictory = false;
    s.combo = 0;
    s.log = [];
    els.output.innerHTML = '';
    els.resultOverlay.classList.remove('show');
    els.comboBadge.classList.remove('show');
    log('[TURN] Wave 1 begins.');
    render();
  }

  els.btnDraw.addEventListener('click', onDrawClick);
  els.btnContinue.addEventListener('click', function () {
    ensureAudio();
    playClick();
    continueEndless();
  });
  els.btnRestart.addEventListener('click', function () {
    ensureAudio();
    playClick();
    resetGame();
  });

  for (var bi = 0; bi < SLOT_COUNT; bi++) {
    (function (idx) {
      btnDeploy[idx].addEventListener('click', function () { onDeployClick(idx); });
    })(bi);
  }

  window.runPhase1SelfTest = function () {
    var results = [];
    var errors = [];

    function record(name, pass, detail) {
      results.push({ name: name, pass: !!pass, detail: detail || '' });
      if (!pass) errors.push(name + (detail ? ' :: ' + detail : ''));
    }

    resetGame();

    record('초기 phase === DRAW', window.gameState.phase === 'DRAW', 'phase=' + window.gameState.phase);
    record('초기 wave === 1', window.gameState.wave === 1, 'wave=' + window.gameState.wave);
    record('초기 maxWave === 5', window.gameState.maxWave === 5, 'maxWave=' + window.gameState.maxWave);
    record('초기 maxWaveReached === 1', window.gameState.maxWaveReached === 1,
      'maxWaveReached=' + window.gameState.maxWaveReached);
    record('초기 isEndless === false', window.gameState.isEndless === false);
    record('초기 castleHp === 50', window.gameState.castleHp === 50);
    record('초기 gold === 0', window.gameState.gold === 0);
    record('초기 draw 버튼 활성', els.btnDraw.disabled === false);
    record('초기 deploy-0 비활성', btnDeploy[0].disabled === true);
    record('초기 deploy-1 비활성', btnDeploy[1].disabled === true);
    record('초기 deploy-2 비활성', btnDeploy[2].disabled === true);

    record('#btn-continue DOM 존재', !!els.btnContinue);
    record('#status-hint 초기 문구', els.statusHint.textContent === '카드 뽑기 버튼을 누르세요');
    record('#combo-badge DOM 존재', !!els.comboBadge);
    record('#wave-transition DOM 존재', !!els.waveTransition);
    record('#castle-hp-fill에 hp-fill 클래스', els.castleHpFill.className.indexOf('hp-fill') !== -1);
    record('--gold 토큰 = #ffcc00',
      getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() === '#ffcc00');

    els.btnDraw.click();
    record('뽑기 후 phase === SELECT', window.gameState.phase === 'SELECT');
    record('뽑기 후 카드 3장', window.gameState.availableCards.length === 3);
    record('뽑기 후 draw 버튼 비활성', els.btnDraw.disabled === true);

    var tankerIdx = -1;
    for (var i = 0; i < window.gameState.availableCards.length; i++) {
      if (window.gameState.availableCards[i].id === 'TANKER') { tankerIdx = i; break; }
    }
    record('COMMON 카드 존재', tankerIdx >= 0);

    if (tankerIdx >= 0) {
      var cardEl = document.getElementById('card-choice-' + tankerIdx);
      if (cardEl) cardEl.click();
    }
    record('선택 후 phase === DEPLOY', window.gameState.phase === 'DEPLOY');
    record('선택 후 selectedCard.id === TANKER',
      window.gameState.selectedCard && window.gameState.selectedCard.id === 'TANKER');

    record('배치 전 deploy-0 활성', btnDeploy[0].disabled === false);
    var waveBefore = window.gameState.wave;
    var goldBefore = window.gameState.gold;
    btnDeploy[0].click();

    record('배치 후 warriors[0].name === 탱커',
      window.gameState.warriors[0] && window.gameState.warriors[0].name === '탱커');
    record('배치 후 wave === ' + (waveBefore + 1),
      window.gameState.wave === waveBefore + 1,
      'wave=' + window.gameState.wave);
    record('배치 후 gold > 0', window.gameState.gold > goldBefore,
      'gold=' + window.gameState.gold);
    record('배치 후 phase === DRAW', window.gameState.phase === 'DRAW');
    record('maxWaveReached === 2', window.gameState.maxWaveReached === 2,
      'maxWaveReached=' + window.gameState.maxWaveReached);

    record('#stat-wave 텍스트가 2', els.statWave.textContent === '2',
      'dom=' + els.statWave.textContent);
    record('#btn-draw-card 재활성', els.btnDraw.disabled === false);

    // 무한 모드 진입 시뮬레이션
    window.gameState.isVictory = true;
    window.gameState.phase = 'END';
    els.btnContinue.classList.remove('hidden');
    els.btnContinue.click();
    record('계속 도전 후 isEndless === true', window.gameState.isEndless === true);
    record('계속 도전 후 isVictory === false', window.gameState.isVictory === false);
    record('계속 도전 후 phase === DRAW', window.gameState.phase === 'DRAW');

    var pass = errors.length === 0;
    var report = {
      result: pass ? 'PASS' : 'FAIL',
      totalTests: results.length,
      passed: results.filter(function (r) { return r.pass; }).length,
      failed: results.filter(function (r) { return !r.pass; }).length,
      tests: results,
      errors: errors,
      finalState: {
        phase: window.gameState.phase,
        wave: window.gameState.wave,
        maxWave: window.gameState.maxWave,
        maxWaveReached: window.gameState.maxWaveReached,
        isEndless: window.gameState.isEndless,
        castleHp: window.gameState.castleHp,
        gold: window.gameState.gold
      }
    };

    if (pass) console.log('[PHASE 1 TEST PASS]');
    else console.log('[PHASE 1 TEST FAIL]');
    console.log('Self-test report:', report);

    log('[TEST] ================================');
    log('[TEST] Phase 1 Self-Test: ' + report.result, pass ? 'highlight' : 'danger');
    log('[TEST] Passed: ' + report.passed + ' / ' + report.totalTests);
    if (!pass) {
      for (var e = 0; e < errors.length; e++) log('[TEST FAIL] ' + errors[e], 'danger');
    } else {
      log('[TEST] All assertions passed.', 'highlight');
    }
    log('[TEST] ================================');

    return report;
  };

  resetGame();
})();
</script>
